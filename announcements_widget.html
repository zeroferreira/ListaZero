  <script>
    (function () {
      const safeStorage = (() => {
        const mem = {};
        try {
          const k = '__zero_ads_w__';
          window.localStorage.setItem(k, k);
          window.localStorage.removeItem(k);
          return window.localStorage;
        } catch (_) {
          return {
            getItem: (k) => mem[k] || null,
            setItem: (k, v) => { mem[k] = String(v); },
            removeItem: (k) => { delete mem[k]; }
          };
        }
      })();

      const STORAGE_KEY = 'zero_announcements_widget_config';
      const urlParams = new URLSearchParams(window.location.search);
      const isPreviewMode = urlParams.get('preview') === '1';
      const supportsSiblingIndex = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('animation-delay: calc(sibling-index() * 0.1s)');

      let bcChannel = null;
      try {
        if (!isPreviewMode && typeof BroadcastChannel !== 'undefined') {
          bcChannel = new BroadcastChannel('zero_ads_widget_channel');
        }
      } catch (_) {}

      const BANNER_STYLES = [
        'kinetic-glass',
        'cyber-hud',
        'neon-capsule',
        'royal-gold',
        'radio-eq',
        'hologram-prism',
        'fire-energy',
        'minimal-floating',
        'mg-lower-third',
        'mg-kinetic',
        'mg-glass-pill',
        'mg-vector-hud',
        'mg-mono-noir',
        'mg-mono-white'
      ];

      const BANNER_STYLE_LABELS = {
        'kinetic-glass': '✨ Cartel: Cristal Dinámico 3D',
        'cyber-hud': '⚡ Cartel: Cyberpunk Broadcast HUD',
        'neon-capsule': '🌈 Cartel: Cápsula Plasma Neón',
        'royal-gold': '👑 Cartel: VIP Imperial 3D',
        'radio-eq': '🎚️ Cartel: Estudio Radio FM + EQ',
        'hologram-prism': '🔮 Cartel: Holograma Prisma 3D',
        'fire-energy': '🔥 Cartel: Fuego / Alta Energía',
        'minimal-floating': '🕊️ Cartel: Puro Texto Flotante Vivo',
        'mg-lower-third': '🎬 Motion Graphics: Broadcast Lower-Third',
        'mg-kinetic': '✍️ Motion Graphics: Kinetic Editorial',
        'mg-glass-pill': '💊 Motion Graphics: Glass Dynamic Pill',
        'mg-vector-hud': '📐 Motion Graphics: Vector Frame SVG',
        'mg-mono-noir': '⬛ Bitono Minimal Negro (B&W)',
        'mg-mono-white': '⬜ Bitono Minimal Blanco (B&W)'
      };

      const FLOW_MODES = ['rtl-marquee', 'rtl-continuous', 'rtl-slide'];
      const FLOW_LABELS = {
        'rtl-marquee': '➡️⬅️ Flujo: Desfile Derecha a Izquierda (1 Línea)',
        'rtl-continuous': '🔁 Flujo: Ticker Continuo Derecha a Izquierda',
        'rtl-slide': '🎯 Flujo: Entrada Derecha a Izquierda + Pausa Viva'
      };

      const LETTER_ANIMS = ['wave', 'spring', 'typewriter', 'bounce', 'flip3d', 'pulse', 'glitch', 'word-rise', 'none'];
      const LETTER_LABELS = {
        wave: '🌊 Letras: Ola Sinusoidal',
        spring: '🏀 Letras: Resorte Elástico',
        typewriter: '⌨️ Letras: Máquina de Escribir',
        bounce: '⚡ Letras: Caída con Rebote',
        flip3d: '🔄 Letras: Giro 3D por Letra',
        pulse: '💫 Letras: Pulso Láser',
        glitch: '👾 Letras: Cyber Glitch',
        'word-rise': '🎬 Editorial: Elevación por Palabra',
        none: '⏹️ Letras: Estático Limpio'
      };

      const TRANS_ANIMS = [
        'none',
        'fade',
        'fade-blur',
        'slide-up',
        'slide-down',
        'slide-lr',
        'slide-rl',
        'zoom-spring',
        'bounce-pop',
        'flip-3d',
        'flip-y',
        'wipe-curtain',
        'iris-reveal',
        'glitch-cut',
        'broadcast-wipe'
      ];
      const TRANS_LABELS = {
        none: '🚫 Transición: Sin Fade (Siempre Visible)',
        fade: '🌅 Transición: Fade In / Out Puro',
        'fade-blur': '🌫️ Transición: Fade + Blur Cinemático',
        'slide-up': '⬆️ Transición: Elevación Vertical',
        'slide-down': '⬇️ Transición: Caída Suave',
        'slide-lr': '⬅️ Transición: Barrido Derecha ➔ Izquierda',
        'slide-rl': '➡️ Transición: Barrido Izquierda ➔ Derecha',
        'zoom-spring': '💥 Transición: Zoom Elástico (Spring)',
        'bounce-pop': '🏀 Transición: Rebote Físico (Bounce)',
        'flip-3d': '🎴 Transición: Giro 3D Vertical',
        'flip-y': '🪞 Transición: Giro 3D Horizontal',
        'wipe-curtain': '🎬 Transición: Cortina Cinemática',
        'iris-reveal': '🔮 Transición: Apertura Central',
        'glitch-cut': '⚡ Transición: Corte Cyber Glitch',
        'broadcast-wipe': '🎬 Transición: Broadcast Wipe (After Effects)'
      };

      const TEXT_EFFECTS = ['neon', 'shimmer', 'extrude3d', 'rgb', 'outline', 'clean'];
      const EFFECT_LABELS = {
        neon: '💡 Efecto: Resplandor Neón',
        shimmer: '✨ Efecto: Shimmer Metálico',
        extrude3d: '🕹️ Efecto: Texto 3D Extruido',
        rgb: '📺 Efecto: Cromático RGB Split',
        outline: '⭕ Efecto: Contorno Luminoso',
        clean: '🎯 Efecto: Sombra Nítida Limpia'
      };

      const THEMES = ['glass', 'transparent', 'cyber', 'aurora'];

      const FONT_MAP = {
        outfit: "'Outfit', system-ui, sans-serif",
        orbitron: "'Orbitron', 'Outfit', sans-serif",
        jakarta: "'Plus Jakarta Sans', 'Outfit', sans-serif",
        mono: "'JetBrains Mono', monospace"
      };

      const DEFAULT_ADS = [
        { icon: '🎧', text: 'ESCUCHA CON AUDÍFONOS 🎧 PARA MEJOR CALIDAD • SONIDO HI-FI EN VIVO', sub: '' },
        { icon: '🎵', text: 'PIDE TU CANCIÓN EN EL CHAT ESCRIBIENDO !zr artista + canción', sub: '' },
        { icon: '❤️', text: 'DALE TAP TAP A LA PANTALLA ❤️ ¡APOYA EL STREAM CON TUS LIKES EN DIRECTO!', sub: '' },
        { icon: '⭐', text: 'SÍGUENOS EN TIKTOK ⭐ ZERO FM • MÚSICA Y PETICIONES EN VIVO TODOS LOS DÍAS', sub: '' }
      ];

      const defaultConfig = {
        adsWidgetBannerStyle: 'kinetic-glass',
        adsWidgetFlowMode: 'rtl-marquee',
        adsWidgetPlayMode: 'rotate',
        adsWidgetActiveIndex: 0,
        adsWidgetLetterAnim: 'wave',
        adsWidgetFadeEnabled: true,
        adsWidgetFadeScope: 'per-message',
        adsWidgetTrans: 'fade-blur',
        adsWidgetTransIn: '',
        adsWidgetTransOut: '',
        adsWidgetTextEffect: 'neon',
        adsWidgetTheme: 'glass',
        adsWidgetFont: 'outfit',
        adsWidgetAlign: 'center',
        adsWidgetVPos: 'center',
        adsWidgetFontSize: 24,
        adsWidgetFadeIn: 0.7,
        adsWidgetFadeOut: 0.7,
        adsWidgetHold: 10.0,
        adsWidgetPause: 0.8,
        adsWidgetStaggerMs: 34,
        adsWidgetOpacity: 86,
        adsWidgetAccent: '#a855f7',
        adsWidgetAccentSec: '#06b6d4',
        adsWidgetShowIcon: true,
        adsWidgetShowSub: true,
        adsWidgetShowTimerBar: true,
        adsWidgetItems: DEFAULT_ADS
      };

      function parseSec(val, fallback, min = 0, max = 60) {
        if (val === '' || val === null || val === undefined) return fallback;
        const n = Number(val);
        if (!Number.isFinite(n)) return fallback;
        return Math.max(min, Math.min(max, n));
      }

      function resolveTransitionState(cfg = currentConfig) {
        const masterOn = cfg.adsWidgetFadeEnabled !== false;
        const legacyTrans = TRANS_ANIMS.includes(cfg.adsWidgetTrans) ? cfg.adsWidgetTrans : 'fade-blur';
        const rawIn = (typeof cfg.adsWidgetTransIn === 'string' && cfg.adsWidgetTransIn !== '')
          ? cfg.adsWidgetTransIn
          : legacyTrans;
        const rawOut = (typeof cfg.adsWidgetTransOut === 'string' && cfg.adsWidgetTransOut !== '')
          ? cfg.adsWidgetTransOut
          : legacyTrans;

        const chosenIn = TRANS_ANIMS.includes(rawIn) ? rawIn : legacyTrans;
        const chosenOut = TRANS_ANIMS.includes(rawOut) ? rawOut : legacyTrans;

        const fadeInSec = parseSec(cfg.adsWidgetFadeIn, 0.7, 0, 5);
        const fadeOutSec = parseSec(cfg.adsWidgetFadeOut, 0.7, 0, 5);

        const effectiveTransIn = (!masterOn || chosenIn === 'none' || fadeInSec <= 0) ? 'none' : chosenIn;
        const effectiveTransOut = (!masterOn || chosenOut === 'none' || fadeOutSec <= 0) ? 'none' : chosenOut;

        return {
          masterOn,
          chosenIn,
          chosenOut,
          effectiveTransIn,
          effectiveTransOut,
          fadeInSec: effectiveTransIn === 'none' ? 0 : fadeInSec,
          fadeOutSec: effectiveTransOut === 'none' ? 0 : fadeOutSec,
          rawFadeInSec: fadeInSec,
          rawFadeOutSec: fadeOutSec
        };
      }

      let currentConfig = { ...defaultConfig, adsWidgetItems: DEFAULT_ADS.map(x => ({ ...x })) };
      try {
        const saved = safeStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          currentConfig = { ...currentConfig, ...parsed };
          if (!Array.isArray(currentConfig.adsWidgetItems) || currentConfig.adsWidgetItems.length === 0) {
            currentConfig.adsWidgetItems = DEFAULT_ADS.map(x => ({ ...x }));
          }
        }
      } catch (_) {}

      // URL Overrides
      const uStyle = String(urlParams.get('style') || urlParams.get('bannerStyle') || '').trim().toLowerCase();
      if (BANNER_STYLES.includes(uStyle)) currentConfig.adsWidgetBannerStyle = uStyle;

      const uFlow = String(urlParams.get('flow') || urlParams.get('flowMode') || '').trim().toLowerCase();
      if (FLOW_MODES.includes(uFlow)) currentConfig.adsWidgetFlowMode = uFlow;

      const uLetter = String(urlParams.get('letter') || urlParams.get('letterAnim') || '').trim().toLowerCase();
      if (LETTER_ANIMS.includes(uLetter)) currentConfig.adsWidgetLetterAnim = uLetter;

      const uFadeFlag = String(urlParams.get('fade') || '').trim().toLowerCase();
      if (uFadeFlag === '0' || uFadeFlag === 'off' || uFadeFlag === 'false' || uFadeFlag === 'none') {
        currentConfig.adsWidgetFadeEnabled = false;
      } else if (uFadeFlag === '1' || uFadeFlag === 'on' || uFadeFlag === 'true') {
        currentConfig.adsWidgetFadeEnabled = true;
      }

      const uTrans = String(urlParams.get('trans') || (TRANS_ANIMS.includes(uFadeFlag) ? uFadeFlag : '')).trim().toLowerCase();
      if (TRANS_ANIMS.includes(uTrans)) {
        currentConfig.adsWidgetTrans = uTrans;
        currentConfig.adsWidgetTransIn = uTrans;
        currentConfig.adsWidgetTransOut = uTrans;
        if (uTrans === 'none') currentConfig.adsWidgetFadeEnabled = false;
      }

      const uTransIn = String(urlParams.get('transIn') || '').trim().toLowerCase();
      if (TRANS_ANIMS.includes(uTransIn)) currentConfig.adsWidgetTransIn = uTransIn;

      const uTransOut = String(urlParams.get('transOut') || '').trim().toLowerCase();
      if (TRANS_ANIMS.includes(uTransOut)) currentConfig.adsWidgetTransOut = uTransOut;

      const uFadeScope = String(urlParams.get('fadeScope') || urlParams.get('capsuleMode') || '').trim().toLowerCase();
      if (uFadeScope === 'all-messages' || uFadeScope === 'all' || uFadeScope === 'batch' || uFadeScope === 'single-capsule') {
        currentConfig.adsWidgetFadeScope = 'all-messages';
      } else if (uFadeScope === 'per-message' || uFadeScope === 'each') {
        currentConfig.adsWidgetFadeScope = 'per-message';
      }

      const uEffect = String(urlParams.get('effect') || '').trim().toLowerCase();
      if (TEXT_EFFECTS.includes(uEffect)) currentConfig.adsWidgetTextEffect = uEffect;

      const uTheme = String(urlParams.get('theme') || '').trim().toLowerCase();
      if (THEMES.includes(uTheme)) currentConfig.adsWidgetTheme = uTheme;

      const uMsg = urlParams.get('msg') || urlParams.get('text');
      if (uMsg && String(uMsg).trim()) {
        currentConfig.adsWidgetItems = [{ icon: urlParams.get('icon') || '📢', text: String(uMsg).trim(), sub: '' }];
        currentConfig.adsWidgetPlayMode = 'single';
        currentConfig.adsWidgetActiveIndex = 0;
      }

      if (urlParams.get('config') === '1') {
        document.body.classList.add('config-open');
        document.getElementById('settings-drawer')?.classList.add('open');
      }

      // ─── DOM References ───
      const stageEl = document.getElementById('widget-stage');
      const bannerEl = document.getElementById('ad-banner');
      const iconPodEl = document.getElementById('ad-icon-pod');
      const iconEl = document.getElementById('ad-icon');
      const viewportEl = document.getElementById('ad-viewport');
      const rtlTrackEl = document.getElementById('ad-rtl-track');
      const headlineEl = document.getElementById('ad-headline');
      const timerBarEl = document.getElementById('ad-timer-bar');
      const timerFillEl = document.getElementById('ad-timer-fill');
      const editorEl = document.getElementById('ad-list-editor');
      const toastEl = document.getElementById('toast-pill');

      let toastTimer = null;
      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2300);
      }

      function hexToRgbTuple(hex, fallback = '168, 85, 247') {
        const clean = String(hex || '').replace('#', '').trim();
        if (clean.length !== 6) return fallback;
        const r = parseInt(clean.slice(0, 2), 16);
        const g = parseInt(clean.slice(2, 4), 16);
        const b = parseInt(clean.slice(4, 6), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return fallback;
        return `${r}, ${g}, ${b}`;
      }

      const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
        ? new Intl.Segmenter('es', { granularity: 'grapheme' })
        : null;

      function splitGraphemes(str) {
        const s = String(str || '');
        if (segmenter) {
          return Array.from(segmenter.segment(s), seg => seg.segment);
        }
        return Array.from(s);
      }

      function isEmojiGrapheme(g) {
        return /\p{Extended_Pictographic}/u.test(g);
      }

      // ─── Unified 1-Line Message Resolver ───
      function resolveSingleLineMessage(item) {
        const mainText = String(item?.text || '').trim();
        const subText = String(item?.sub || '').trim();
        if (subText && currentConfig.adsWidgetShowSub !== false && !mainText.includes(subText)) {
          return `${mainText} • ${subText}`;
        }
        return mainText || '🎵 PIDE TU CANCIÓN EN EL CHAT CON !zr';
      }

      // ─── Build Animated Single-Line DOM Fragment ───
      function createAnimatedMessageNode(fullLineText) {
        const frag = document.createDocumentFragment();
        const words = String(fullLineText || '').trim().split(/\s+/).filter(Boolean);
        let globalCharIndex = 0;

        words.forEach((word, wordIdx) => {
          if (word === '•' || word === '|') {
            const sep = document.createElement('span');
            sep.className = 'ad-sep-pill';
            sep.textContent = '✦';
            frag.appendChild(sep);
            return;
          }

          const wordSpan = document.createElement('span');
          const isBracketed = (word.startsWith('[') && word.endsWith(']') && word.length > 2);
          const isStarred = (word.startsWith('*') && word.endsWith('*') && word.length > 2);
          const isCmd = word.startsWith('!') || isBracketed || isStarred;
          const cleanWord = (isBracketed || isStarred) ? word.slice(1, -1) : word;
          wordSpan.className = `ad-word${isCmd ? ' is-command' : ''}`;
          wordSpan.style.setProperty('--word-index', String(wordIdx));

          const graphemes = splitGraphemes(cleanWord);
          graphemes.forEach((ch) => {
            globalCharIndex++;
            const charSpan = document.createElement('span');
            const isEmoji = isEmojiGrapheme(ch);
            charSpan.className = `ad-char ${isEmoji ? 'is-emoji' : 'is-alpha'}`;
            charSpan.textContent = ch;
            if (!supportsSiblingIndex) {
              charSpan.style.setProperty('--sibling-index', String(globalCharIndex));
            }
            wordSpan.appendChild(charSpan);
          });

          frag.appendChild(wordSpan);
        });

        return frag;
      }

      // ─── Calculate Exact Right-to-Left Distances ───
      function updateRtlMetrics() {
        if (!viewportEl || !headlineEl || !rtlTrackEl) return;
        const root = document.documentElement;
        const vw = Math.max(240, viewportEl.clientWidth || 640);
        const tw = Math.max(200, headlineEl.scrollWidth || 500);

        // Start right at the right edge of the viewport, end completely past the left edge
        root.style.setProperty('--rtl-start-x', `${vw}px`);
        root.style.setProperty('--rtl-end-x', `-${tw + 40}px`);

        // For rtl-slide mode: if text is wider than viewport, pan right-to-left so all of it is read
        const overflowX = Math.max(28, tw - vw + 36);
        root.style.setProperty('--rtl-pan-x', `-${overflowX}px`);
      }

      window.addEventListener('resize', updateRtlMetrics);

      // ─── Cycle Engine: Right-to-Left Single Line ───
      let currentAdIndex = 0;
      let cycleTimer = null;
      let phaseInCleanupTimer = null;
      let renderRafId = null;

      function getNormalizedItems() {
        return Array.isArray(currentConfig.adsWidgetItems) && currentConfig.adsWidgetItems.length > 0
          ? currentConfig.adsWidgetItems
          : DEFAULT_ADS;
      }

      // restartMode: 'none' (solo refresca DOM/métricas), 'flow' (reinicia pista sin ocultar el cartel), 'entry' (reproduce Fade In)
      function renderCurrentAnnouncement(restartMode = 'entry') {
        const mode = restartMode === true ? 'entry' : (restartMode === false ? 'none' : restartMode);
        const items = getNormalizedItems();

        if (currentConfig.adsWidgetPlayMode === 'single') {
          const pinned = Number(currentConfig.adsWidgetActiveIndex);
          currentAdIndex = (Number.isFinite(pinned) && pinned >= 0 && pinned < items.length) ? pinned : 0;
        } else if (currentAdIndex >= items.length) {
          currentAdIndex = 0;
        }

        const item = items[currentAdIndex] || DEFAULT_ADS[0];

        // Sync quick message editor inputs with the currently active item
        const qIconEl = document.getElementById('quick-msg-icon');
        const qTextEl = document.getElementById('quick-msg-text');
        const singleLineMsg = resolveSingleLineMessage(item);
        if (qIconEl && document.activeElement !== qIconEl) qIconEl.value = item.icon || '🎧';
        if (qTextEl && document.activeElement !== qTextEl) qTextEl.value = singleLineMsg;

        // Icon Pod
        const showIcon = currentConfig.adsWidgetShowIcon !== false && Boolean(item.icon);
        iconEl.textContent = item.icon || '🎧';
        if (iconPodEl) {
          iconPodEl.hidden = !showIcon;
          iconPodEl.classList.toggle('is-hidden', !showIcon);
        }

        const flowMode = FLOW_MODES.includes(currentConfig.adsWidgetFlowMode)
          ? currentConfig.adsWidgetFlowMode
          : 'rtl-marquee';

        headlineEl.innerHTML = '';

        if (flowMode === 'rtl-continuous') {
          // Build continuous seamless right-to-left loop (either single message repeated or all messages)
          const sourceList = currentConfig.adsWidgetPlayMode === 'single' ? [item] : items;
          for (let pass = 0; pass < 2; pass++) {
            sourceList.forEach((adItem) => {
              const msg = resolveSingleLineMessage(adItem);
              headlineEl.appendChild(createAnimatedMessageNode(`${adItem.icon || '📢'} ${msg}`));
              const sep = document.createElement('span');
              sep.className = 'ad-sep-pill';
              sep.textContent = '⚡ ZERO FM ⚡';
              headlineEl.appendChild(sep);
            });
          }
        } else {
          headlineEl.appendChild(createAnimatedMessageNode(singleLineMsg));
        }

        if (renderRafId) {
          cancelAnimationFrame(renderRafId);
          renderRafId = null;
        }
        renderRafId = requestAnimationFrame(() => {
          renderRafId = null;
          updateRtlMetrics();
          if (mode === 'entry') {
            startCycleForCurrentAd(true);
          } else if (mode === 'flow') {
            startCycleForCurrentAd(false);
          }
        });
      }

      function startCycleForCurrentAd(playEntry = true) {
        if (cycleTimer) {
          clearTimeout(cycleTimer);
          cycleTimer = null;
        }
        if (phaseInCleanupTimer) {
          clearTimeout(phaseInCleanupTimer);
          phaseInCleanupTimer = null;
        }

        const flowMode = FLOW_MODES.includes(currentConfig.adsWidgetFlowMode)
          ? currentConfig.adsWidgetFlowMode
          : 'rtl-marquee';

        const tState = resolveTransitionState(currentConfig);
        const isAllInOneCapsule = currentConfig.adsWidgetFadeScope === 'all-messages';
        const isRotate = currentConfig.adsWidgetPlayMode !== 'single';
        const fadeInMs = Math.round(tState.fadeInSec * 1000);
        const fadeOutMs = Math.round(tState.fadeOutSec * 1000);
        const holdSec = parseSec(currentConfig.adsWidgetHold, 10.0, 2, 60);
        const holdMs = Math.round(holdSec * 1000);
        const pauseSec = parseSec(currentConfig.adsWidgetPause, 0.8, 0, 120);
        const pauseMs = Math.round(pauseSec * 1000);

        const root = document.documentElement;
        const items = getNormalizedItems();
        const activeEntryMs = (playEntry && tState.effectiveTransIn !== 'none' && fadeInMs > 0) ? fadeInMs : 0;

        let cycleDisplayMs = holdMs;
        if (flowMode === 'rtl-continuous') {
          const totalPassesSec = isRotate
            ? Math.max(6, holdSec * items.length)
            : holdSec * 1.4;
          root.style.setProperty('--rtl-duration', `${totalPassesSec.toFixed(2)}s`);
          cycleDisplayMs = isAllInOneCapsule ? Math.round(totalPassesSec * 1000) : holdMs;
        } else {
          root.style.setProperty('--rtl-duration', `${((activeEntryMs + holdMs) / 1000).toFixed(2)}s`);
        }

        // Mantener siempre limpio el estado visual para evitar congelamiento o parpadeo
        bannerEl.classList.remove('phase-in', 'phase-out', 'is-Paused-Hidden');
        rtlTrackEl.classList.remove('is-running');
        void bannerEl.offsetWidth;

        if (activeEntryMs > 0) {
          bannerEl.classList.add('phase-in');
          phaseInCleanupTimer = setTimeout(() => {
            bannerEl.classList.remove('phase-in');
            phaseInCleanupTimer = null;
          }, activeEntryMs + 60);
        }
        rtlTrackEl.classList.add('is-running');

        if (timerFillEl) {
          timerFillEl.style.transition = 'none';
          timerFillEl.style.transform = 'scaleX(1)';
          void timerFillEl.offsetWidth;
          timerFillEl.style.transition = `transform ${activeEntryMs + cycleDisplayMs}ms linear`;
          timerFillEl.style.transform = 'scaleX(0)';
        }

        const hasExitOrPause = (tState.effectiveTransOut !== 'none' && fadeOutMs > 0) || pauseMs > 0;

        // En ticker continuo: si no es modo lote con salida y no hay espera oculta, corre infinitamente
        if (flowMode === 'rtl-continuous' && !(isAllInOneCapsule && hasExitOrPause) && pauseMs <= 0) {
          return;
        }

        cycleTimer = setTimeout(() => {
          const list = getNormalizedItems();
          const hasMoreInSameCapsule =
            flowMode !== 'rtl-continuous' &&
            isAllInOneCapsule &&
            isRotate &&
            list.length > 1 &&
            currentAdIndex < list.length - 1;

          // Modo 1 cápsula para todos: pasa al siguiente mensaje SIN Fade Out ni Fade In
          if (hasMoreInSameCapsule) {
            currentAdIndex = currentAdIndex + 1;
            renderCurrentAnnouncement('flow');
            return;
          }

          const advanceNextBatch = () => {
            const latestList = getNormalizedItems();
            if (flowMode !== 'rtl-continuous' && currentConfig.adsWidgetPlayMode !== 'single') {
              currentAdIndex = isAllInOneCapsule ? 0 : ((currentAdIndex + 1) % latestList.length);
            }
            renderCurrentAnnouncement('entry');
          };

          if (tState.effectiveTransOut !== 'none' && fadeOutMs > 0) {
            bannerEl.classList.remove('phase-in');
            void bannerEl.offsetWidth;
            bannerEl.classList.add('phase-out');

            cycleTimer = setTimeout(() => {
              if (pauseMs > 0) {
                bannerEl.classList.add('is-Paused-Hidden');
                cycleTimer = setTimeout(advanceNextBatch, pauseMs);
              } else {
                advanceNextBatch();
              }
            }, fadeOutMs);
          } else if (pauseMs > 0) {
            // Sin Fade Out pero con tiempo de espera: oculta la cápsula los segundos configurados y vuelve a aparecer
            bannerEl.classList.remove('phase-in', 'phase-out');
            bannerEl.classList.add('is-Paused-Hidden');
            cycleTimer = setTimeout(advanceNextBatch, pauseMs);
          } else {
            // Sin Fade Out y sin espera: mantiene el cartel siempre visible y pasa al siguiente anuncio
            advanceNextBatch();
          }
        }, activeEntryMs + cycleDisplayMs);
      }

      function previewTransitionNow() {
        if (cycleTimer) {
          clearTimeout(cycleTimer);
          cycleTimer = null;
        }
        if (phaseInCleanupTimer) {
          clearTimeout(phaseInCleanupTimer);
          phaseInCleanupTimer = null;
        }
        const tState = resolveTransitionState(currentConfig);
        const fadeInMs = Math.round(tState.fadeInSec * 1000);
        const fadeOutMs = Math.round(tState.fadeOutSec * 1000);
        const pauseSec = parseSec(currentConfig.adsWidgetPause, 0.8, 0, 120);
        const pauseMs = Math.round(pauseSec * 1000);
        const demoPauseMs = pauseMs > 0 ? Math.min(pauseMs, 3000) : 260;

        if (tState.effectiveTransIn === 'none' && tState.effectiveTransOut === 'none' && pauseMs <= 0) {
          bannerEl.classList.remove('phase-in', 'phase-out', 'is-Paused-Hidden');
          showToast('🚫 Sin fade ni espera oculta (Siempre visible)');
          return;
        }

        if (pauseSec > 3) {
          showToast(`⏱️ Demo de espera oculta (real: ${pauseSec.toFixed(1)}s)`);
        }

        if (tState.effectiveTransOut !== 'none' && fadeOutMs > 0) {
          bannerEl.classList.remove('phase-in', 'phase-out', 'is-Paused-Hidden');
          void bannerEl.offsetWidth;
          bannerEl.classList.add('phase-out');
          cycleTimer = setTimeout(() => {
            bannerEl.classList.add('is-Paused-Hidden');
            cycleTimer = setTimeout(() => {
              startCycleForCurrentAd(true);
            }, demoPauseMs);
          }, fadeOutMs);
        } else {
          // Oculta la cápsula durante la espera y vuelve a mostrarla (con entrada si está activa)
          bannerEl.classList.remove('phase-in', 'phase-out');
          bannerEl.classList.add('is-Paused-Hidden');
          cycleTimer = setTimeout(() => {
            startCycleForCurrentAd(true);
          }, pauseMs > 0 ? demoPauseMs : 150);
        }
      }

      function nextAnnouncementNow() {
        const items = getNormalizedItems();
        currentAdIndex = (currentAdIndex + 1) % items.length;
        currentConfig.adsWidgetActiveIndex = currentAdIndex;
        renderAdsEditorList();
        const isAllInOneCapsule = currentConfig.adsWidgetFadeScope === 'all-messages';
        renderCurrentAnnouncement(isAllInOneCapsule ? 'flow' : 'entry');
      }

      // ─── Apply Visual Config ───
      function applyConfig(nextCfg = {}, restartAnim = false) {
        const patch = { ...nextCfg };
        if (patch.adsWidgetTheme && !patch.adsWidgetBannerStyle) {
          const themeToStyle = {
            glass: 'kinetic-glass',
            cyber: 'cyber-hud',
            aurora: 'neon-capsule',
            transparent: 'minimal-floating'
          };
          if (themeToStyle[patch.adsWidgetTheme]) {
            patch.adsWidgetBannerStyle = themeToStyle[patch.adsWidgetTheme];
          }
        }

        // Si un cliente legacy cambia solo adsWidgetTrans sin pasar In/Out explícitos, sincronizar ambos
        if (patch.adsWidgetTrans !== undefined && patch.adsWidgetTransIn === undefined && patch.adsWidgetTransOut === undefined) {
          patch.adsWidgetTransIn = patch.adsWidgetTrans;
          patch.adsWidgetTransOut = patch.adsWidgetTrans;
        }

        currentConfig = { ...currentConfig, ...patch };
        if (!Array.isArray(currentConfig.adsWidgetItems) || currentConfig.adsWidgetItems.length === 0) {
          currentConfig.adsWidgetItems = DEFAULT_ADS.map(x => ({ ...x }));
        }

        if (patch.adsWidgetActiveIndex !== undefined) {
          const idx = Number(patch.adsWidgetActiveIndex);
          if (Number.isFinite(idx) && idx >= 0 && idx < currentConfig.adsWidgetItems.length) {
            currentAdIndex = idx;
          }
        } else if (patch.adsWidgetFadeScope === 'all-messages' && currentConfig.adsWidgetPlayMode !== 'single') {
          currentAdIndex = 0;
        }

        const bannerStyle = BANNER_STYLES.includes(currentConfig.adsWidgetBannerStyle)
          ? currentConfig.adsWidgetBannerStyle
          : 'kinetic-glass';
        const flowMode = FLOW_MODES.includes(currentConfig.adsWidgetFlowMode)
          ? currentConfig.adsWidgetFlowMode
          : 'rtl-marquee';
        const letterAnim = LETTER_ANIMS.includes(currentConfig.adsWidgetLetterAnim)
          ? currentConfig.adsWidgetLetterAnim
          : 'wave';
        const tState = resolveTransitionState(currentConfig);
        const effect = TEXT_EFFECTS.includes(currentConfig.adsWidgetTextEffect)
          ? currentConfig.adsWidgetTextEffect
          : 'neon';
        const theme = bannerStyle === 'minimal-floating'
          ? 'transparent'
          : (THEMES.includes(currentConfig.adsWidgetTheme) ? currentConfig.adsWidgetTheme : 'glass');

        stageEl.setAttribute('data-banner-style', bannerStyle);
        stageEl.setAttribute('data-flow-mode', flowMode);
        stageEl.setAttribute('data-letter-anim', letterAnim);
        stageEl.setAttribute('data-trans', tState.effectiveTransIn);
        stageEl.setAttribute('data-trans-in', tState.effectiveTransIn);
        stageEl.setAttribute('data-trans-out', tState.effectiveTransOut);
        stageEl.setAttribute('data-text-effect', effect);
        stageEl.setAttribute('data-theme', theme);
        stageEl.setAttribute('data-align', currentConfig.adsWidgetAlign || 'center');
        stageEl.setAttribute('data-vpos', currentConfig.adsWidgetVPos || 'center');

        const root = document.documentElement;
        const fontKey = currentConfig.adsWidgetFont || 'outfit';
        root.style.setProperty('--font-active', FONT_MAP[fontKey] || FONT_MAP.outfit);

        const fontPx = Math.max(14, Math.min(54, Number(currentConfig.adsWidgetFontSize) || 24));
        root.style.setProperty('--ad-font-size', `${(fontPx / 16).toFixed(3)}rem`);

        root.style.setProperty('--fade-in-dur', `${tState.fadeInSec}s`);
        root.style.setProperty('--fade-out-dur', `${tState.fadeOutSec}s`);

        const staggerMs = Math.max(8, Math.min(150, Number(currentConfig.adsWidgetStaggerMs) || 34));
        root.style.setProperty('--stagger-step', `${(staggerMs / 1000).toFixed(3)}s`);

        const opRaw = Number(currentConfig.adsWidgetOpacity);
        const opNorm = Number.isFinite(opRaw) ? (opRaw > 1 ? opRaw / 100 : opRaw) : 0.86;
        root.style.setProperty('--card-opacity', String(Math.max(0, Math.min(0.98, opNorm))));

        const accent = currentConfig.adsWidgetAccent || '#a855f7';
        const accentSec = currentConfig.adsWidgetAccentSec || '#06b6d4';
        root.style.setProperty('--accent-primary', accent);
        root.style.setProperty('--accent-secondary', accentSec);
        root.style.setProperty('--accent-rgb', hexToRgbTuple(accent, '168, 85, 247'));
        root.style.setProperty('--accent-sec-rgb', hexToRgbTuple(accentSec, '6, 182, 212'));

        const showTimer = currentConfig.adsWidgetShowTimerBar !== false &&
          bannerStyle !== 'minimal-floating' &&
          bannerStyle !== 'mg-kinetic' &&
          flowMode !== 'rtl-continuous';
        if (timerBarEl) {
          timerBarEl.hidden = !showTimer;
          timerBarEl.classList.toggle('is-hidden', !showTimer);
        }

        // Si las transiciones están desactivadas, garantizar visibilidad inmediata
        if (tState.effectiveTransIn === 'none' && tState.effectiveTransOut === 'none') {
          bannerEl.classList.remove('phase-in', 'phase-out', 'is-Paused-Hidden');
        }

        syncDrawerControls();
        renderCurrentAnnouncement(restartAnim);
      }

      // ─── 1-Line Messages List Editor ───
      function renderAdsEditorList() {
        if (!editorEl) return;
        editorEl.innerHTML = '';
        const items = currentConfig.adsWidgetItems || [];
        items.forEach((item, idx) => {
          const row = document.createElement('div');
          const isCurrent = idx === currentAdIndex;
          row.className = `ad-item-row${isCurrent ? ' is-active-row' : ''}`;

          const showBtn = document.createElement('button');
          showBtn.type = 'button';
          showBtn.className = 'btn-show-ad';
          showBtn.textContent = isCurrent ? '●' : '▶️';
          showBtn.title = 'Mostrar este mensaje ahora';
          showBtn.addEventListener('click', () => {
            currentAdIndex = idx;
            currentConfig.adsWidgetActiveIndex = idx;
            renderAdsEditorList();
            renderCurrentAnnouncement(true);
            safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
            showToast(`📢 Mostrando mensaje #${idx + 1}`);
          });

          const iconInp = document.createElement('input');
          iconInp.type = 'text';
          iconInp.value = item.icon || '🎧';
          iconInp.title = 'Emoticón / Ícono';
          iconInp.style.textAlign = 'center';
          iconInp.addEventListener('input', () => {
            currentConfig.adsWidgetItems[idx].icon = iconInp.value;
            if (currentAdIndex === idx) renderCurrentAnnouncement(false);
          });

          const textInp = document.createElement('input');
          textInp.type = 'text';
          textInp.value = resolveSingleLineMessage(item);
          textInp.placeholder = 'Escribe el mensaje en 1 sola línea...';
          textInp.addEventListener('input', () => {
            currentConfig.adsWidgetItems[idx].text = textInp.value;
            currentConfig.adsWidgetItems[idx].sub = '';
            if (currentAdIndex === idx) renderCurrentAnnouncement(false);
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn-del-ad';
          delBtn.textContent = '✕';
          delBtn.title = 'Eliminar mensaje';
          delBtn.addEventListener('click', () => {
            if (currentConfig.adsWidgetItems.length <= 1) {
              showToast('⚠️ Debe haber al menos 1 mensaje');
              return;
            }
            currentConfig.adsWidgetItems.splice(idx, 1);
            if (currentAdIndex >= currentConfig.adsWidgetItems.length) currentAdIndex = 0;
            currentConfig.adsWidgetActiveIndex = currentAdIndex;
            renderAdsEditorList();
            renderCurrentAnnouncement(true);
          });

          row.appendChild(showBtn);
          row.appendChild(iconInp);
          row.appendChild(textInp);
          row.appendChild(delBtn);
          editorEl.appendChild(row);
        });
      }

      function syncDrawerControls() {
        const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = String(v); };
        const setLbl = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        const tState = resolveTransitionState(currentConfig);

        setVal('cfg-bannerStyle', currentConfig.adsWidgetBannerStyle || 'kinetic-glass');
        setVal('cfg-flowMode', currentConfig.adsWidgetFlowMode || 'rtl-marquee');
        setVal('cfg-playMode', currentConfig.adsWidgetPlayMode || 'rotate');
        setVal('cfg-letterAnim', currentConfig.adsWidgetLetterAnim || 'wave');
        setVal('cfg-transIn', tState.chosenIn);
        setVal('cfg-transOut', tState.chosenOut);
        setVal('cfg-textEffect', currentConfig.adsWidgetTextEffect || 'neon');
        setVal('cfg-font', currentConfig.adsWidgetFont || 'outfit');

        const fadeChk = document.getElementById('cfg-fadeEnabled');
        if (fadeChk) fadeChk.checked = tState.masterOn;

        const scopeChk = document.getElementById('cfg-fadeScopeAll');
        if (scopeChk) scopeChk.checked = currentConfig.adsWidgetFadeScope === 'all-messages';

        const fi = tState.rawFadeInSec;
        setVal('cfg-fadeIn', fi);
        setLbl('val-fadeIn', (!tState.masterOn || tState.chosenIn === 'none' || fi <= 0) ? 'OFF (0.0s)' : `${fi.toFixed(1)}s`);

        const fo = tState.rawFadeOutSec;
        setVal('cfg-fadeOut', fo);
        setLbl('val-fadeOut', (!tState.masterOn || tState.chosenOut === 'none' || fo <= 0) ? 'OFF (0.0s)' : `${fo.toFixed(1)}s`);

        const hd = parseSec(currentConfig.adsWidgetHold, 10.0, 2, 60);
        setVal('cfg-hold', hd);
        setLbl('val-hold', `${hd.toFixed(1)}s`);

        const ps = parseSec(currentConfig.adsWidgetPause, 0.8, 0, 120);
        setVal('cfg-pause', ps);
        setLbl('val-pause', ps > 0 ? `${ps.toFixed(1)}s` : '0.0s (Sin pausa)');

        const fs = Number(currentConfig.adsWidgetFontSize) || 24;
        setVal('cfg-fontSize', fs);
        setLbl('val-fontSize', `${fs}px`);

        const op = Number(currentConfig.adsWidgetOpacity);
        const opPct = Math.round(Number.isFinite(op) ? (op <= 1 && op > 0 ? op * 100 : op) : 86);
        setVal('cfg-opacity', opPct);
        setLbl('val-opacity', `${opPct}%`);

        setVal('cfg-accent', currentConfig.adsWidgetAccent || '#a855f7');
        setVal('cfg-accentSec', currentConfig.adsWidgetAccentSec || '#06b6d4');
      }

      function readConfigFromDrawer() {
        const transIn = document.getElementById('cfg-transIn')?.value || 'fade-blur';
        const transOut = document.getElementById('cfg-transOut')?.value || 'fade-blur';
        const fadeEnabled = Boolean(document.getElementById('cfg-fadeEnabled')?.checked);
        const fadeScope = document.getElementById('cfg-fadeScopeAll')?.checked ? 'all-messages' : 'per-message';
        return {
          adsWidgetBannerStyle: document.getElementById('cfg-bannerStyle').value,
          adsWidgetFlowMode: document.getElementById('cfg-flowMode').value,
          adsWidgetPlayMode: document.getElementById('cfg-playMode').value,
          adsWidgetActiveIndex: currentAdIndex,
          adsWidgetLetterAnim: document.getElementById('cfg-letterAnim').value,
          adsWidgetFadeEnabled: fadeEnabled,
          adsWidgetFadeScope: fadeScope,
          adsWidgetTrans: transIn !== 'none' ? transIn : transOut,
          adsWidgetTransIn: transIn,
          adsWidgetTransOut: transOut,
          adsWidgetTextEffect: document.getElementById('cfg-textEffect').value,
          adsWidgetFont: document.getElementById('cfg-font').value,
          adsWidgetFadeIn: parseSec(document.getElementById('cfg-fadeIn').value, 0.7, 0, 5),
          adsWidgetFadeOut: parseSec(document.getElementById('cfg-fadeOut').value, 0.7, 0, 5),
          adsWidgetHold: parseSec(document.getElementById('cfg-hold').value, 10.0, 2, 60),
          adsWidgetPause: parseSec(document.getElementById('cfg-pause').value, 0.8, 0, 120),
          adsWidgetFontSize: Number(document.getElementById('cfg-fontSize').value) || 24,
          adsWidgetOpacity: Number(document.getElementById('cfg-opacity').value),
          adsWidgetAccent: document.getElementById('cfg-accent').value,
          adsWidgetAccentSec: document.getElementById('cfg-accentSec').value,
          adsWidgetItems: currentConfig.adsWidgetItems
        };
      }

      // ─── Quick Message Apply ───
      document.getElementById('btn-apply-quick-msg').addEventListener('click', () => {
        const iconVal = document.getElementById('quick-msg-icon').value || '📢';
        const textVal = document.getElementById('quick-msg-text').value.trim();
        if (!textVal) {
          showToast('⚠️ Escribe un mensaje para mostrar');
          return;
        }
        if (!Array.isArray(currentConfig.adsWidgetItems) || currentConfig.adsWidgetItems.length === 0) {
          currentConfig.adsWidgetItems = [{ icon: iconVal, text: textVal, sub: '' }];
          currentAdIndex = 0;
        } else {
          currentConfig.adsWidgetItems[currentAdIndex] = { icon: iconVal, text: textVal, sub: '' };
        }
        currentConfig.adsWidgetActiveIndex = currentAdIndex;
        renderAdsEditorList();
        renderCurrentAnnouncement(true);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        try { bcChannel?.postMessage({ action: 'updateLiveConfig', config: currentConfig }); } catch (_) {}
        showToast('📢 Mensaje actualizado en pantalla');
      });

      // ─── UI Event Listeners ───
      document.getElementById('btn-cycle-style').addEventListener('click', () => {
        const idx = BANNER_STYLES.indexOf(currentConfig.adsWidgetBannerStyle || 'kinetic-glass');
        const next = BANNER_STYLES[(idx + 1) % BANNER_STYLES.length];
        applyConfig({ adsWidgetBannerStyle: next }, false);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(BANNER_STYLE_LABELS[next]);
      });

      document.getElementById('btn-cycle-flow').addEventListener('click', () => {
        const idx = FLOW_MODES.indexOf(currentConfig.adsWidgetFlowMode || 'rtl-marquee');
        const next = FLOW_MODES[(idx + 1) % FLOW_MODES.length];
        applyConfig({ adsWidgetFlowMode: next }, true);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(FLOW_LABELS[next]);
      });

      document.getElementById('btn-cycle-letter').addEventListener('click', () => {
        const idx = LETTER_ANIMS.indexOf(currentConfig.adsWidgetLetterAnim || 'wave');
        const next = LETTER_ANIMS[(idx + 1) % LETTER_ANIMS.length];
        applyConfig({ adsWidgetLetterAnim: next }, true);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(LETTER_LABELS[next]);
      });

      document.getElementById('btn-cycle-effect').addEventListener('click', () => {
        const idx = TEXT_EFFECTS.indexOf(currentConfig.adsWidgetTextEffect || 'neon');
        const next = TEXT_EFFECTS[(idx + 1) % TEXT_EFFECTS.length];
        applyConfig({ adsWidgetTextEffect: next }, false);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(EFFECT_LABELS[next]);
      });

      document.getElementById('btn-cycle-trans').addEventListener('click', () => {
        const tState = resolveTransitionState(currentConfig);
        const cur = tState.masterOn ? tState.chosenIn : 'none';
        const idx = TRANS_ANIMS.indexOf(cur);
        const next = TRANS_ANIMS[(idx + 1) % TRANS_ANIMS.length];
        applyConfig({
          adsWidgetFadeEnabled: next !== 'none',
          adsWidgetTrans: next,
          adsWidgetTransIn: next,
          adsWidgetTransOut: next
        }, true);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(TRANS_LABELS[next]);
      });

      document.getElementById('btn-preview-trans').addEventListener('click', () => {
        previewTransitionNow();
      });

      document.getElementById('btn-drawer-preview-trans')?.addEventListener('click', () => {
        previewTransitionNow();
      });

      document.getElementById('btn-next-ad').addEventListener('click', () => {
        nextAnnouncementNow();
      });

      const drawerEl = document.getElementById('settings-drawer');
      document.getElementById('btn-settings').addEventListener('click', () => {
        renderAdsEditorList();
        drawerEl.classList.toggle('open');
        document.body.classList.toggle('config-open', drawerEl.classList.contains('open'));
      });

      document.getElementById('btn-close-settings').addEventListener('click', () => {
        drawerEl.classList.remove('open');
        document.body.classList.remove('config-open');
      });

      document.getElementById('btn-add-ad').addEventListener('click', () => {
        currentConfig.adsWidgetItems.push({
          icon: '🔥',
          text: 'NUEVO MENSAJE EN VIVO 🔥 PIDE TU CANCIÓN CON !zr artista + canción',
          sub: ''
        });
        currentAdIndex = currentConfig.adsWidgetItems.length - 1;
        currentConfig.adsWidgetActiveIndex = currentAdIndex;
        renderAdsEditorList();
        renderCurrentAnnouncement(true);
      });

      [
        'cfg-bannerStyle', 'cfg-flowMode', 'cfg-playMode', 'cfg-letterAnim',
        'cfg-fadeEnabled', 'cfg-fadeScopeAll', 'cfg-transIn', 'cfg-transOut', 'cfg-textEffect', 'cfg-font',
        'cfg-fadeIn', 'cfg-fadeOut', 'cfg-hold', 'cfg-pause',
        'cfg-fontSize', 'cfg-opacity', 'cfg-accent', 'cfg-accentSec'
      ].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        const isTimingOrAnim = [
          'cfg-flowMode', 'cfg-playMode', 'cfg-letterAnim',
          'cfg-fadeEnabled', 'cfg-fadeScopeAll', 'cfg-transIn', 'cfg-transOut',
          'cfg-fadeIn', 'cfg-fadeOut', 'cfg-hold', 'cfg-pause'
        ].includes(id);
        const handler = () => applyConfig(readConfigFromDrawer(), isTimingOrAnim);
        if (el.type === 'checkbox') {
          el.addEventListener('change', handler);
        } else {
          el.addEventListener('input', handler);
          el.addEventListener('change', handler);
        }
      });

      // ─── Firebase Real-Time Sync ───
      let db = null;
      function initFirebase() {
        // En vista previa del dashboard el padre envía el estado en tiempo real;
        // evitamos que onSnapshot compita y haga parpadear el cartel al guardar.
        if (isPreviewMode) return;
        try {
          if (typeof firebase === 'undefined') return;
          if (!firebase.apps.length) {
            const cfg = window.ZERO_FM_FIREBASE || window.firebaseConfig;
            if (cfg) firebase.initializeApp(cfg);
          }
          db = firebase.firestore();
          try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (_) {}
        } catch (_) {}
        if (!db) return;

        db.collection('systemConfig').doc('overlayAlertsConfig').onSnapshot((doc) => {
          if (!doc.exists) return;
          const data = doc.data() || {};
          const relevant = {};
          Object.keys(defaultConfig).forEach((k) => {
            if (data[k] !== undefined) relevant[k] = data[k];
          });
          if (BANNER_STYLES.includes(uStyle)) relevant.adsWidgetBannerStyle = uStyle;
          if (FLOW_MODES.includes(uFlow)) relevant.adsWidgetFlowMode = uFlow;
          if (LETTER_ANIMS.includes(uLetter)) relevant.adsWidgetLetterAnim = uLetter;
          if (uFadeFlag === '0' || uFadeFlag === 'off' || uFadeFlag === 'false' || uFadeFlag === 'none') {
            relevant.adsWidgetFadeEnabled = false;
          } else if (uFadeFlag === '1' || uFadeFlag === 'on' || uFadeFlag === 'true') {
            relevant.adsWidgetFadeEnabled = true;
          }
          if (TRANS_ANIMS.includes(uTrans)) {
            relevant.adsWidgetTrans = uTrans;
            relevant.adsWidgetTransIn = uTrans;
            relevant.adsWidgetTransOut = uTrans;
            if (uTrans === 'none') relevant.adsWidgetFadeEnabled = false;
          }
          if (TRANS_ANIMS.includes(uTransIn)) relevant.adsWidgetTransIn = uTransIn;
          if (TRANS_ANIMS.includes(uTransOut)) relevant.adsWidgetTransOut = uTransOut;
          if (uFadeScope === 'all-messages' || uFadeScope === 'all' || uFadeScope === 'batch' || uFadeScope === 'single-capsule') {
            relevant.adsWidgetFadeScope = 'all-messages';
          } else if (uFadeScope === 'per-message' || uFadeScope === 'each') {
            relevant.adsWidgetFadeScope = 'per-message';
          }
          if (TEXT_EFFECTS.includes(uEffect)) relevant.adsWidgetTextEffect = uEffect;
          if (THEMES.includes(uTheme)) relevant.adsWidgetTheme = uTheme;
          if (Object.keys(relevant).length > 0) {
            handleIncomingPayload(relevant, 'firebase');
          }
        }, () => {});
      }

      document.getElementById('btn-save-cfg').addEventListener('click', async () => {
        const nextCfg = readConfigFromDrawer();
        applyConfig(nextCfg, 'flow');
        if (!isPreviewMode) {
          safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
          try { bcChannel?.postMessage({ action: 'updateLiveConfig', config: currentConfig }); } catch (_) {}
        }
        if (db) {
          try {
            await db.collection('systemConfig').doc('overlayAlertsConfig').set(nextCfg, { merge: true });
          } catch (_) {}
        }
        drawerEl.classList.remove('open');
        document.body.classList.remove('config-open');
        showToast('✅ Mensaje y estilo guardados');
      });

      document.getElementById('btn-reset-cfg').addEventListener('click', () => {
        if (!isPreviewMode) safeStorage.removeItem(STORAGE_KEY);
        currentConfig = { ...defaultConfig, adsWidgetItems: DEFAULT_ADS.map(x => ({ ...x })) };
        applyConfig(currentConfig, 'flow');
        renderAdsEditorList();
        showToast('↺ Anuncios restablecidos');
      });

      const ENTRY_REPLAY_KEYS = new Set([
        'adsWidgetFadeEnabled', 'adsWidgetTrans', 'adsWidgetTransIn'
      ]);
      const FLOW_RESTART_KEYS = new Set([
        'adsWidgetFlowMode', 'adsWidgetPlayMode', 'adsWidgetActiveIndex',
        'adsWidgetFadeScope', 'adsWidgetHold', 'adsWidgetFadeIn', 'adsWidgetFadeOut',
        'adsWidgetPause', 'adsWidgetTransOut'
      ]);

      function normalizeIncomingValue(k, val, payload) {
        if (k === 'adsWidgetTransIn' || k === 'adsWidgetTransOut') {
          if (val === '' || val === null || val === undefined) {
            return payload.adsWidgetTrans || currentConfig.adsWidgetTrans || 'fade-blur';
          }
        }
        return val;
      }

      function handleIncomingPayload(payload, source = 'message') {
        if (!payload) return;
        const mapped = {};
        let hasChanges = false;
        let restartMode = 'none';

        Object.keys(defaultConfig).forEach((k) => {
          if (payload[k] !== undefined) {
            const prevVal = normalizeIncomingValue(k, currentConfig[k], currentConfig);
            const nextVal = normalizeIncomingValue(k, payload[k], payload);
            const isDiff = (typeof nextVal === 'object' && nextVal !== null)
              ? JSON.stringify(prevVal) !== JSON.stringify(nextVal)
              : prevVal !== nextVal;
            if (isDiff) {
              mapped[k] = nextVal;
              hasChanges = true;
              if (ENTRY_REPLAY_KEYS.has(k)) {
                restartMode = 'entry';
              } else if (FLOW_RESTART_KEYS.has(k) && restartMode !== 'entry') {
                restartMode = 'flow';
              }
            }
          }
        });

        if (hasChanges) {
          // Si se desactiva el fade, no reproducir entrada; mantener visible al instante
          if (mapped.adsWidgetFadeEnabled === false || mapped.adsWidgetTransIn === 'none') {
            if (restartMode === 'entry') restartMode = 'flow';
          }
          applyConfig(mapped, restartMode);
          // Nunca escribir de vuelta en localStorage en vista previa ni desde evento storage (evita bucles)
          if (!isPreviewMode && source !== 'storage') {
            safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
          }
          renderAdsEditorList();
        }
      }

      // Live Dashboard postMessage & BroadcastChannel Receiver
      window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.action === 'nextAnnouncement' || event.data.action === 'simulateAnnouncement') {
          nextAnnouncementNow();
        } else if (event.data.action === 'previewTransition') {
          previewTransitionNow();
        } else if ((event.data.action === 'updateConfig' || event.data.action === 'updateLiveConfig') && (event.data.payload || event.data.config)) {
          handleIncomingPayload(event.data.payload || event.data.config, 'message');
        }
      });

      if (bcChannel) {
        bcChannel.onmessage = (ev) => {
          if (!ev.data) return;
          if (ev.data.action === 'previewTransition') {
            previewTransitionNow();
          } else if (ev.data.payload || ev.data.config) {
            handleIncomingPayload(ev.data.payload || ev.data.config, 'broadcast');
          }
        };
      }

      if (!isPreviewMode) {
        window.addEventListener('storage', (ev) => {
          if (ev.key === STORAGE_KEY && ev.newValue) {
            try {
              handleIncomingPayload(JSON.parse(ev.newValue), 'storage');
            } catch (_) {}
          }
        });
      }

      // ─── Bootstrap ───
      renderAdsEditorList();
      applyConfig(currentConfig, isPreviewMode ? 'flow' : 'entry');
      initFirebase();
    })();
  </script>
</body>
</html>
