<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📢 Anuncios Animados (1 Línea Derecha a Izquierda) – Zero FM</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    @layer reset, base, components, styles, animations, utilities;

    @property --animation-reduced {
      syntax: "*";
      inherits: false;
      initial-value: none;
    }

    @property --border-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @layer reset {
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :where([hidden]),
      .is-hidden {
        display: none !important;
      }
    }

    @layer base {
      :root {
        --in-oklab: ;
        --in-oklch: ;

        /* Physics-based easings */
        --spring-easing: linear(
          0, 0.016 0.5%, 0.06 1%, 0.226 2%, 1.116 5.4%, 1.375 6.6%, 1.527 7.7%,
          1.565 8.2%, 1.585 8.8%, 1.581 9.3%, 1.559 9.8%, 1.458 10.9%, 0.937 14.3%,
          0.784 15.5%, 0.693 16.6%, 0.67 17.1%, 0.657 17.7%, 0.671 18.7%, 0.729 19.8%,
          1.042 23.3%, 1.13 24.5%, 1.182 25.6%, 1.201 26.7%, 1.192 27.7%, 1.156 28.8%,
          0.977 32.2%, 0.925 33.4%, 0.894 34.5%, 0.882 35.6%, 0.887 36.6%, 0.907 37.7%,
          1.045 42.4%, 1.069 44.5%, 1.059 46.3%, 0.979 50.9%, 0.96 53.4%, 0.966 55.3%,
          1.013 59.9%, 1.024 62.3%, 0.986 71.2%, 1.008 79.9%, 0.995 88.9%, 1
        );
        --bounce-easing: linear(
          0, 0.214 14.7%, 0.386 23.7%, 0.598 31.9%, 0.999 44.7%, 0.807 52.6%,
          0.762 56%, 0.747 59.4%, 0.758 62.4%, 0.793 65.6%, 0.999 77.4%,
          0.961 81.2%, 0.949 84.8%, 0.956 88%, 0.993 95.5%, 1
        );

        /* Dynamic Config Variables */
        --font-active: 'Outfit', system-ui, -apple-system, sans-serif;
        --ad-font-size: 1.5rem;
        --fade-in-dur: 0.7s;
        --fade-out-dur: 0.7s;
        --rtl-duration: 10s;
        --rtl-start-x: 680px;
        --rtl-end-x: -900px;
        --rtl-pan-x: 0px;
        --stagger-step: 0.034s;
        --letter-speed: 1.8s;
        --accent-primary: #a855f7;
        --accent-secondary: #06b6d4;
        --accent-rgb: 168, 85, 247;
        --accent-sec-rgb: 6, 182, 212;
        --text-color: #ffffff;
        --card-opacity: 0.86;
        --card-radius: 999px;
      }

      @supports (background: linear-gradient(in oklab, white, black)) {
        :root {
          --in-oklab: in oklab;
          --in-oklch: in oklch;
        }
      }

      html, body {
        width: 100%;
        height: 100%;
        background: transparent !important;
        background-color: transparent !important;
        font-family: var(--font-active);
        color: var(--text-color);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: var(--animation-reduced) !important;
          transition: none !important;
        }
      }
    }

    @layer components {
      #widget-stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent !important;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1rem;
        perspective: 1100px;
      }

      #widget-stage[data-align="left"]   { justify-content: flex-start; }
      #widget-stage[data-align="center"] { justify-content: center; }
      #widget-stage[data-align="right"]  { justify-content: flex-end; }

      #widget-stage[data-vpos="top"]    { align-items: flex-start; }
      #widget-stage[data-vpos="center"] { align-items: center; }
      #widget-stage[data-vpos="bottom"] { align-items: flex-end; }

      /* Outer wrapper handles Fade In / Fade Out transitions */
      #ad-banner {
        position: relative;
        display: inline-flex;
        width: min(880px, calc(100vw - 24px));
        max-width: 100%;
        opacity: 1;
      }

      #ad-banner.phase-in,
      #ad-banner.phase-out {
        will-change: transform, opacity;
      }

      /* Inner cartel box: strictly 1 horizontal row with live floating motion */
      #ad-banner-inner {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        gap: 0.75em;
        padding: 0.52em 1.15em 0.58em 0.72em;
        border-radius: var(--card-radius);
        font-size: var(--ad-font-size);
        line-height: 1.15;
        isolation: isolate;
        animation: cartelAliveFloat 4.2s ease-in-out infinite;
        --animation-reduced: none;
      }

      @keyframes cartelAliveFloat {
        0%, 100% {
          transform: translate3d(0, 0px, 0);
        }
        25% {
          transform: translate3d(0, -2.5px, 0);
        }
        50% {
          transform: translate3d(0, 1px, 0);
        }
        75% {
          transform: translate3d(0, -1.5px, 0);
        }
      }

      /* Internal FX clipping container */
      .cartel-fx-layer {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
      }

      /* Ambient moving color orbs inside the cartel */
      .cartel-orbs {
        position: absolute;
        inset: -30%;
        opacity: 0.45;
        filter: blur(22px);
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 40%, rgba(var(--accent-rgb), 0.65) 0%, transparent 45%),
          radial-gradient(circle at 80% 60%, rgba(var(--accent-sec-rgb), 0.65) 0%, transparent 45%);
        animation: orbsDrift 6s ease-in-out infinite alternate;
      }

      @keyframes orbsDrift {
        0%   { transform: translate(-6%, -4%) scale(0.95) rotate(0deg); }
        100% { transform: translate(6%, 4%) scale(1.08) rotate(12deg); }
      }

      /* Diagonal periodic light sweep */
      .cartel-shimmer {
        position: absolute;
        top: 0;
        left: -130%;
        width: 55%;
        height: 100%;
        background: linear-gradient(
          105deg,
          transparent 15%,
          rgba(255, 255, 255, 0.22) 50%,
          transparent 85%
        );
        transform: skewX(-22deg);
        animation: cartelShimmerSweep 3.8s ease-in-out infinite;
      }

      @keyframes cartelShimmerSweep {
        0%, 45% { left: -130%; }
        100%    { left: 170%; }
      }

      /* Floating ambient particles */
      .cartel-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .cartel-particles .cp {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent-secondary);
        box-shadow: 0 0 8px var(--accent-secondary), 0 0 14px var(--accent-primary);
        opacity: 0;
        animation: cartelParticleRise 3s ease-in-out infinite;
      }

      .cartel-particles .cp:nth-child(1) { left: 14%; bottom: 10%; animation-delay: 0s; }
      .cartel-particles .cp:nth-child(2) { left: 36%; bottom: 6%;  animation-delay: 0.7s; width: 4px; height: 4px; background: #fff; }
      .cartel-particles .cp:nth-child(3) { left: 62%; bottom: 12%; animation-delay: 1.4s; background: var(--accent-primary); }
      .cartel-particles .cp:nth-child(4) { left: 84%; bottom: 8%;  animation-delay: 2.1s; width: 6px; height: 6px; }
      .cartel-particles .cp:nth-child(5) { left: 48%; bottom: 14%; animation-delay: 2.6s; width: 3.5px; height: 3.5px; background: #fde047; }

      @keyframes cartelParticleRise {
        0%   { transform: translateY(6px) scale(0.4); opacity: 0; }
        40%  { opacity: 0.9; }
        100% { transform: translateY(-28px) scale(1.15); opacity: 0; }
      }

      /* Corner Cyber Brackets (used in cyber-hud) */
      .cyber-bracket {
        display: none;
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: var(--accent-secondary);
        border-style: solid;
        pointer-events: none;
        z-index: 4;
        filter: drop-shadow(0 0 6px var(--accent-secondary));
      }
      .cyber-bracket.tl { top: -3px; left: -3px; border-width: 2.5px 0 0 2.5px; }
      .cyber-bracket.tr { top: -3px; right: -3px; border-width: 2.5px 2.5px 0 0; }
      .cyber-bracket.bl { bottom: -3px; left: -3px; border-width: 0 0 2.5px 2.5px; }
      .cyber-bracket.br { bottom: -3px; right: -3px; border-width: 0 2.5px 2.5px 0; }

      /* ─── Leading Animated Icon Pod + Pulse Rings + Equalizer ─── */
      .ad-icon-pod {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35em;
        flex-shrink: 0;
        padding: 0.28em 0.56em;
        border-radius: 999px;
        background: linear-gradient(
          135deg var(--in-oklab),
          rgba(var(--accent-rgb), 0.36),
          rgba(var(--accent-sec-rgb), 0.24)
        );
        border: 1px solid rgba(255, 255, 255, 0.24);
        box-shadow:
          0 0 18px rgba(var(--accent-rgb), 0.38),
          inset 0 1px 1px rgba(255, 255, 255, 0.35);
        z-index: 3;
      }

      .ad-icon-pod::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        border: 1.5px solid rgba(var(--accent-sec-rgb), 0.55);
        animation: podPulseRing 2s ease-out infinite;
        pointer-events: none;
      }

      @keyframes podPulseRing {
        0%   { transform: scale(0.94); opacity: 0.85; }
        75%  { transform: scale(1.16); opacity: 0; }
        100% { transform: scale(1.16); opacity: 0; }
      }

      .ad-icon-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.18em;
        line-height: 1;
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.75));
        animation: iconDance 2.1s ease-in-out infinite;
        --animation-reduced: none;
      }

      @keyframes iconDance {
        0%, 100% { transform: scale(1) rotate(0deg) translateY(0); }
        25%      { transform: scale(1.15) rotate(-8deg) translateY(-1px); }
        50%      { transform: scale(1.05) rotate(5deg) translateY(1px); }
        75%      { transform: scale(1.12) rotate(-4deg) translateY(-1px); }
      }

      /* Live 4-bar Equalizer inside Icon Pod */
      .ad-eq-bars {
        display: inline-flex;
        align-items: flex-end;
        gap: 2.5px;
        height: 0.95em;
        padding-bottom: 1px;
      }

      .ad-eq-bars span {
        width: 3px;
        border-radius: 99px;
        background: linear-gradient(180deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 6px var(--accent-secondary);
        animation: eqBounce 0.75s ease-in-out infinite alternate;
      }

      .ad-eq-bars span:nth-child(1) { height: 45%; animation-duration: 0.55s; }
      .ad-eq-bars span:nth-child(2) { height: 95%; animation-duration: 0.72s; animation-delay: 0.15s; }
      .ad-eq-bars span:nth-child(3) { height: 65%; animation-duration: 0.48s; animation-delay: 0.3s; }
      .ad-eq-bars span:nth-child(4) { height: 85%; animation-duration: 0.64s; animation-delay: 0.08s; }

      @keyframes eqBounce {
        0%   { transform: scaleY(0.28); opacity: 0.7; }
        100% { transform: scaleY(1);    opacity: 1; }
      }

      /* Live pill tag inside icon pod */
      .ad-live-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.28em;
        padding: 0.1em 0.46em;
        border-radius: 999px;
        font-size: 0.52em;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(var(--accent-rgb), 0.32);
        border: 1px solid rgba(var(--accent-rgb), 0.7);
        color: #fff;
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.38);
      }

      .ad-live-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent-secondary);
        box-shadow: 0 0 8px var(--accent-secondary);
        animation: liveDotBlink 1.1s ease-in-out infinite alternate;
      }

      @keyframes liveDotBlink {
        0%   { opacity: 0.35; transform: scale(0.85); }
        100% { opacity: 1;    transform: scale(1.2); }
      }

      /* ─── STRICT 1-LINE RIGHT-TO-LEFT VIEWPORT ─── */
      .ad-single-line-viewport {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        padding-block: 0.14em;
        mask-image: linear-gradient(to right, transparent 0%, #000 4%, #000 96%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 4%, #000 96%, transparent 100%);
      }

      .ad-rtl-track {
        display: inline-flex;
        align-items: center;
        flex-wrap: nowrap;
        white-space: nowrap;
        gap: 1.5em;
        will-change: transform;
      }

      /* Mode 1 (Default): Desfile de Derecha a Izquierda en 1 Sola Línea */
      #widget-stage[data-flow-mode="rtl-marquee"] .ad-rtl-track.is-running {
        animation: rtlMarqueePass var(--rtl-duration) linear forwards;
        --animation-reduced: none;
      }

      @keyframes rtlMarqueePass {
        0%   { transform: translate3d(var(--rtl-start-x, 680px), 0, 0); }
        100% { transform: translate3d(var(--rtl-end-x, -900px), 0, 0); }
      }

      /* Mode 2: Ticker Continuo Infinito de Derecha a Izquierda */
      #widget-stage[data-flow-mode="rtl-continuous"] .ad-rtl-track.is-running {
        animation: rtlContinuousLoop var(--rtl-duration) linear infinite;
        --animation-reduced: none;
      }

      @keyframes rtlContinuousLoop {
        0%   { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }

      /* Mode 3: Entrada de Derecha a Izquierda + Lectura Viva */
      #widget-stage[data-flow-mode="rtl-slide"] .ad-rtl-track.is-running {
        animation:
          rtlSlideInFromRight 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards,
          rtlSlowPanLeft calc(var(--rtl-duration) - 0.75s) ease-in-out 0.75s forwards;
        --animation-reduced: none;
      }

      @keyframes rtlSlideInFromRight {
        0%   { transform: translate3d(var(--rtl-start-x, 650px), 0, 0); opacity: 0.2; }
        100% { transform: translate3d(0, 0, 0); opacity: 1; }
      }

      @keyframes rtlSlowPanLeft {
        0%   { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(var(--rtl-pan-x, -40px), 0, 0); }
      }

      /* 1-Line Headline Container */
      .ad-headline {
        display: inline-flex;
        flex-wrap: nowrap;
        white-space: nowrap;
        align-items: center;
        gap: 0.3em;
        font-weight: 900;
        letter-spacing: 0.02em;
        line-height: 1.15;
      }

      .ad-word {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
      }

      /* Separator pill between items or sections on the single line */
      .ad-sep-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.06em 0.5em;
        border-radius: 999px;
        font-size: 0.72em;
        font-weight: 800;
        color: var(--accent-secondary);
        background: rgba(var(--accent-sec-rgb), 0.16);
        border: 1px solid rgba(var(--accent-sec-rgb), 0.45);
        box-shadow: 0 0 10px rgba(var(--accent-sec-rgb), 0.3);
        margin-inline: 0.25em;
      }

      /* Highlighted command badge (e.g. !zr) */
      .ad-word.is-command {
        padding: 0.05em 0.45em;
        border-radius: 0.42em;
        background: linear-gradient(
          135deg var(--in-oklab),
          rgba(var(--accent-rgb), 0.48),
          rgba(var(--accent-sec-rgb), 0.38)
        );
        border: 1px solid rgba(var(--accent-sec-rgb), 0.85);
        box-shadow:
          0 0 14px rgba(var(--accent-sec-rgb), 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        font-family: 'JetBrains Mono', monospace;
        animation: cmdBadgePulse 1.8s ease-in-out infinite;
      }

      @keyframes cmdBadgePulse {
        0%, 100% {
          box-shadow: 0 0 12px rgba(var(--accent-sec-rgb), 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 22px rgba(var(--accent-sec-rgb), 0.8), 0 0 12px rgba(var(--accent-rgb), 0.5);
          transform: scale(1.04);
        }
      }

      /* Individual Character Span */
      .ad-char {
        display: inline-block;
        will-change: transform, opacity;
        --char-delay: calc(var(--sibling-index, 1) * var(--stagger-step));
      }

      @supports (animation-delay: calc(sibling-index() * 0.1s)) {
        .ad-char {
          --char-delay: calc(sibling-index() * var(--stagger-step));
        }
      }

      /* Progress bar indicator inside banner */
      .ad-timer-bar {
        position: absolute;
        left: 1.4em;
        right: 1.4em;
        bottom: 0.12em;
        height: 2.5px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        pointer-events: none;
        z-index: 3;
      }

      .ad-timer-fill {
        width: 100%;
        height: 100%;
        transform-origin: right center;
        background: linear-gradient(270deg var(--in-oklab), var(--accent-primary), var(--accent-secondary), #ffffff);
        box-shadow: 0 0 10px var(--accent-secondary);
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       LAYER: ESTILOS DEL CARTEL (data-banner-style) — 1 SOLA LÍNEA
       ═══════════════════════════════════════════════════════════════════ */
    @layer styles {
      @keyframes rotateBorderAngle {
        to { --border-angle: 360deg; }
      }

      /* ─── 1. KINETIC GLASS (Cristal Dinámico 3D) ─── */
      :where(#widget-stage[data-banner-style="kinetic-glass"]) #ad-banner-inner {
        border-radius: 999px;
        background:
          linear-gradient(135deg var(--in-oklab), rgba(16, 14, 32, calc(var(--card-opacity) * 0.94)), rgba(28, 12, 38, calc(var(--card-opacity) * 0.88))) padding-box,
          conic-gradient(from var(--border-angle), var(--accent-primary), var(--accent-secondary), rgba(255,255,255,0.28), var(--accent-primary)) border-box;
        border: 2px solid transparent;
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        box-shadow:
          0 14px 36px -8px rgba(0, 0, 0, 0.65),
          0 0 26px rgba(var(--accent-rgb), 0.3),
          inset 0 1px 1px rgba(255, 255, 255, 0.32);
        animation:
          cartelAliveFloat 4.2s ease-in-out infinite,
          rotateBorderAngle 4.5s linear infinite;
      }

      /* ─── 2. CYBERPUNK BROADCAST HUD (cyber-hud) ─── */
      :where(#widget-stage[data-banner-style="cyber-hud"]) #ad-banner-inner {
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(6, 10, 26, 0.94), rgba(20, 6, 34, 0.94));
        border: 1.5px solid rgba(var(--accent-sec-rgb), 0.7);
        box-shadow:
          0 0 28px rgba(var(--accent-rgb), 0.42),
          inset 0 0 22px rgba(var(--accent-sec-rgb), 0.18),
          inset 4px 0 0 var(--accent-primary),
          inset -4px 0 0 var(--accent-secondary);
      }

      :where(#widget-stage[data-banner-style="cyber-hud"]) .ad-icon-pod {
        border-radius: 6px;
      }

      :where(#widget-stage[data-banner-style="cyber-hud"]) .cyber-bracket {
        display: block;
        animation: bracketPulse 1.6s ease-in-out infinite alternate;
      }

      @keyframes bracketPulse {
        0%   { transform: scale(1); opacity: 0.75; }
        100% { transform: scale(1.15); opacity: 1; }
      }

      :where(#widget-stage[data-banner-style="cyber-hud"]) .cartel-fx-layer::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 229, 255, 0.06) 0px,
          rgba(0, 229, 255, 0.06) 1px,
          transparent 1px,
          transparent 4px
        );
        pointer-events: none;
      }

      /* ─── 3. CÁPSULA PLASMA NEÓN (neon-capsule) ─── */
      :where(#widget-stage[data-banner-style="neon-capsule"]) #ad-banner-inner {
        border-radius: 999px;
        background:
          linear-gradient(135deg, rgba(12, 8, 26, 0.92), rgba(24, 8, 36, 0.9)) padding-box,
          conic-gradient(from var(--border-angle), #ff0055, #00e5ff, #a855f7, #fde047, #ff0055) border-box;
        border: 2.5px solid transparent;
        box-shadow:
          0 0 26px rgba(var(--accent-rgb), 0.52),
          0 0 48px rgba(var(--accent-sec-rgb), 0.28),
          inset 0 0 18px rgba(var(--accent-rgb), 0.22);
        animation:
          cartelAliveFloat 3.8s ease-in-out infinite,
          rotateBorderAngle 3.2s linear infinite;
      }

      /* ─── 4. CARTEL VIP IMPERIAL 3D (royal-gold) ─── */
      :where(#widget-stage[data-banner-style="royal-gold"]) #ad-banner-inner {
        border-radius: 999px;
        background:
          linear-gradient(145deg, rgba(36, 24, 6, 0.95), rgba(14, 10, 4, 0.95)) padding-box,
          conic-gradient(from var(--border-angle), #ffd700, #fffbeb, #b45309, #ffd700) border-box;
        border: 2px solid transparent;
        box-shadow:
          0 12px 34px rgba(0, 0, 0, 0.7),
          0 0 28px rgba(255, 215, 0, 0.38),
          inset 0 2px 3px rgba(255, 250, 205, 0.45),
          inset 0 -3px 8px rgba(180, 120, 10, 0.35);
        animation:
          cartelAliveFloat 4.4s ease-in-out infinite,
          rotateBorderAngle 5s linear infinite;
      }

      :where(#widget-stage[data-banner-style="royal-gold"]) .ad-icon-pod {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.32), rgba(180, 83, 9, 0.32));
        border-color: rgba(255, 235, 130, 0.65);
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.45);
      }

      :where(#widget-stage[data-banner-style="royal-gold"]) .ad-live-tag {
        background: linear-gradient(135deg, #ffd700, #d97706);
        color: #1c1000;
        border-color: #fef08a;
      }

      /* ─── 5. ESTUDIO RADIO FM + ECUALIZADOR (radio-eq) ─── */
      :where(#widget-stage[data-banner-style="radio-eq"]) #ad-banner-inner {
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 14, 48, 0.94));
        border: 1.5px solid rgba(255, 255, 255, 0.24);
        box-shadow:
          0 14px 36px rgba(0, 0, 0, 0.6),
          0 0 24px rgba(var(--accent-sec-rgb), 0.32),
          inset 0 1px 1px rgba(255, 255, 255, 0.28);
      }

      :where(#widget-stage[data-banner-style="radio-eq"]) .ad-eq-bars {
        height: 1.2em;
        gap: 3px;
      }

      :where(#widget-stage[data-banner-style="radio-eq"]) .ad-eq-bars span {
        width: 3.5px;

      /* ─── 6. HOLOGRAMA PRISMA 3D (hologram-prism) ─── */
      :where(#widget-stage[data-banner-style="hologram-prism"]) #ad-banner-inner {
        border-radius: 999px;
        background: linear-gradient(
          135deg var(--in-oklab),
          rgba(0, 240, 255, 0.26) 0%,
          rgba(168, 85, 247, 0.3) 50%,
          rgba(255, 0, 128, 0.26) 100%

        backdrop-filter: blur(24px) saturate(200%) brightness(1.1);
        -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.1);
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 14px 38px rgba(168, 85, 247, 0.35),
          0 0 26px rgba(0, 240, 255, 0.32),

      /* ─── 7. FUEGO / ALTA ENERGÍA (fire-energy) ─── */
      :where(#widget-stage[data-banner-style="fire-energy"]) #ad-banner-inner {

        background:

        border: 2px solid transparent;
        box-shadow:

          cartelAliveFloat 3.6s ease-in-out infinite,

      :where(#widget-stage[data-banner-style="fire-energy"]) .cartel-particles .cp {

        box-shadow: 0 0 8px #f97316, 0 0 14px #dc2626;

      /* ─── 8. PURO TEXTO FLOTANTE VIVO (minimal-floating) ─── */
      :where(#widget-stage[data-banner-style="minimal-floating"]) #ad-banner-inner,
      :where(#widget-stage[data-theme="transparent"]) #ad-banner-inner {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        padding-inline: 0.4em;
      }

      :where(#widget-stage[data-banner-style="minimal-floating"]) .cartel-orbs,
      :where(#widget-stage[data-banner-style="minimal-floating"]) .cartel-shimmer,
      :where(#widget-stage[data-theme="transparent"]) .cartel-orbs,
      :where(#widget-stage[data-theme="transparent"]) .cartel-shimmer {
        display: none;
      }

      /* ─── SVG Vector Frame (solo visible en mg-vector-hud) ─── */
      .mg-vector-svg {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
        z-index: 4;
      }

      .mg-vector-rect {
        fill: none;
        stroke: var(--accent-primary);
        stroke-width: 2;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
        stroke-dasharray: 2400;
        stroke-dashoffset: 0;
      }

      /* ─── 9. BROADCAST LOWER-THIRD (After Effects TV / Keynote) ─── */
      :where(#widget-stage[data-banner-style="mg-lower-third"]) #ad-banner-inner {
        border-radius: 12px;
        padding-inline: 1.35em 1.5em;
        background: rgba(10, 12, 19, calc(var(--card-opacity) * 0.96));
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-left: 5px solid var(--accent-primary);
        box-shadow:
          0 18px 42px rgba(0, 0, 0, 0.55),
          -4px 0 22px rgba(var(--accent-rgb), 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
        animation: none;
      }

      :where(#widget-stage[data-banner-style="mg-lower-third"]) .cartel-orbs,
      :where(#widget-stage[data-banner-style="mg-lower-third"]) .cartel-shimmer,
      :where(#widget-stage[data-banner-style="mg-lower-third"]) .cartel-particles {
        display: none;
      }

      :where(#widget-stage[data-banner-style="mg-lower-third"]) .ad-icon-pod {
        border-radius: 8px;
        background: rgba(var(--accent-rgb), 0.16);
        border: 1px solid rgba(var(--accent-rgb), 0.4);
      }

      :where(#widget-stage[data-banner-style="mg-lower-third"]) #ad-banner.phase-in #ad-banner-inner {
        animation: mgLowerThirdWipe 0.58s cubic-bezier(0.16, 1, 0.3, 1) both;

      @keyframes mgLowerThirdWipe {
        0%   { clip-path: inset(0 100% 0 0 round 12px); transform: translate3d(-12px, 0, 0); }
        100% { clip-path: inset(0 0% 0 0 round 12px); transform: translate3d(0, 0, 0); }
      }

      /* ─── 10. KINETIC EDITORIAL (Spotify Live / Apple Keynote sin caja) ─── */
      :where(#widget-stage[data-banner-style="mg-kinetic"]) #ad-banner-inner {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        padding-inline: 0.4em;
        animation: none;
      }

      :where(#widget-stage[data-banner-style="mg-kinetic"]) .cartel-fx-layer {
        display: none;
      }

      :where(#widget-stage[data-banner-style="mg-kinetic"]) .ad-headline {

        letter-spacing: -0.02em;

      :where(#widget-stage[data-banner-style="mg-kinetic"]) .ad-word.is-command {

      :where(#widget-stage[data-banner-style="mg-kinetic"]) .ad-word.is-command .ad-char {

        -webkit-text-fill-color: #09090b !important;
        text-shadow: none !important;

      @keyframes mgKineticHighlight {
        0%   { transform: scaleX(0.4) translateY(8px); opacity: 0; }
        100% { transform: scaleX(1) translateY(0); opacity: 1; }

      :where(#widget-stage[data-banner-style="mg-glass-pill"]) #ad-banner-inner {

        border: 1px solid rgba(255, 255, 255, 0.24);
        box-shadow:
          0 22px 48px rgba(0, 0, 0, 0.52),

          inset 0 1px 0 rgba(255, 255, 255, 0.34),
          inset 0 -1px 0 rgba(255, 255, 255, 0.06);
        animation: none;
      }

      :where(#widget-stage[data-banner-style="mg-glass-pill"]) .cartel-orbs,
      :where(#widget-stage[data-banner-style="mg-glass-pill"]) .cartel-particles {
        display: none;
      }

      :where(#widget-stage[data-banner-style="mg-glass-pill"]) .ad-icon-pod {
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border: none;
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.45);
      }

      /* ─── 12. VECTOR FRAME SVG (Trazo vectorial auto-dibujado) ─── */
      :where(#widget-stage[data-banner-style="mg-vector-hud"]) #ad-banner-inner {
        border-radius: 10px;
        padding-inline: 1.5em;
        background: rgba(9, 11, 18, calc(var(--card-opacity) * 0.88));
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
        animation: none;
      }

      :where(#widget-stage[data-banner-style="mg-vector-hud"]) .cartel-orbs,
      :where(#widget-stage[data-banner-style="mg-vector-hud"]) .cartel-shimmer,
      :where(#widget-stage[data-banner-style="mg-vector-hud"]) .cartel-particles {
        display: none;
      }

      :where(#widget-stage[data-banner-style="mg-vector-hud"]) .mg-vector-svg {
        display: block;
      }

      :where(#widget-stage[data-banner-style="mg-vector-hud"]) #ad-banner.phase-in .mg-vector-rect {
        animation: mgVectorDraw 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes mgVectorDraw {
        0%   { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }

      /* ─── 13. BITONO MINIMAL NEGRO (B&W Swiss Editorial Noir) ─── */
      :where(#widget-stage[data-banner-style="mg-mono-noir"]) #ad-banner-inner {
        border-radius: 10px;
        padding-inline: 1.35em 1.55em;
        background: rgba(7, 7, 9, calc(var(--card-opacity) * 0.98));
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-left: 5px solid #ffffff;
        box-shadow:
          0 20px 46px rgba(0, 0, 0, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        animation: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .cartel-fx-layer {
        display: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .ad-icon-pod {
        border-radius: 7px;
        background: #ffffff;
        color: #070709;
        border: none;
        box-shadow: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .ad-live-tag {
        color: #070709;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .ad-live-dot {
        background: #070709;
        box-shadow: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .ad-char {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        text-shadow: none !important;
        background: none !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .ad-word.is-command {
        background: #ffffff !important;
        border: none !important;
        border-radius: 6px;
        padding: 0.04em 0.42em;
        box-shadow: none !important;
        animation: none !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .ad-word.is-command .ad-char {
        color: #070709 !important;
        -webkit-text-fill-color: #070709 !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-noir"]) .ad-timer-fill {
        background: #ffffff !important;
        box-shadow: none !important;
      }

      /* ─── 14. BITONO MINIMAL BLANCO (B&W Swiss Paper High-Contrast) ─── */
      :where(#widget-stage[data-banner-style="mg-mono-white"]) #ad-banner-inner {
        border-radius: 10px;
        padding-inline: 1.35em 1.55em;
        background: rgba(248, 248, 250, calc(var(--card-opacity) * 0.99));
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(9, 9, 11, 0.18);
        border-left: 5px solid #09090b;
        box-shadow:
          0 20px 46px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        animation: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .cartel-fx-layer {
        display: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-icon-pod {
        border-radius: 7px;
        background: #09090b;
        color: #ffffff;
        border: none;
        box-shadow: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-live-tag {
        color: #ffffff;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-live-dot {
        background: #ffffff;
        box-shadow: none;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-char {
        color: #09090b !important;
        -webkit-text-fill-color: #09090b !important;
        text-shadow: none !important;
        background: none !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-sep-pill {
        color: #52525b !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-word.is-command {
        background: #09090b !important;
        border: none !important;
        border-radius: 6px;
        padding: 0.04em 0.42em;
        box-shadow: none !important;
        animation: none !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-word.is-command .ad-char {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-timer-bar {
        background: rgba(9, 9, 11, 0.14) !important;
      }

      :where(#widget-stage[data-banner-style="mg-mono-white"]) .ad-timer-fill {
        background: #09090b !important;
        box-shadow: none !important;
      }

      /* ═══════════════════════════════════════════════════════════════
         EFECTOS DE TEXTO (data-text-effect)
         ═══════════════════════════════════════════════════════════════ */
      #widget-stage[data-text-effect="neon"] .ad-char {
        text-shadow:
          0 0 8px rgba(var(--accent-rgb), 0.88),
          0 0 20px rgba(var(--accent-sec-rgb), 0.55),
          0 2px 10px rgba(0, 0, 0, 0.85);
      }

      #widget-stage[data-text-effect="shimmer"] .ad-char.is-alpha {
        background: linear-gradient(
          90deg var(--in-oklab),
          #ffffff 0%,
          var(--accent-secondary) 35%,
          var(--accent-primary) 65%,
          #ffffff 100%
        );
        background-size: 220% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation-name: shimmerText;
        animation-duration: 3.2s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.65));
      }

      @keyframes shimmerText {
        0%   { background-position: 0% center; }
        100% { background-position: 220% center; }
      }

      #widget-stage[data-text-effect="extrude3d"] .ad-char {
        text-shadow:
          1px 1px 0 var(--accent-primary),
          2px 2px 0 var(--accent-primary),
          3px 3px 0 rgba(var(--accent-sec-rgb), 0.85),
          4px 4px 12px rgba(0, 0, 0, 0.9);
      }

      #widget-stage[data-text-effect="rgb"] .ad-char {
        text-shadow:
          -2px 0 0 rgba(255, 0, 85, 0.88),
          2px 0 0 rgba(0, 229, 255, 0.88),
          0 2px 10px rgba(0, 0, 0, 0.85);
      }

      #widget-stage[data-text-effect="outline"] .ad-char.is-alpha {
        color: transparent;
        -webkit-text-stroke: 1.6px #ffffff;
        text-shadow:
          0 0 14px rgba(var(--accent-sec-rgb), 0.75),
          0 2px 10px rgba(0, 0, 0, 0.75);
      }

      #widget-stage[data-text-effect="clean"] .ad-char {
        text-shadow:
          0 2px 12px rgba(0, 0, 0, 0.92),
          0 1px 3px rgba(0, 0, 0, 0.95);
      }
    }

    @layer animations {
      /* ═══════════════════════════════════════════════════════════════
         ANIMACIONES POR LETRA (data-letter-anim) EN 1 SOLA LÍNEA
         ═══════════════════════════════════════════════════════════════ */

      /* 1. WAVE: Ola Sinusoidal Continua */
      #widget-stage[data-letter-anim="wave"] .ad-char {
        animation: charWave var(--letter-speed) ease-in-out infinite;
        animation-delay: var(--char-delay);
        --animation-reduced: none;
      }

      @keyframes charWave {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        25%      { transform: translate3d(0, -0.18em, 0) rotate(-2.5deg); }
        75%      { transform: translate3d(0, 0.08em, 0) rotate(2deg); }
      }

      /* 2. SPRING-POP */
      #widget-stage[data-letter-anim="spring"] .ad-char {
        animation:
          charSpringScale 0.82s var(--spring-easing) backwards,
          charWave 2.4s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          calc(0.82s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charSpringScale {
        from { transform: translate3d(0, 0.35em, 0) scale(0.35); }
        to   { transform: translate3d(0, 0, 0) scale(1); }
      }

      /* 3. BOUNCE-DROP */
      #widget-stage[data-letter-anim="bounce"] .ad-char {
        animation:
          charBounceDrop 0.76s var(--bounce-easing) backwards,
          charPulseSweep 2.2s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          calc(0.76s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charBounceDrop {
        from { transform: translate3d(0, -0.9em, 0) scaleY(1.2); }
        to   { transform: translate3d(0, 0, 0) scaleY(1); }
      }

      /* 4. TYPEWRITER */
      #widget-stage[data-letter-anim="typewriter"] .ad-char {
        animation:
          charTypewriter 0.08s steps(1, end) backwards,
          charWave 2.6s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          calc(0.6s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charTypewriter {
        from { opacity: 0.15; transform: scale(0.75); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* 5. FLIP-3D */
      #widget-stage[data-letter-anim="flip3d"] .ad-char {
        animation:
          charFlip3D 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards,
          charFlipWave 2.8s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          calc(0.6s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charFlip3D {
        from {
          transform: perspective(400px) rotateY(90deg) translate3d(0, 0.15em, 0);
        }
        to {
          transform: perspective(400px) rotateY(0deg) translate3d(0, 0, 0);
        }
      }

      @keyframes charFlipWave {
        0%, 100% { transform: perspective(400px) rotateY(0deg) translateY(0); }
        50%      { transform: perspective(400px) rotateY(18deg) translateY(-0.12em); }
      }

      /* 6. GLITCH */
      #widget-stage[data-letter-anim="glitch"] .ad-char {
        animation: charGlitch var(--letter-speed) steps(2, end) infinite;
        animation-delay: var(--char-delay);
        --animation-reduced: none;
      }

      @keyframes charGlitch {
        0%, 82%, 100% { transform: translate3d(0, 0, 0) skewX(0deg); }
        85%           { transform: translate3d(-2px, 1px, 0) skewX(-8deg); }
        90%           { transform: translate3d(2px, -1px, 0) skewX(8deg); }
        95%           { transform: translate3d(-1px, -1px, 0) scale(1.05); }
      }

      /* 7. PULSE-SWEEP */
      #widget-stage[data-letter-anim="pulse"] .ad-char {
        animation: charPulseSweep var(--letter-speed) ease-in-out infinite;
        animation-delay: var(--char-delay);
        --animation-reduced: none;
      }

      @keyframes charPulseSweep {
        0%, 70%, 100% {
          transform: scale(1);
          filter: brightness(1);
        }
        35% {
          transform: scale(1.14) translate3d(0, -0.06em, 0);
          filter: brightness(1.45) drop-shadow(0 0 10px var(--accent-secondary));
        }
      }

      /* 8. ELEVACIÓN EDITORIAL POR PALABRA (After Effects Masked Word Rise) */
      #widget-stage[data-letter-anim="word-rise"] .ad-word {
        animation: wordMaskedRise 0.56s cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--word-index, 0) * 58ms);
      }

      @keyframes wordMaskedRise {
        0% {
          opacity: 0;
          transform: translate3d(0, 0.85em, 0) skewY(2.5deg);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) skewY(0deg);
          filter: blur(0);
        }
      }

      /* ═══════════════════════════════════════════════════════════════
         TRANSICIONES DE ENTRADA Y SALIDA (INDEPENDIENTES: IN / OUT)
         ═══════════════════════════════════════════════════════════════ */
      #ad-banner {
        opacity: 1;
      }

      #ad-banner.is-Paused-Hidden {
        opacity: 0 !important;
        pointer-events: none;
      }

      /* 0. NINGUNA (Siempre Visible / Sin Fade) */
      #widget-stage[data-trans-in="none"] #ad-banner.phase-in,
      #widget-stage[data-trans-out="none"] #ad-banner.phase-out {
        animation: none !important;
        opacity: 1;
        transform: none;
        filter: none;
        clip-path: none;
      }

      /* 1. FADE PURO */
      #widget-stage[data-trans-in="fade"] #ad-banner.phase-in {
        animation: transFadeIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="fade"] #ad-banner.phase-out {
        animation: transFadeOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes transFadeOut {
        from { opacity: 1; }
        to   { opacity: 0; }
      }

      /* 2. FADE + BLUR CINEMÁTICO */
      #widget-stage[data-trans-in="fade-blur"] #ad-banner.phase-in {
        animation: transBlurIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="fade-blur"] #ad-banner.phase-out {
        animation: transBlurOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transBlurIn {
        from { opacity: 0; filter: blur(14px); transform: scale(0.95); }
        to   { opacity: 1; filter: blur(0px);  transform: scale(1); }
      }
      @keyframes transBlurOut {
        from { opacity: 1; filter: blur(0px);  transform: scale(1); }
        to   { opacity: 0; filter: blur(14px); transform: scale(1.03); }
      }

      /* 3. ELEVACIÓN VERTICAL (Abajo -> Arriba) */
      #widget-stage[data-trans-in="slide-up"] #ad-banner.phase-in {
        animation: transSlideUpIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="slide-up"] #ad-banner.phase-out {
        animation: transSlideUpOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transSlideUpIn {
        from { opacity: 0; transform: translate3d(0, 28px, 0) scale(0.96); }
        to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes transSlideUpOut {
        from { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        to   { opacity: 0; transform: translate3d(0, -26px, 0) scale(0.96); }
      }

      /* 4. CAÍDA SUAVE (Arriba -> Abajo) */
      #widget-stage[data-trans-in="slide-down"] #ad-banner.phase-in {
        animation: transSlideDownIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="slide-down"] #ad-banner.phase-out {
        animation: transSlideDownOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transSlideDownIn {
        from { opacity: 0; transform: translate3d(0, -28px, 0) scale(0.96); }
        to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes transSlideDownOut {
        from { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        to   { opacity: 0; transform: translate3d(0, 28px, 0) scale(0.96); }
      }

      /* 5. BARRIDO DERECHA -> IZQUIERDA */
      #widget-stage[data-trans-in="slide-lr"] #ad-banner.phase-in {
        animation: transSlideRLIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="slide-lr"] #ad-banner.phase-out {
        animation: transSlideRLOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transSlideRLIn {
        from { opacity: 0; transform: translate3d(72px, 0, 0); }
        to   { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes transSlideRLOut {
        from { opacity: 1; transform: translate3d(0, 0, 0); }
        to   { opacity: 0; transform: translate3d(-72px, 0, 0); }
      }

      /* 6. BARRIDO IZQUIERDA -> DERECHA */
      #widget-stage[data-trans-in="slide-rl"] #ad-banner.phase-in {
        animation: transSlideLRIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="slide-rl"] #ad-banner.phase-out {
        animation: transSlideLROut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transSlideLRIn {
        from { opacity: 0; transform: translate3d(-72px, 0, 0); }
        to   { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes transSlideLROut {
        from { opacity: 1; transform: translate3d(0, 0, 0); }
        to   { opacity: 0; transform: translate3d(72px, 0, 0); }
      }

      /* 7. ZOOM ELÁSTICO (Spring en transform, ease-out en opacity) */
      #widget-stage[data-trans-in="zoom-spring"] #ad-banner.phase-in {
        animation:
          transZoomScaleIn var(--fade-in-dur) cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
          transFadeIn calc(var(--fade-in-dur) * 0.45) ease-out forwards;
        animation-timing-function: var(--spring-easing), ease-out;
      }
      #widget-stage[data-trans-out="zoom-spring"] #ad-banner.phase-out {
        animation: transZoomOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transZoomScaleIn {
        from { transform: scale(0.62); }
        to   { transform: scale(1); }
      }
      @keyframes transZoomOut {
        from { opacity: 1; transform: scale(1); }
        to   { opacity: 0; transform: scale(0.74); }
      }

      /* 8. REBOTE FÍSICO (Bounce en transform, sin bounce en opacity) */
      #widget-stage[data-trans-in="bounce-pop"] #ad-banner.phase-in {
        animation:
          transBounceIn var(--fade-in-dur) cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
          transFadeIn calc(var(--fade-in-dur) * 0.35) ease-out forwards;
        animation-timing-function: var(--bounce-easing), ease-out;
      }
      #widget-stage[data-trans-out="bounce-pop"] #ad-banner.phase-out {
        animation: transBounceOut var(--fade-out-dur) cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
      }

      @keyframes transBounceIn {
        from { transform: translate3d(0, -34px, 0) scale(0.86); }
        to   { transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes transBounceOut {
        0%   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        30%  { opacity: 1; transform: translate3d(0, -8px, 0) scale(1.03); }
        100% { opacity: 0; transform: translate3d(0, 32px, 0) scale(0.84); }
      }

      @supports not (animation-timing-function: linear(0, 1)) {
        #widget-stage[data-trans-in="zoom-spring"] #ad-banner.phase-in,
        #widget-stage[data-trans-in="bounce-pop"] #ad-banner.phase-in {
          animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1), ease-out;
        }
      }

      /* 9. GIRO 3D VERTICAL (Flip X) */
      #widget-stage[data-trans-in="flip-3d"] #ad-banner.phase-in {
        animation: transFlipIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="flip-3d"] #ad-banner.phase-out {
        animation: transFlipOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transFlipIn {
        from { opacity: 0; transform: rotateX(-78deg) translate3d(0, 16px, 0); }
        to   { opacity: 1; transform: rotateX(0deg) translate3d(0, 0, 0); }
      }
      @keyframes transFlipOut {
        from { opacity: 1; transform: rotateX(0deg) translate3d(0, 0, 0); }
        to   { opacity: 0; transform: rotateX(78deg) translate3d(0, -16px, 0); }
      }

      /* 10. GIRO 3D HORIZONTAL (Flip Y) */
      #widget-stage[data-trans-in="flip-y"] #ad-banner.phase-in {
        animation: transFlipYIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="flip-y"] #ad-banner.phase-out {
        animation: transFlipYOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transFlipYIn {
        from { opacity: 0; transform: rotateY(-72deg) scale(0.92); }
        to   { opacity: 1; transform: rotateY(0deg) scale(1); }
      }
      @keyframes transFlipYOut {
        from { opacity: 1; transform: rotateY(0deg) scale(1); }
        to   { opacity: 0; transform: rotateY(72deg) scale(0.92); }
      }

      /* 11. CORTINA CINEMÁTICA (clip-path horizontal) */
      #widget-stage[data-trans-in="wipe-curtain"] #ad-banner.phase-in {
        animation: transWipeIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="wipe-curtain"] #ad-banner.phase-out {
        animation: transWipeOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transWipeIn {
        from { opacity: 0.2; clip-path: inset(0 0 0 100% round 999px); }
        to   { opacity: 1;   clip-path: inset(0 0 0 0% round 999px); }
      }
      @keyframes transWipeOut {
        from { opacity: 1;   clip-path: inset(0 0% 0 0 round 999px); }
        to   { opacity: 0.2; clip-path: inset(0 100% 0 0 round 999px); }
      }

      /* 12. APERTURA CENTRAL (clip-path iris) */
      #widget-stage[data-trans-in="iris-reveal"] #ad-banner.phase-in {
        animation: transIrisIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="iris-reveal"] #ad-banner.phase-out {
        animation: transIrisOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transIrisIn {
        from { opacity: 0.2; clip-path: inset(0 50% 0 50% round 999px); transform: scale(0.94); }
        to   { opacity: 1;   clip-path: inset(0 0% 0 0% round 999px);   transform: scale(1); }
      }
      @keyframes transIrisOut {
        from { opacity: 1;   clip-path: inset(0 0% 0 0% round 999px);   transform: scale(1); }
        to   { opacity: 0.2; clip-path: inset(0 50% 0 50% round 999px); transform: scale(0.94); }
      }

      /* 13. CORTE CYBER GLITCH (sin exceder límite de destellos) */
      #widget-stage[data-trans-in="glitch-cut"] #ad-banner.phase-in {
        animation: transGlitchIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans-out="glitch-cut"] #ad-banner.phase-out {
        animation: transGlitchOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transGlitchIn {
        0%   { opacity: 0; transform: translate3d(-18px, 0, 0) skewX(-12deg) scaleX(1.06); }
        45%  { opacity: 0.85; transform: translate3d(8px, 0, 0) skewX(6deg) scaleX(0.98); }
        100% { opacity: 1; transform: translate3d(0, 0, 0) skewX(0deg) scaleX(1); }
      }
      @keyframes transGlitchOut {
        0%   { opacity: 1; transform: translate3d(0, 0, 0) skewX(0deg); }
        45%  { opacity: 0.75; transform: translate3d(-10px, 0, 0) skewX(-8deg); }
        100% { opacity: 0; transform: translate3d(22px, 0, 0) skewX(12deg) scaleX(0.94); }
      }

      /* 14. BROADCAST WIPE (After Effects Lower-Third Wipe In / Reverse Out) */
      #widget-stage[data-trans-in="broadcast-wipe"] #ad-banner.phase-in {
        animation: transBroadcastIn var(--fade-in-dur) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #widget-stage[data-trans-out="broadcast-wipe"] #ad-banner.phase-out {
        animation: transBroadcastOut var(--fade-out-dur) cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      @keyframes transBroadcastIn {
        0%   { opacity: 0; clip-path: inset(0 100% 0 0 round 12px); transform: translate3d(-16px, 0, 0); }
        25%  { opacity: 1; }
        100% { opacity: 1; clip-path: inset(0 0% 0 0 round 12px); transform: translate3d(0, 0, 0); }
      }
      @keyframes transBroadcastOut {
        0%   { opacity: 1; clip-path: inset(0 0% 0 0 round 12px); transform: translate3d(0, 0, 0); }
        100% { opacity: 0; clip-path: inset(0 100% 0 0 round 12px); transform: translate3d(-12px, 0, 0); }
      }
    }

    @layer utilities {
      /* ─── Hover Controls & Drawer ─── */
      #floating-controls {
        position: fixed;
        top: 8px;
        right: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity 0.22s ease, transform 0.22s ease;
        user-select: none;
      }

      body:hover #floating-controls,
      body.config-open #floating-controls {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .ctrl-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(12, 10, 24, 0.88);
        color: #fff;
        font-family: 'Outfit', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.32rem 0.62rem;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }

      .ctrl-btn:hover {
        background: rgba(var(--accent-rgb), 0.35);
        border-color: var(--accent-primary);
        transform: translateY(-1px);
      }

      #settings-drawer {
        position: fixed;
        top: 44px;
        right: 10px;
        width: 400px;
        max-width: calc(100vw - 20px);
        max-height: calc(100dvh - 54px);
        overflow-y: auto;
        background: rgba(12, 10, 22, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        padding: 14px;
        z-index: 10000;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(24px);
        display: none;
        flex-direction: column;
        gap: 10px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.75rem;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
      }

      #settings-drawer.open {
        display: flex;
      }

      .cfg-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .cfg-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .cfg-row label {
        font-weight: 600;
        color: rgba(255, 255, 255, 0.88);
        display: flex;
        justify-content: space-between;
      }

      .cfg-row select,
      .cfg-row input[type="text"],
      .cfg-row input[type="number"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.07);
        color: #fff;
        font-family: inherit;
        font-size: 0.75rem;
      }

      .cfg-row select option {
        background: #121024;
        color: #fff;
      }

      .ad-list-editor {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 190px;
        overflow-y: auto;
        padding: 6px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .ad-item-row {
        display: grid;
        grid-template-columns: 32px 36px 1fr auto;
        gap: 5px;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        padding: 5px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .ad-item-row.is-active-row {
        border-color: rgba(var(--accent-sec-rgb), 0.7);
        background: rgba(var(--accent-rgb), 0.14);
      }

      .ad-item-row input {
        padding: 5px 7px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-size: 0.73rem;
        width: 100%;
      }

      .btn-show-ad {
        background: rgba(6, 182, 212, 0.22);
        border: 1px solid rgba(6, 182, 212, 0.55);
        color: #67e8f9;
        border-radius: 6px;
        padding: 5px 0;
        cursor: pointer;
        font-size: 0.7rem;
        font-weight: 800;
      }

      .btn-del-ad {
        background: rgba(239, 68, 68, 0.18);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        border-radius: 6px;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 0.72rem;
      }

      #toast-pill {
        position: fixed;
        bottom: 10px;
        left: 14px;
        background: rgba(12, 10, 24, 0.94);
        border: 1px solid var(--accent-primary);
        color: #fff;
        padding: 5px 12px;
        border-radius: 999px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.73rem;
        font-weight: 700;
        z-index: 10001;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      #toast-pill.show {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Escenario Principal: 1 Sola Línea de Derecha a Izquierda -->
  <div
    id="widget-stage"
    data-banner-style="kinetic-glass"
    data-flow-mode="rtl-marquee"
    data-letter-anim="wave"
    data-trans="fade-blur"
    data-trans-in="fade-blur"
    data-trans-out="fade-blur"
    data-text-effect="neon"
    data-theme="glass"
    data-align="center"
    data-vpos="center"
  >
    <div id="ad-banner" role="status" aria-live="polite">
      <div id="ad-banner-inner">
        <!-- Brackets para estilo Cyber HUD -->
        <span class="cyber-bracket tl"></span>
        <span class="cyber-bracket tr"></span>
        <span class="cyber-bracket bl"></span>
        <span class="cyber-bracket br"></span>

        <!-- Marco Vectorial SVG para estilo Vector Frame HUD -->
        <svg class="mg-vector-svg" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
          <rect class="mg-vector-rect" x="1" y="1" width="998" height="98" rx="10" ry="10"></rect>
        </svg>

        <!-- Efectos Internos del Cartel (Orbes, Shimmer, Partículas) -->
        <div class="cartel-fx-layer">
          <div class="cartel-orbs"></div>
          <div class="cartel-shimmer"></div>
          <div class="cartel-particles">
            <span class="cp"></span>
            <span class="cp"></span>
            <span class="cp"></span>
            <span class="cp"></span>
            <span class="cp"></span>
          </div>
        </div>

        <!-- Cápsula Dinámica de Ícono + Ecualizador en Vivo + Badge LIVE -->
        <div id="ad-icon-pod" class="ad-icon-pod">
          <span id="ad-icon" class="ad-icon-wrap">🎧</span>
          <div class="ad-eq-bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <span class="ad-live-tag"><span class="ad-live-dot"></span>LIVE</span>
        </div>

        <!-- Pista en 1 Sola Línea de Derecha a Izquierda -->
        <div id="ad-viewport" class="ad-single-line-viewport">
          <div id="ad-rtl-track" class="ad-rtl-track is-running">
            <div id="ad-headline" class="ad-headline"></div>
          </div>
        </div>

        <!-- Barra de Tiempo Animada (Derecha a Izquierda) -->
        <div id="ad-timer-bar" class="ad-timer-bar">
          <div id="ad-timer-fill" class="ad-timer-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles Flotantes (Visibles al pasar el mouse) -->
  <div id="floating-controls">
    <button type="button" class="ctrl-btn" id="btn-cycle-style" title="Cambiar Estilo del Cartel">🎴 Cartel</button>
    <button type="button" class="ctrl-btn" id="btn-cycle-flow" title="Cambiar Modo Derecha a Izquierda">➡️⬅️ Flujo</button>
    <button type="button" class="ctrl-btn" id="btn-cycle-letter" title="Cambiar Animación de Letras">🔤 Letras</button>
    <button type="button" class="ctrl-btn" id="btn-cycle-effect" title="Cambiar Efecto de Texto">🌈 Efecto</button>
    <button type="button" class="ctrl-btn" id="btn-cycle-trans" title="Cambiar o Quitar Transición Fade In/Out">✨ Fade</button>
    <button type="button" class="ctrl-btn" id="btn-preview-trans" title="Probar Entrada/Salida Ahora">🎬 Probar</button>
    <button type="button" class="ctrl-btn" id="btn-next-ad" title="Siguiente Mensaje">⏭️ Siguiente</button>
    <button type="button" class="ctrl-btn" id="btn-settings" title="Cambiar Mensaje y Configurar">✍️ Mensaje / ⚙️</button>
  </div>

  <!-- Panel de Configuración Flotante -->
  <div id="settings-drawer" role="dialog" aria-label="Configurar Widget de Anuncios">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;">
