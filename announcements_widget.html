<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📢 Anuncios Animados – Zero FM</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    @layer reset, base, components, styles, animations, utilities;

    @property --animation-reduced {
      syntax: "*";
      inherits: false;
      initial-value: none;
    }

    @property --border-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @layer reset {
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :where([hidden]),
      .is-hidden {
        display: none !important;
      }
    }

    @layer base {
      :root {
        --in-oklab: ;
        --in-oklch: ;

        /* Physics-based easings */
        --spring-easing: linear(
          0, 0.016 0.5%, 0.06 1%, 0.226 2%, 1.116 5.4%, 1.375 6.6%, 1.527 7.7%,
          1.565 8.2%, 1.585 8.8%, 1.581 9.3%, 1.559 9.8%, 1.458 10.9%, 0.937 14.3%,
          0.784 15.5%, 0.693 16.6%, 0.67 17.1%, 0.657 17.7%, 0.671 18.7%, 0.729 19.8%,
          1.042 23.3%, 1.13 24.5%, 1.182 25.6%, 1.201 26.7%, 1.192 27.7%, 1.156 28.8%,
          0.977 32.2%, 0.925 33.4%, 0.894 34.5%, 0.882 35.6%, 0.887 36.6%, 0.907 37.7%,
          1.045 42.4%, 1.069 44.5%, 1.059 46.3%, 0.979 50.9%, 0.96 53.4%, 0.966 55.3%,
          1.013 59.9%, 1.024 62.3%, 0.986 71.2%, 1.008 79.9%, 0.995 88.9%, 1
        );
        --bounce-easing: linear(
          0, 0.214 14.7%, 0.386 23.7%, 0.598 31.9%, 0.999 44.7%, 0.807 52.6%,
          0.762 56%, 0.747 59.4%, 0.758 62.4%, 0.793 65.6%, 0.999 77.4%,
          0.961 81.2%, 0.949 84.8%, 0.956 88%, 0.993 95.5%, 1
        );

        /* Dynamic Config Variables */
        --font-active: 'Outfit', system-ui, -apple-system, sans-serif;
        --ad-font-size: 1.5rem;
        --ad-sub-size: 0.9rem;
        --fade-in-dur: 0.85s;
        --fade-out-dur: 0.75s;
        --stagger-step: 0.036s;
        --letter-speed: 1.8s;
        --accent-primary: #ff0055;
        --accent-secondary: #00e5ff;
        --accent-rgb: 255, 0, 85;
        --accent-sec-rgb: 0, 229, 255;
        --text-color: #ffffff;
        --card-opacity: 0.78;
        --card-radius: 26px;
        --fit-scale: 1;
      }

      @supports (background: linear-gradient(in oklab, white, black)) {
        :root {
          --in-oklab: in oklab;
          --in-oklch: in oklch;
        }
      }

      html, body {
        width: 100%;
        height: 100%;
        background: transparent !important;
        background-color: transparent !important;
        font-family: var(--font-active);
        color: var(--text-color);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: var(--animation-reduced) !important;
          transition: none !important;
        }
      }
    }

    @layer components {
      #widget-stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent !important;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.25rem;
        perspective: 1100px;
        contain: layout style;
      }

      #widget-stage[data-align="left"]   { justify-content: flex-start; }
      #widget-stage[data-align="center"] { justify-content: center; }
      #widget-stage[data-align="right"]  { justify-content: flex-end; }

      #widget-stage[data-vpos="top"]    { align-items: flex-start; }
      #widget-stage[data-vpos="center"] { align-items: center; }
      #widget-stage[data-vpos="bottom"] { align-items: flex-end; }

      /* Outer wrapper handles Fade In / Fade Out transitions */
      #ad-banner {
        position: relative;
        display: inline-flex;
        transform-style: preserve-3d;
        will-change: transform, opacity, filter;
      }

      /* Scale wrapper guarantees the 2-line cartel always fits horizontally */
      #ad-scale-wrap {
        display: inline-flex;
        transform: scale(var(--fit-scale, 1));
        transform-origin: center center;
        transition: transform 0.25s ease;
      }

      #widget-stage[data-align="left"] #ad-scale-wrap { transform-origin: left center; }
      #widget-stage[data-align="right"] #ad-scale-wrap { transform-origin: right center; }

      /* Inner cartel box handles continuous 3D floating + cartel style visuals */
      #ad-banner-inner {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.9em;
        padding: 0.68em 1.45em 0.78em 1.1em;
        border-radius: var(--card-radius);
        font-size: var(--ad-font-size);
        line-height: 1.18;
        isolation: isolate;
        transform-style: preserve-3d;
        animation: cartelAliveFloat 4.2s ease-in-out infinite;
        --animation-reduced: none;
      }

      @keyframes cartelAliveFloat {
        0%, 100% {
          transform: translate3d(0, 0px, 0) rotateX(0deg) rotateY(0deg);
        }
        25% {
          transform: translate3d(0, -4px, 6px) rotateX(2.2deg) rotateY(-1.6deg);
        }
        50% {
          transform: translate3d(0, 1px, 10px) rotateX(-1.2deg) rotateY(1.8deg);
        }
        75% {
          transform: translate3d(0, -3px, 4px) rotateX(1.5deg) rotateY(1.2deg);
        }
      }

      /* Internal FX clipping container */
      .cartel-fx-layer {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
      }

      /* Ambient moving color orbs inside the cartel */
      .cartel-orbs {
        position: absolute;
        inset: -30%;
        opacity: 0.45;
        filter: blur(22px);
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 40%, rgba(var(--accent-rgb), 0.65) 0%, transparent 45%),
          radial-gradient(circle at 80% 60%, rgba(var(--accent-sec-rgb), 0.65) 0%, transparent 45%);
        animation: orbsDrift 6s ease-in-out infinite alternate;
      }

      @keyframes orbsDrift {
        0%   { transform: translate(-6%, -4%) scale(0.95) rotate(0deg); }
        100% { transform: translate(6%, 4%) scale(1.08) rotate(12deg); }
      }

      /* Diagonal periodic light sweep */
      .cartel-shimmer {
        position: absolute;
        top: 0;
        left: -130%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          105deg,
          transparent 15%,
          rgba(255, 255, 255, 0.22) 50%,
          transparent 85%
        );
        transform: skewX(-22deg);
        animation: cartelShimmerSweep 3.8s ease-in-out infinite;
      }

      @keyframes cartelShimmerSweep {
        0%, 45% { left: -130%; }
        100%    { left: 170%; }
      }

      /* Floating ambient particles */
      .cartel-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .cartel-particles .cp {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent-secondary);
        box-shadow: 0 0 8px var(--accent-secondary), 0 0 14px var(--accent-primary);
        opacity: 0;
        animation: cartelParticleRise 3s ease-in-out infinite;
      }

      .cartel-particles .cp:nth-child(1) { left: 12%; bottom: 10%; animation-delay: 0s; }
      .cartel-particles .cp:nth-child(2) { left: 34%; bottom: 6%;  animation-delay: 0.7s; width: 4px; height: 4px; background: #fff; }
      .cartel-particles .cp:nth-child(3) { left: 62%; bottom: 12%; animation-delay: 1.4s; background: var(--accent-primary); }
      .cartel-particles .cp:nth-child(4) { left: 84%; bottom: 8%;  animation-delay: 2.1s; width: 6px; height: 6px; }
      .cartel-particles .cp:nth-child(5) { left: 48%; bottom: 14%; animation-delay: 2.6s; width: 3.5px; height: 3.5px; background: #fde047; }

      @keyframes cartelParticleRise {
        0%   { transform: translateY(8px) scale(0.4); opacity: 0; }
        40%  { opacity: 0.9; }
        100% { transform: translateY(-34px) scale(1.15); opacity: 0; }
      }

      /* Corner Cyber Brackets (used in cyber-hud) */
      .cyber-bracket {
        display: none;
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: var(--accent-secondary);
        border-style: solid;
        pointer-events: none;
        z-index: 4;
        filter: drop-shadow(0 0 6px var(--accent-secondary));
      }
      .cyber-bracket.tl { top: -3px; left: -3px; border-width: 2.5px 0 0 2.5px; }
      .cyber-bracket.tr { top: -3px; right: -3px; border-width: 2.5px 2.5px 0 0; }
      .cyber-bracket.bl { bottom: -3px; left: -3px; border-width: 0 0 2.5px 2.5px; }
      .cyber-bracket.br { bottom: -3px; right: -3px; border-width: 0 2.5px 2.5px 0; }

      /* ─── Leading Animated Icon Pod + Pulse Rings + Equalizer ─── */
      .ad-icon-pod {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35em;
        flex-shrink: 0;
        padding: 0.32em 0.52em;
        border-radius: 16px;
        background: linear-gradient(
          135deg var(--in-oklab),
          rgba(var(--accent-rgb), 0.32),
          rgba(var(--accent-sec-rgb), 0.22)
        );
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          0 0 18px rgba(var(--accent-rgb), 0.38),
          inset 0 1px 1px rgba(255, 255, 255, 0.35);
      }

      .ad-icon-pod::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        border: 1.5px solid rgba(var(--accent-sec-rgb), 0.55);
        animation: podPulseRing 2s ease-out infinite;
        pointer-events: none;
      }

      @keyframes podPulseRing {
        0%   { transform: scale(0.94); opacity: 0.85; }
        75%  { transform: scale(1.18); opacity: 0; }
        100% { transform: scale(1.18); opacity: 0; }
      }

      .ad-icon-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.32em;
        line-height: 1;
        filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.75));
        animation: iconDance 2.1s ease-in-out infinite;
        --animation-reduced: none;
      }

      @keyframes iconDance {
        0%, 100% { transform: scale(1) rotate(0deg) translateY(0); }
        25%      { transform: scale(1.16) rotate(-8deg) translateY(-2px); }
        50%      { transform: scale(1.06) rotate(5deg) translateY(1px); }
        75%      { transform: scale(1.14) rotate(-4deg) translateY(-1px); }
      }

      /* Live 4-bar Equalizer inside Icon Pod */
      .ad-eq-bars {
        display: inline-flex;
        align-items: flex-end;
        gap: 2.5px;
        height: 1.05em;
        padding-bottom: 1px;
      }

      .ad-eq-bars span {
        width: 3px;
        border-radius: 99px;
        background: linear-gradient(180deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 6px var(--accent-secondary);
        animation: eqBounce 0.75s ease-in-out infinite alternate;
      }

      .ad-eq-bars span:nth-child(1) { height: 45%; animation-duration: 0.55s; }
      .ad-eq-bars span:nth-child(2) { height: 95%; animation-duration: 0.72s; animation-delay: 0.15s; }
      .ad-eq-bars span:nth-child(3) { height: 65%; animation-duration: 0.48s; animation-delay: 0.3s; }
      .ad-eq-bars span:nth-child(4) { height: 85%; animation-duration: 0.64s; animation-delay: 0.08s; }

      @keyframes eqBounce {
        0%   { transform: scaleY(0.28); opacity: 0.7; }
        100% { transform: scaleY(1);    opacity: 1; }
      }

      /* ─── STRICT 2-LINE CONTENT ARCHITECTURE ─── */
      .ad-content-col {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.22em;
        min-width: 0;
      }

      #widget-stage[data-align="center"] .ad-content-col {
        align-items: center;
        text-align: center;
      }

      /* LINE 1: Primary Headline — strictly 1 line (nowrap) */
      .ad-headline {
        display: flex;
        flex-wrap: nowrap;
        white-space: nowrap;
        align-items: center;
        gap: 0.28em;
        font-weight: 900;
        letter-spacing: 0.02em;
        line-height: 1.15;
      }

      #widget-stage[data-align="center"] .ad-headline {
        justify-content: center;
      }

      /* LINE 2: Dynamic Subtitle / Action Row — strictly 1 line (nowrap) */
      .ad-subtitle {
        display: flex;
        flex-wrap: nowrap;
        white-space: nowrap;
        align-items: center;
        gap: 0.32em;
        font-size: var(--ad-sub-size);
        font-weight: 700;
        color: rgba(255, 255, 255, 0.92);
        letter-spacing: 0.035em;
        line-height: 1.2;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      }

      #widget-stage[data-align="center"] .ad-subtitle {
        justify-content: center;
      }

      .ad-word {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
      }

      /* Highlighted command badge (e.g. !zr) */
      .ad-word.is-command {
        padding: 0.05em 0.45em;
        border-radius: 0.42em;
        background: linear-gradient(
          135deg var(--in-oklab),
          rgba(var(--accent-rgb), 0.48),
          rgba(var(--accent-sec-rgb), 0.38)
        );
        border: 1px solid rgba(var(--accent-sec-rgb), 0.85);
        box-shadow:
          0 0 14px rgba(var(--accent-sec-rgb), 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        font-family: 'JetBrains Mono', monospace;
        animation: cmdBadgePulse 1.8s ease-in-out infinite;
      }

      @keyframes cmdBadgePulse {
        0%, 100% {
          box-shadow: 0 0 12px rgba(var(--accent-sec-rgb), 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 22px rgba(var(--accent-sec-rgb), 0.8), 0 0 12px rgba(var(--accent-rgb), 0.5);
          transform: scale(1.04);
        }
      }

      /* Live pill tag on Line 2 */
      .ad-live-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
        padding: 0.08em 0.48em;
        border-radius: 999px;
        font-size: 0.78em;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(var(--accent-rgb), 0.28);
        border: 1px solid rgba(var(--accent-rgb), 0.65);
        color: #fff;
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.4);
      }

      .ad-live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-secondary);
        box-shadow: 0 0 8px var(--accent-secondary);
        animation: liveDotBlink 1.1s ease-in-out infinite alternate;
      }

      @keyframes liveDotBlink {
        0%   { opacity: 0.35; transform: scale(0.85); }
        100% { opacity: 1;    transform: scale(1.2); }
      }

      /* Individual Character Span (Line 1) */
      .ad-char {
        display: inline-block;
        will-change: transform, opacity;
        --char-delay: calc(var(--sibling-index, 1) * var(--stagger-step));
      }

      @supports (animation-delay: calc(sibling-index() * 0.1s)) {
        .ad-char {
          --char-delay: calc(sibling-index() * var(--stagger-step));
        }
      }

      /* Subtitle words (Line 2) animated entrance + subtle flow */
      .ad-sub-word {
        display: inline-flex;
        white-space: nowrap;
        animation:
          subWordPop 0.55s var(--spring-easing) backwards,
          subWordFloat 2.8s ease-in-out infinite;
        animation-delay:
          calc(0.18s + var(--sub-idx, 0) * 0.055s),
          calc(0.75s + var(--sub-idx, 0) * 0.12s);
      }

      @keyframes subWordPop {
        from { opacity: 0; transform: translateY(10px) scale(0.86); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes subWordFloat {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-2px); color: #ffffff; }
      }

      /* Progress bar indicator inside banner */
      .ad-timer-bar {
        position: absolute;
        left: 1.25em;
        right: 1.25em;
        bottom: 0.18em;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        pointer-events: none;
        z-index: 3;
      }

      .ad-timer-fill {
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg var(--in-oklab), var(--accent-primary), var(--accent-secondary), #ffffff);
        box-shadow: 0 0 10px var(--accent-secondary);
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       LAYER: ESTILOS DEL CARTEL (data-banner-style)
       8 estilos dinámicos para que el cartel de 2 líneas nunca sea estático
       ═══════════════════════════════════════════════════════════════════ */
    @layer styles {
      @keyframes rotateBorderAngle {
        to { --border-angle: 360deg; }
      }

      /* ─── 1. KINETIC GLASS (Cristal Dinámico 2 Líneas) ─── */
      :where(#widget-stage[data-banner-style="kinetic-glass"]) #ad-banner-inner {
        background:
          linear-gradient(135deg var(--in-oklab), rgba(16, 14, 32, calc(var(--card-opacity) * 0.94)), rgba(28, 12, 38, calc(var(--card-opacity) * 0.88))) padding-box,
          conic-gradient(from var(--border-angle), var(--accent-primary), var(--accent-secondary), rgba(255,255,255,0.25), var(--accent-primary)) border-box;
        border: 2px solid transparent;
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        box-shadow:
          0 16px 40px -10px rgba(0, 0, 0, 0.65),
          0 0 26px rgba(var(--accent-rgb), 0.28),
          inset 0 1px 1px rgba(255, 255, 255, 0.32);
        animation:
          cartelAliveFloat 4.2s ease-in-out infinite,
          rotateBorderAngle 4.5s linear infinite;
      }

      /* ─── 2. CYBERPUNK BROADCAST HUD (cyber-hud) ─── */
      :where(#widget-stage[data-banner-style="cyber-hud"]) #ad-banner-inner {
        border-radius: 6px;
        background: linear-gradient(135deg, rgba(6, 10, 26, 0.92), rgba(20, 6, 34, 0.92));
        border: 1.5px solid rgba(var(--accent-sec-rgb), 0.65);
        box-shadow:
          0 0 28px rgba(var(--accent-rgb), 0.42),
          inset 0 0 22px rgba(var(--accent-sec-rgb), 0.18),
          inset 4px 0 0 var(--accent-primary),
          inset -4px 0 0 var(--accent-secondary);
      }

      :where(#widget-stage[data-banner-style="cyber-hud"]) .cyber-bracket {
        display: block;
        animation: bracketPulse 1.6s ease-in-out infinite alternate;
      }

      @keyframes bracketPulse {
        0%   { transform: scale(1); opacity: 0.75; }
        100% { transform: scale(1.15); opacity: 1; }
      }

      :where(#widget-stage[data-banner-style="cyber-hud"]) .cartel-fx-layer::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 229, 255, 0.06) 0px,
          rgba(0, 229, 255, 0.06) 1px,
          transparent 1px,
          transparent 4px
        );
        pointer-events: none;
      }

      /* ─── 3. CÁPSULA PLASMA NEÓN (neon-capsule) ─── */
      :where(#widget-stage[data-banner-style="neon-capsule"]) #ad-banner-inner {
        border-radius: 999px;
        padding-inline: 1.35em 1.65em;
        background:
          linear-gradient(135deg, rgba(12, 8, 26, 0.9), rgba(24, 8, 36, 0.88)) padding-box,
          conic-gradient(from var(--border-angle), #ff0055, #00e5ff, #a855f7, #fde047, #ff0055) border-box;
        border: 2.5px solid transparent;
        box-shadow:
          0 0 26px rgba(var(--accent-rgb), 0.52),
          0 0 48px rgba(var(--accent-sec-rgb), 0.28),
          inset 0 0 18px rgba(var(--accent-rgb), 0.22);
        animation:
          cartelAliveFloat 3.8s ease-in-out infinite,
          rotateBorderAngle 3.2s linear infinite;
      }

      :where(#widget-stage[data-banner-style="neon-capsule"]) .ad-icon-pod {
        border-radius: 999px;
      }

      /* ─── 4. CARTEL VIP IMPERIAL 3D (royal-gold) ─── */
      :where(#widget-stage[data-banner-style="royal-gold"]) #ad-banner-inner {
        background:
          linear-gradient(145deg, rgba(36, 24, 6, 0.94), rgba(14, 10, 4, 0.94)) padding-box,
          conic-gradient(from var(--border-angle), #ffd700, #fffbeb, #b45309, #ffd700) border-box;
        border: 2px solid transparent;
        box-shadow:
          0 12px 34px rgba(0, 0, 0, 0.7),
          0 0 28px rgba(255, 215, 0, 0.38),
          inset 0 2px 3px rgba(255, 250, 205, 0.45),
          inset 0 -3px 8px rgba(180, 120, 10, 0.35);
        animation:
          cartelAliveFloat 4.4s ease-in-out infinite,
          rotateBorderAngle 5s linear infinite;
      }

      :where(#widget-stage[data-banner-style="royal-gold"]) .ad-icon-pod {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.32), rgba(180, 83, 9, 0.32));
        border-color: rgba(255, 235, 130, 0.65);
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.45);
      }

      :where(#widget-stage[data-banner-style="royal-gold"]) .ad-live-tag {
        background: linear-gradient(135deg, #ffd700, #d97706);
        color: #1c1000;
        border-color: #fef08a;
      }

      /* ─── 5. ESTUDIO RADIO FM + ECUALIZADOR (radio-eq) ─── */
      :where(#widget-stage[data-banner-style="radio-eq"]) #ad-banner-inner {
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 14, 48, 0.92));
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          0 14px 36px rgba(0, 0, 0, 0.6),
          0 0 24px rgba(var(--accent-sec-rgb), 0.32),
          inset 0 1px 1px rgba(255, 255, 255, 0.28);
      }

      :where(#widget-stage[data-banner-style="radio-eq"]) .ad-eq-bars {
        height: 1.35em;
        gap: 3px;
      }

      :where(#widget-stage[data-banner-style="radio-eq"]) .ad-eq-bars span {
        width: 3.5px;
      }

      /* ─── 6. HOLOGRAMA PRISMA 3D (hologram-prism) ─── */
      :where(#widget-stage[data-banner-style="hologram-prism"]) #ad-banner-inner {
        background: linear-gradient(
          135deg var(--in-oklab),
          rgba(0, 240, 255, 0.24) 0%,
          rgba(168, 85, 247, 0.28) 50%,
          rgba(255, 0, 128, 0.24) 100%
        );
        backdrop-filter: blur(24px) saturate(200%) brightness(1.1);
        -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.1);
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 14px 38px rgba(168, 85, 247, 0.35),
          0 0 26px rgba(0, 240, 255, 0.32),
          inset 0 2px 4px rgba(255, 255, 255, 0.65),
          inset 0 -2px 4px rgba(255, 0, 128, 0.35);
      }

      /* ─── 7. FUEGO / ALTA ENERGÍA (fire-energy) ─── */
      :where(#widget-stage[data-banner-style="fire-energy"]) #ad-banner-inner {
        background:
          linear-gradient(180deg, rgba(45, 10, 6, 0.94), rgba(24, 6, 4, 0.94)) padding-box,
          conic-gradient(from var(--border-angle), #fde047, #f97316, #dc2626, #f97316, #fde047) border-box;
        border: 2px solid transparent;
        box-shadow:
          0 10px 34px rgba(220, 38, 38, 0.5),
          0 0 24px rgba(249, 115, 22, 0.42),
          inset 0 -5px 18px rgba(249, 115, 22, 0.4);
        animation:
          cartelAliveFloat 3.6s ease-in-out infinite,
          rotateBorderAngle 3s linear infinite;
      }

      :where(#widget-stage[data-banner-style="fire-energy"]) .cartel-particles .cp {
        background: #fde047;
        box-shadow: 0 0 8px #f97316, 0 0 14px #dc2626;
      }

      /* ─── 8. PURO TEXTO FLOTANTE VIVO (minimal-floating) ─── */
      :where(#widget-stage[data-banner-style="minimal-floating"]) #ad-banner-inner,
      :where(#widget-stage[data-theme="transparent"]) #ad-banner-inner {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        padding-inline: 0.4em;
      }

      :where(#widget-stage[data-banner-style="minimal-floating"]) .cartel-orbs,
      :where(#widget-stage[data-banner-style="minimal-floating"]) .cartel-shimmer,
      :where(#widget-stage[data-theme="transparent"]) .cartel-orbs,
      :where(#widget-stage[data-theme="transparent"]) .cartel-shimmer {
        display: none;
      }

      /* ═══════════════════════════════════════════════════════════════
         EFECTOS DE TEXTO (data-text-effect)
         ═══════════════════════════════════════════════════════════════ */
      #widget-stage[data-text-effect="neon"] .ad-char {
        text-shadow:
          0 0 8px rgba(var(--accent-rgb), 0.88),
          0 0 20px rgba(var(--accent-sec-rgb), 0.55),
          0 2px 10px rgba(0, 0, 0, 0.85);
      }

      #widget-stage[data-text-effect="shimmer"] .ad-char.is-alpha {
        background: linear-gradient(
          90deg var(--in-oklab),
          #ffffff 0%,
          var(--accent-secondary) 35%,
          var(--accent-primary) 65%,
          #ffffff 100%
        );
        background-size: 220% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation-name: shimmerText;
        animation-duration: 3.2s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.65));
      }

      @keyframes shimmerText {
        0%   { background-position: 0% center; }
        100% { background-position: 220% center; }
      }

      #widget-stage[data-text-effect="extrude3d"] .ad-char {
        text-shadow:
          1px 1px 0 var(--accent-primary),
          2px 2px 0 var(--accent-primary),
          3px 3px 0 rgba(var(--accent-sec-rgb), 0.85),
          4px 4px 12px rgba(0, 0, 0, 0.9);
      }

      #widget-stage[data-text-effect="rgb"] .ad-char {
        text-shadow:
          -2px 0 0 rgba(255, 0, 85, 0.88),
          2px 0 0 rgba(0, 229, 255, 0.88),
          0 2px 10px rgba(0, 0, 0, 0.85);
      }

      #widget-stage[data-text-effect="outline"] .ad-char.is-alpha {
        color: transparent;
        -webkit-text-stroke: 1.6px #ffffff;
        text-shadow:
          0 0 14px rgba(var(--accent-sec-rgb), 0.75),
          0 2px 10px rgba(0, 0, 0, 0.75);
      }

      #widget-stage[data-text-effect="clean"] .ad-char {
        text-shadow:
          0 2px 12px rgba(0, 0, 0, 0.92),
          0 1px 3px rgba(0, 0, 0, 0.95);
      }
    }

    @layer animations {
      /* ═══════════════════════════════════════════════════════════════
         ANIMACIONES INTERCAMBIABLES POR LETRA (data-letter-anim)
         Todas mantienen movimiento vivo durante la fase en pantalla
         ═══════════════════════════════════════════════════════════════ */

      /* 1. WAVE: Ola Sinusoidal Continua */
      #widget-stage[data-letter-anim="wave"] .ad-char {
        animation: charWave var(--letter-speed) ease-in-out infinite;
        animation-delay: var(--char-delay);
        --animation-reduced: none;
      }

      @keyframes charWave {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        25%      { transform: translate3d(0, -0.22em, 0) rotate(-3deg); }
        75%      { transform: translate3d(0, 0.09em, 0) rotate(2deg); }
      }

      /* 2. SPRING-POP: Entrada Elástica + Flotación Continua (No estático) */
      #widget-stage[data-letter-anim="spring"] .ad-char {
        animation:
          charSpringScale 0.82s var(--spring-easing) backwards,
          charFadeOnly 0.25s ease-out backwards,
          charWave 2.4s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          var(--char-delay),
          calc(0.82s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charSpringScale {
        from { transform: translate3d(0, 0.45em, 0) scale(0.25); }
        to   { transform: translate3d(0, 0, 0) scale(1); }
      }

      @keyframes charFadeOnly {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      /* 3. BOUNCE-DROP: Caída con Rebote + Pulso Rítmico Continuo */
      #widget-stage[data-letter-anim="bounce"] .ad-char {
        animation:
          charBounceDrop 0.76s var(--bounce-easing) backwards,
          charFadeOnly 0.22s ease-out backwards,
          charPulseSweep 2.2s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          var(--char-delay),
          calc(0.76s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charBounceDrop {
        from { transform: translate3d(0, -1.1em, 0) scaleY(1.25); }
        to   { transform: translate3d(0, 0, 0) scaleY(1); }
      }

      /* 4. TYPEWRITER: Máquina de Escribir + Brillo Vivo */
      #widget-stage[data-letter-anim="typewriter"] .ad-char {
        animation:
          charTypewriter 0.08s steps(1, end) backwards,
          charWave 2.6s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          calc(0.6s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charTypewriter {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* 5. FLIP-3D: Giro 3D Secuencial + Onda 3D Continua */
      #widget-stage[data-letter-anim="flip3d"] .ad-char {
        animation:
          charFlip3D 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards,
          charFlipWave 2.8s ease-in-out infinite;
        animation-delay:
          var(--char-delay),
          calc(0.6s + var(--char-delay));
        --animation-reduced: none;
      }

      @keyframes charFlip3D {
        from {
          opacity: 0;
          transform: perspective(400px) rotateY(90deg) translate3d(0, 0.2em, 0);
        }
        to {
          opacity: 1;
          transform: perspective(400px) rotateY(0deg) translate3d(0, 0, 0);
        }
      }

      @keyframes charFlipWave {
        0%, 100% { transform: perspective(400px) rotateY(0deg) translateY(0); }
        50%      { transform: perspective(400px) rotateY(18deg) translateY(-0.14em); }
      }

      /* 6. GLITCH: Vibración Cyber / Holograma */
      #widget-stage[data-letter-anim="glitch"] .ad-char {
        animation: charGlitch var(--letter-speed) steps(2, end) infinite;
        animation-delay: var(--char-delay);
        --animation-reduced: none;
      }

      @keyframes charGlitch {
        0%, 82%, 100% { transform: translate3d(0, 0, 0) skewX(0deg); }
        85%           { transform: translate3d(-2px, 1px, 0) skewX(-8deg); }
        90%           { transform: translate3d(2px, -1px, 0) skewX(8deg); }
        95%           { transform: translate3d(-1px, -1px, 0) scale(1.05); }
      }

      /* 7. PULSE-SWEEP: Barrido de Pulso Luminoso */
      #widget-stage[data-letter-anim="pulse"] .ad-char {
        animation: charPulseSweep var(--letter-speed) ease-in-out infinite;
        animation-delay: var(--char-delay);
        --animation-reduced: none;
      }

      @keyframes charPulseSweep {
        0%, 70%, 100% {
          transform: scale(1);
          filter: brightness(1);
        }
        35% {
          transform: scale(1.16) translate3d(0, -0.08em, 0);
          filter: brightness(1.45) drop-shadow(0 0 10px var(--accent-secondary));
        }
      }

      /* ═══════════════════════════════════════════════════════════════
         TRANSICIONES DE ENTRADA Y SALIDA (FADE IN / FADE OUT)
         ═══════════════════════════════════════════════════════════════ */
      #ad-banner.is-Paused-Hidden {
        opacity: 0 !important;
        pointer-events: none;
      }

      #widget-stage[data-trans="fade"] #ad-banner.phase-in {
        animation: transFadeIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans="fade"] #ad-banner.phase-out {
        animation: transFadeOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes transFadeOut {
        from { opacity: 1; }
        to   { opacity: 0; }
      }

      #widget-stage[data-trans="fade-blur"] #ad-banner.phase-in {
        animation: transBlurIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans="fade-blur"] #ad-banner.phase-out {
        animation: transBlurOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transBlurIn {
        from { opacity: 0; filter: blur(16px); transform: scale(0.92); }
        to   { opacity: 1; filter: blur(0px);  transform: scale(1); }
      }
      @keyframes transBlurOut {
        from { opacity: 1; filter: blur(0px);  transform: scale(1); }
        to   { opacity: 0; filter: blur(16px); transform: scale(1.06); }
      }

      #widget-stage[data-trans="slide-up"] #ad-banner.phase-in {
        animation: transSlideUpIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans="slide-up"] #ad-banner.phase-out {
        animation: transSlideUpOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transSlideUpIn {
        from { opacity: 0; transform: translate3d(0, 32px, 0) scale(0.95); }
        to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes transSlideUpOut {
        from { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        to   { opacity: 0; transform: translate3d(0, -28px, 0) scale(0.95); }
      }

      #widget-stage[data-trans="slide-lr"] #ad-banner.phase-in {
        animation: transSlideLRIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans="slide-lr"] #ad-banner.phase-out {
        animation: transSlideLROut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transSlideLRIn {
        from { opacity: 0; transform: translate3d(-54px, 0, 0); }
        to   { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes transSlideLROut {
        from { opacity: 1; transform: translate3d(0, 0, 0); }
        to   { opacity: 0; transform: translate3d(54px, 0, 0); }
      }

      #widget-stage[data-trans="zoom-spring"] #ad-banner.phase-in {
        animation:
          transZoomScaleIn var(--fade-in-dur) var(--spring-easing) forwards,
          transFadeIn calc(var(--fade-in-dur) * 0.45) ease-out forwards;
      }
      #widget-stage[data-trans="zoom-spring"] #ad-banner.phase-out {
        animation: transZoomOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transZoomScaleIn {
        from { transform: scale(0.55); }
        to   { transform: scale(1); }
      }
      @keyframes transZoomOut {
        from { opacity: 1; transform: scale(1); }
        to   { opacity: 0; transform: scale(0.75); }
      }

      #widget-stage[data-trans="flip-3d"] #ad-banner.phase-in {
        animation: transFlipIn var(--fade-in-dur) cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #widget-stage[data-trans="flip-3d"] #ad-banner.phase-out {
        animation: transFlipOut var(--fade-out-dur) cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes transFlipIn {
        from { opacity: 0; transform: rotateX(-75deg) translate3d(0, 18px, 0); }
        to   { opacity: 1; transform: rotateX(0deg) translate3d(0, 0, 0); }
      }
      @keyframes transFlipOut {
        from { opacity: 1; transform: rotateX(0deg) translate3d(0, 0, 0); }
        to   { opacity: 0; transform: rotateX(75deg) translate3d(0, -18px, 0); }
      }
    }

    @layer utilities {
      /* ─── Hover Controls & Drawer ─── */
      #floating-controls {
        position: fixed;
        top: 8px;
        right: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity 0.22s ease, transform 0.22s ease;
        user-select: none;
      }

      body:hover #floating-controls,
      body.config-open #floating-controls {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .ctrl-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(12, 10, 24, 0.88);
        color: #fff;
        font-family: 'Outfit', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.32rem 0.62rem;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }

      .ctrl-btn:hover {
        background: rgba(var(--accent-rgb), 0.35);
        border-color: var(--accent-primary);
        transform: translateY(-1px);
      }

      #settings-drawer {
        position: fixed;
        top: 44px;
        right: 10px;
        width: 390px;
        max-width: calc(100vw - 20px);
        max-height: calc(100dvh - 54px);
        overflow-y: auto;
        background: rgba(12, 10, 22, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        padding: 14px;
        z-index: 10000;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(24px);
        display: none;
        flex-direction: column;
        gap: 10px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.75rem;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
      }

      #settings-drawer.open {
        display: flex;
      }

      .cfg-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .cfg-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .cfg-row label {
        font-weight: 600;
        color: rgba(255, 255, 255, 0.88);
        display: flex;
        justify-content: space-between;
      }

      .cfg-row select,
      .cfg-row input[type="text"],
      .cfg-row input[type="number"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.07);
        color: #fff;
        font-family: inherit;
        font-size: 0.75rem;
      }

      .cfg-row select option {
        background: #121024;
        color: #fff;
      }

      .ad-list-editor {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 190px;
        overflow-y: auto;
        padding: 6px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .ad-item-row {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 5px;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        padding: 5px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .ad-item-lines {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .ad-item-row input {
        padding: 4px 7px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-size: 0.72rem;
      }

      .btn-del-ad {
        background: rgba(239, 68, 68, 0.18);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        border-radius: 6px;
        padding: 6px 8px;
        cursor: pointer;
        font-size: 0.72rem;
      }

      #toast-pill {
        position: fixed;
        bottom: 10px;
        left: 14px;
        background: rgba(12, 10, 24, 0.94);
        border: 1px solid var(--accent-primary);
        color: #fff;
        padding: 5px 12px;
        border-radius: 999px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.73rem;
        font-weight: 700;
        z-index: 10001;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      #toast-pill.show {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Escenario Principal -->
  <div
    id="widget-stage"
    data-banner-style="kinetic-glass"
    data-letter-anim="wave"
    data-trans="fade-blur"
    data-text-effect="neon"
    data-theme="glass"
    data-align="center"
    data-vpos="center"
  >
    <div id="ad-banner" class="phase-in" role="status" aria-live="polite">
      <div id="ad-scale-wrap">
        <div id="ad-banner-inner">
          <!-- Brackets para estilo Cyber HUD -->
          <span class="cyber-bracket tl"></span>
          <span class="cyber-bracket tr"></span>
          <span class="cyber-bracket bl"></span>
          <span class="cyber-bracket br"></span>

          <!-- Efectos Internos del Cartel (Orbes, Shimmer, Partículas) -->
          <div class="cartel-fx-layer">
            <div class="cartel-orbs"></div>
            <div class="cartel-shimmer"></div>
            <div class="cartel-particles">
              <span class="cp"></span>
              <span class="cp"></span>
              <span class="cp"></span>
              <span class="cp"></span>
              <span class="cp"></span>
            </div>
          </div>

          <!-- Cápsula Dinámica de Ícono + Ecualizador en Vivo -->
          <div id="ad-icon-pod" class="ad-icon-pod">
            <span id="ad-icon" class="ad-icon-wrap">🎧</span>
            <div class="ad-eq-bars" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <!-- Contenido en 2 Líneas Perfectas -->
          <div class="ad-content-col">
            <div id="ad-headline" class="ad-headline"></div>
            <div id="ad-subtitle" class="ad-subtitle"></div>
          </div>

          <!-- Barra de Tiempo Animada -->
          <div id="ad-timer-bar" class="ad-timer-bar">
            <div id="ad-timer-fill" class="ad-timer-fill"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles Flotantes (Visibles al pasar el mouse) -->
  <div id="floating-controls">
    <button type="button" class="ctrl-btn" id="btn-cycle-style" title="Cambiar Estilo del Cartel">🎴 Cartel</button>
    <button type="button" class="ctrl-btn" id="btn-cycle-letter" title="Cambiar Animación de Letras">🔤 Letras</button>
    <button type="button" class="ctrl-btn" id="btn-cycle-trans" title="Cambiar Efecto Fade In / Out">✨ Fade</button>

    <div style="display:flex; gap:8px; margin-top:2px;">
      <button type="button" class="ctrl-btn" id="btn-save-cfg" style="flex:1; background:rgba(255,0,85,0.85); border-color:#ff0055;">💾 Guardar y Sincronizar</button>
      <button type="button" class="ctrl-btn" id="btn-reset-cfg">↺ Reset</button>

  <div id="toast-pill"></div>

  <script>
    (function () {
      const safeStorage = (() => {
        const mem = {};
        try {
          const k = '__zero_ads_w__';
          window.localStorage.setItem(k, k);
          window.localStorage.removeItem(k);
          return window.localStorage;
        } catch (_) {
          return {
            getItem: (k) => mem[k] || null,
            setItem: (k, v) => { mem[k] = String(v); },
            removeItem: (k) => { delete mem[k]; }
          };
        }
      })();

      const STORAGE_KEY = 'zero_announcements_widget_config';
      const urlParams = new URLSearchParams(window.location.search);
      const supportsSiblingIndex = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('animation-delay: calc(sibling-index() * 0.1s)');

      const BANNER_STYLES = [
        'kinetic-glass',
        'cyber-hud',
        'neon-capsule',
        'royal-gold',
        'radio-eq',
        'hologram-prism',
        'fire-energy',
        'minimal-floating'
      ];

      const BANNER_STYLE_LABELS = {
        'kinetic-glass': '✨ Cartel: Cristal Dinámico 3D',
        'cyber-hud': '⚡ Cartel: Cyberpunk Broadcast HUD',
        'neon-capsule': '🌈 Cartel: Cápsula Plasma Neón',
        'royal-gold': '👑 Cartel: VIP Imperial 3D',
        'radio-eq': '🎚️ Cartel: Estudio Radio FM + EQ',
        'hologram-prism': '🔮 Cartel: Holograma Prisma 3D',
        'fire-energy': '🔥 Cartel: Fuego / Alta Energía',
        'minimal-floating': '🕊️ Cartel: Puro Texto Flotante Vivo'
      };

      const LETTER_ANIMS = ['wave', 'spring', 'typewriter', 'bounce', 'flip3d', 'pulse', 'glitch', 'none'];
      const LETTER_LABELS = {
        wave: '🌊 Letras: Ola Sinusoidal',
        spring: '🏀 Letras: Resorte Elástico',
        typewriter: '⌨️ Letras: Máquina de Escribir',
        bounce: '⚡ Letras: Caída con Rebote',
        flip3d: '🔄 Letras: Giro 3D por Letra',
        pulse: '💫 Letras: Pulso Láser',
        glitch: '👾 Letras: Cyber Glitch',
        none: '⏹️ Letras: Estático Limpio'
      };

      const TRANS_ANIMS = ['fade-blur', 'fade', 'slide-up', 'slide-lr', 'zoom-spring', 'flip-3d'];
      const TRANS_LABELS = {
        'fade-blur': '🌫️ Transición: Fade + Blur Cinemático',
        fade: '🌅 Transición: Fade In / Out Puro',
        'slide-up': '⬆️ Transición: Fade + Elevación',
        'slide-lr': '➡️ Transición: Barrido Lateral',
        'zoom-spring': '💥 Transición: Zoom Elástico',
        'flip-3d': '🎴 Transición: Giro 3D de Cartel'
      };

      const TEXT_EFFECTS = ['neon', 'shimmer', 'extrude3d', 'rgb', 'outline', 'clean'];
      const EFFECT_LABELS = {
        neon: '💡 Efecto: Resplandor Neón',
        shimmer: '✨ Efecto: Shimmer Metálico',
        extrude3d: '🕹️ Efecto: Texto 3D Extruido',
        rgb: '📺 Efecto: Cromático RGB Split',
        outline: '⭕ Efecto: Contorno Luminoso',
        clean: '🎯 Efecto: Sombra Nítida Limpia'
      };

      const THEMES = ['glass', 'transparent', 'cyber', 'aurora'];

      const FONT_MAP = {
        outfit: "'Outfit', system-ui, sans-serif",
        orbitron: "'Orbitron', 'Outfit', sans-serif",
        jakarta: "'Plus Jakarta Sans', 'Outfit', sans-serif",
        mono: "'JetBrains Mono', monospace"
      };

      const DEFAULT_ADS = [
        { icon: '🎧', text: 'ESCUCHA CON AUDÍFONOS 🎧', sub: 'PARA MEJOR CALIDAD • SONIDO HI-FI EN VIVO' },
        { icon: '🎵', text: 'PIDE TU CANCIÓN CON !zr', sub: 'ESCRIBE EN EL CHAT: !zr artista + canción' },
        { icon: '❤️', text: 'DALE TAP TAP A LA PANTALLA ❤️', sub: '¡APOYA EL STREAM CON TUS LIKES EN DIRECTO!' },
        { icon: '⭐', text: 'SÍGUENOS EN TIKTOK ⭐ ZERO FM', sub: 'MÚSICA EN VIVO Y PETICIONES TODOS LOS DÍAS' }
      ];

      const defaultConfig = {
        adsWidgetBannerStyle: 'kinetic-glass',
        adsWidgetLetterAnim: 'wave',
        adsWidgetTrans: 'fade-blur',
        adsWidgetTextEffect: 'neon',
        adsWidgetTheme: 'glass',
        adsWidgetFont: 'outfit',
        adsWidgetAlign: 'center',
        adsWidgetVPos: 'center',
        adsWidgetFontSize: 24,
        adsWidgetFadeIn: 0.8,
        adsWidgetFadeOut: 0.8,
        adsWidgetHold: 6.0,
        adsWidgetPause: 1.0,
        adsWidgetStaggerMs: 36,
        adsWidgetOpacity: 78,
        adsWidgetAccent: '#ff0055',
        adsWidgetAccentSec: '#00e5ff',
        adsWidgetShowIcon: true,
        adsWidgetShowSub: true,
        adsWidgetShowTimerBar: true,
        adsWidgetItems: DEFAULT_ADS
      };

      let currentConfig = { ...defaultConfig, adsWidgetItems: DEFAULT_ADS.map(x => ({ ...x })) };
      try {
        const saved = safeStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          currentConfig = { ...currentConfig, ...parsed };
          if (!Array.isArray(currentConfig.adsWidgetItems) || currentConfig.adsWidgetItems.length === 0) {
            currentConfig.adsWidgetItems = DEFAULT_ADS.map(x => ({ ...x }));
          }
        }
      } catch (_) {}

      // URL Overrides
      const uStyle = String(urlParams.get('style') || urlParams.get('bannerStyle') || '').trim().toLowerCase();
      if (BANNER_STYLES.includes(uStyle)) currentConfig.adsWidgetBannerStyle = uStyle;

      const uLetter = String(urlParams.get('letter') || urlParams.get('letterAnim') || '').trim().toLowerCase();
      if (LETTER_ANIMS.includes(uLetter)) currentConfig.adsWidgetLetterAnim = uLetter;

      const uTrans = String(urlParams.get('trans') || urlParams.get('fade') || '').trim().toLowerCase();
      if (TRANS_ANIMS.includes(uTrans)) currentConfig.adsWidgetTrans = uTrans;

      const uEffect = String(urlParams.get('effect') || '').trim().toLowerCase();
      if (TEXT_EFFECTS.includes(uEffect)) currentConfig.adsWidgetTextEffect = uEffect;

      const uTheme = String(urlParams.get('theme') || '').trim().toLowerCase();
      if (THEMES.includes(uTheme)) currentConfig.adsWidgetTheme = uTheme;

      if (urlParams.get('config') === '1') {
        document.body.classList.add('config-open');
        document.getElementById('settings-drawer')?.classList.add('open');
      }

      // ─── DOM References ───
      const stageEl = document.getElementById('widget-stage');
      const bannerEl = document.getElementById('ad-banner');
      const scaleWrapEl = document.getElementById('ad-scale-wrap');
      const bannerInnerEl = document.getElementById('ad-banner-inner');
      const iconPodEl = document.getElementById('ad-icon-pod');
      const iconEl = document.getElementById('ad-icon');
      const headlineEl = document.getElementById('ad-headline');
      const subtitleEl = document.getElementById('ad-subtitle');
      const timerBarEl = document.getElementById('ad-timer-bar');
      const timerFillEl = document.getElementById('ad-timer-fill');
      const editorEl = document.getElementById('ad-list-editor');
      const toastEl = document.getElementById('toast-pill');

      let toastTimer = null;
      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2300);
      }

      function hexToRgbTuple(hex, fallback = '255, 0, 85') {
        const clean = String(hex || '').replace('#', '').trim();
        if (clean.length !== 6) return fallback;
        const r = parseInt(clean.slice(0, 2), 16);
        const g = parseInt(clean.slice(2, 4), 16);
        const b = parseInt(clean.slice(4, 6), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return fallback;
        return `${r}, ${g}, ${b}`;
      }

      const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
        ? new Intl.Segmenter('es', { granularity: 'grapheme' })
        : null;

      function splitGraphemes(str) {
        const s = String(str || '');
        if (segmenter) {
          return Array.from(segmenter.segment(s), seg => seg.segment);
        }
        return Array.from(s);
      }

      function isEmojiGrapheme(g) {
        return /\p{Extended_Pictographic}/u.test(g);
      }

      // ─── Smart 2-Line Resolver (Garantiza siempre 2 líneas balanceadas) ───
      function resolveTwoLines(item) {
        let rawLine1 = String(item?.text || '').trim();
        let rawLine2 = String(item?.sub || '').trim();

        // Si un anuncio antiguo tiene una frase muy larga en text y además sub,
        // compactamos frases conocidas o si no hay sub dividimos a la mitad en 2 líneas:
        if (!rawLine2 && rawLine1.length > 24) {
          const words = rawLine1.split(/\s+/);
          if (words.length >= 4) {
            const half = Math.ceil(words.length / 2);
            rawLine1 = words.slice(0, half).join(' ');
            rawLine2 = words.slice(half).join(' ');
          }
        } else if (rawLine1.length > 34 && rawLine2) {
          // Si text es muy largo (ej. los defaults anteriores de 45-52 chars), balancear
          const upper = rawLine1.toUpperCase();
          if (upper.includes('AUDÍFONOS') && upper.includes('PARA MEJOR CALIDAD')) {
            rawLine1 = 'ESCUCHA CON AUDÍFONOS 🎧';
            rawLine2 = 'PARA MEJOR CALIDAD • ' + rawLine2;
          } else if (upper.includes('TAP TAP A LA PANTALLA') && upper.includes('PARA APOYAR')) {
            rawLine1 = 'DALE TAP TAP A LA PANTALLA ❤️';
            rawLine2 = 'PARA APOYAR EL STREAM • ' + rawLine2;
          } else if (upper.includes('SÍGUENOS EN TIKTOK') && upper.includes('PARA NO PERDERTE')) {
            rawLine1 = 'SÍGUENOS EN TIKTOK ⭐ ZERO FM';
            rawLine2 = 'NO TE PIERDAS LOS DIRECTOS EN VIVO';
          }
        }

        if (!rawLine2) {
          rawLine2 = 'ZERO FM • EN DIRECTO';
        }

        return { line1: rawLine1, line2: rawLine2 };
      }

      // ─── Auto-Fit Scale so the 2-line cartel never overflows or wraps ───
      function fitBannerToStage() {
        if (!stageEl || !bannerInnerEl || !scaleWrapEl) return;
        const root = document.documentElement;
        root.style.setProperty('--fit-scale', '1');
        const availW = Math.max(240, stageEl.clientWidth - 28);
        const naturalW = bannerInnerEl.scrollWidth || bannerInnerEl.offsetWidth || 1;
        if (naturalW > availW) {
          const ratio = Math.max(0.52, Math.min(1, availW / naturalW));
          root.style.setProperty('--fit-scale', ratio.toFixed(3));
        }
      }

      window.addEventListener('resize', fitBannerToStage);

      // ─── Render Line 1 (Animated Letters) ───
      function populateHeadlineLetters(text) {
        headlineEl.innerHTML = '';
        const words = String(text || '').trim().split(/\s+/).filter(Boolean);
        let globalCharIndex = 0;

        words.forEach((word) => {
          const wordSpan = document.createElement('span');
          const isCmd = word.startsWith('!') || (word.startsWith('[') && word.endsWith(']'));
          const cleanWord = (word.startsWith('[') && word.endsWith(']')) ? word.slice(1, -1) : word;
          wordSpan.className = `ad-word${isCmd ? ' is-command' : ''}`;

          const graphemes = splitGraphemes(cleanWord);
          graphemes.forEach((ch) => {
            globalCharIndex++;
            const charSpan = document.createElement('span');
            const isEmoji = isEmojiGrapheme(ch);
            charSpan.className = `ad-char ${isEmoji ? 'is-emoji' : 'is-alpha'}`;
            charSpan.textContent = ch;
            if (!supportsSiblingIndex) {
              charSpan.style.setProperty('--sibling-index', String(globalCharIndex));
            }
            wordSpan.appendChild(charSpan);
          });

          headlineEl.appendChild(wordSpan);
        });
      }

      // ─── Render Line 2 (Animated Subtitle Words + Live Badge + Command Highlights) ───
      function populateSubtitleWords(subText) {
        subtitleEl.innerHTML = '';
        const liveTag = document.createElement('span');
        liveTag.className = 'ad-live-tag';
        liveTag.innerHTML = '<span class="ad-live-dot"></span>LIVE';
        subtitleEl.appendChild(liveTag);

        const words = String(subText || '').trim().split(/\s+/).filter(Boolean);
        words.forEach((word, idx) => {
          const wSpan = document.createElement('span');
          const isCmd = word.startsWith('!') || (word.startsWith('[') && word.endsWith(']'));
          const cleanWord = (word.startsWith('[') && word.endsWith(']')) ? word.slice(1, -1) : word;
          wSpan.className = `ad-sub-word ad-word${isCmd ? ' is-command' : ''}`;
          wSpan.style.setProperty('--sub-idx', String(idx));
          wSpan.textContent = cleanWord;
          subtitleEl.appendChild(wSpan);
        });
      }

      // ─── Cycle Engine: Fade In -> Hold -> Fade Out -> Pause ───
      let currentAdIndex = 0;
      let cycleTimer = null;

      function renderCurrentAnnouncement(restartPhase = true) {
        const items = Array.isArray(currentConfig.adsWidgetItems) && currentConfig.adsWidgetItems.length > 0
          ? currentConfig.adsWidgetItems
          : DEFAULT_ADS;

        if (currentAdIndex >= items.length) currentAdIndex = 0;
        const item = items[currentAdIndex] || DEFAULT_ADS[0];

        // Icon Pod
        const showIcon = currentConfig.adsWidgetShowIcon !== false && Boolean(item.icon);
        iconEl.textContent = item.icon || '🎧';
        if (iconPodEl) {
          iconPodEl.hidden = !showIcon;
          iconPodEl.classList.toggle('is-hidden', !showIcon);
        }

        // Resolve strict 2 lines
        const { line1, line2 } = resolveTwoLines(item);
        populateHeadlineLetters(line1);

        const showSub = currentConfig.adsWidgetShowSub !== false;
        populateSubtitleWords(line2);
        subtitleEl.hidden = !showSub;
        subtitleEl.classList.toggle('is-hidden', !showSub);

        requestAnimationFrame(fitBannerToStage);

        if (restartPhase) {
          startCycleForCurrentAd();
        }
      }

      function startCycleForCurrentAd() {
        if (cycleTimer) clearTimeout(cycleTimer);

        const fadeInMs = Math.max(150, (Number(currentConfig.adsWidgetFadeIn) || 0.8) * 1000);
        const holdMs = Math.max(1000, (Number(currentConfig.adsWidgetHold) || 6.0) * 1000);
        const fadeOutMs = Math.max(150, (Number(currentConfig.adsWidgetFadeOut) || 0.8) * 1000);
        const pauseMs = Math.max(0, (Number(currentConfig.adsWidgetPause) ?? 1.0) * 1000);

        bannerEl.classList.remove('phase-out', 'is-Paused-Hidden');
        bannerEl.classList.remove('phase-in');
        void bannerEl.offsetWidth;
        bannerEl.classList.add('phase-in');

        if (timerFillEl) {
          timerFillEl.style.transition = 'none';
          timerFillEl.style.transform = 'scaleX(1)';
          void timerFillEl.offsetWidth;
          timerFillEl.style.transition = `transform ${fadeInMs + holdMs}ms linear`;
          timerFillEl.style.transform = 'scaleX(0)';
        }

        cycleTimer = setTimeout(() => {
          bannerEl.classList.remove('phase-in');
          bannerEl.classList.add('phase-out');

          cycleTimer = setTimeout(() => {
            if (pauseMs > 0) {
              bannerEl.classList.add('is-Paused-Hidden');
            }
            cycleTimer = setTimeout(() => {
              const items = Array.isArray(currentConfig.adsWidgetItems) && currentConfig.adsWidgetItems.length > 0
                ? currentConfig.adsWidgetItems
                : DEFAULT_ADS;
              currentAdIndex = (currentAdIndex + 1) % items.length;
              renderCurrentAnnouncement(true);
            }, pauseMs);
          }, fadeOutMs);
        }, fadeInMs + holdMs);
      }

      function nextAnnouncementNow() {
        const items = Array.isArray(currentConfig.adsWidgetItems) && currentConfig.adsWidgetItems.length > 0
          ? currentConfig.adsWidgetItems
          : DEFAULT_ADS;
        currentAdIndex = (currentAdIndex + 1) % items.length;
        renderCurrentAnnouncement(true);
      }

      // ─── Apply Visual Config ───
      function applyConfig(nextCfg = {}, restartAnim = false) {
        // Si cambia adsWidgetTheme legado y no viene adsWidgetBannerStyle, sincronizar
        if (nextCfg.adsWidgetTheme && !nextCfg.adsWidgetBannerStyle) {
          const themeToStyle = {
            glass: 'kinetic-glass',
            cyber: 'cyber-hud',
            aurora: 'neon-capsule',
            transparent: 'minimal-floating'
          };
          if (themeToStyle[nextCfg.adsWidgetTheme]) {
            nextCfg.adsWidgetBannerStyle = themeToStyle[nextCfg.adsWidgetTheme];
          }
        }

        currentConfig = { ...currentConfig, ...nextCfg };
        if (!Array.isArray(currentConfig.adsWidgetItems) || currentConfig.adsWidgetItems.length === 0) {
          currentConfig.adsWidgetItems = DEFAULT_ADS.map(x => ({ ...x }));
        }

        const bannerStyle = BANNER_STYLES.includes(currentConfig.adsWidgetBannerStyle)
          ? currentConfig.adsWidgetBannerStyle
          : 'kinetic-glass';
        const letterAnim = LETTER_ANIMS.includes(currentConfig.adsWidgetLetterAnim)
          ? currentConfig.adsWidgetLetterAnim
          : 'wave';
        const trans = TRANS_ANIMS.includes(currentConfig.adsWidgetTrans)
          ? currentConfig.adsWidgetTrans
          : 'fade-blur';
        const effect = TEXT_EFFECTS.includes(currentConfig.adsWidgetTextEffect)
          ? currentConfig.adsWidgetTextEffect
          : 'neon';
        const theme = bannerStyle === 'minimal-floating'
          ? 'transparent'
          : (THEMES.includes(currentConfig.adsWidgetTheme) ? currentConfig.adsWidgetTheme : 'glass');

        stageEl.setAttribute('data-banner-style', bannerStyle);
        stageEl.setAttribute('data-letter-anim', letterAnim);
        stageEl.setAttribute('data-trans', trans);
        stageEl.setAttribute('data-text-effect', effect);
        stageEl.setAttribute('data-theme', theme);
        stageEl.setAttribute('data-align', currentConfig.adsWidgetAlign || 'center');
        stageEl.setAttribute('data-vpos', currentConfig.adsWidgetVPos || 'center');

        const root = document.documentElement;
        const fontKey = currentConfig.adsWidgetFont || 'outfit';
        root.style.setProperty('--font-active', FONT_MAP[fontKey] || FONT_MAP.outfit);

        const fontPx = Math.max(14, Math.min(64, Number(currentConfig.adsWidgetFontSize) || 24));
        root.style.setProperty('--ad-font-size', `${(fontPx / 16).toFixed(3)}rem`);
        root.style.setProperty('--ad-sub-size', `${(Math.max(12, Math.round(fontPx * 0.56)) / 16).toFixed(3)}rem`);

        const fadeIn = Math.max(0.15, Math.min(5, Number(currentConfig.adsWidgetFadeIn) || 0.8));
        const fadeOut = Math.max(0.15, Math.min(5, Number(currentConfig.adsWidgetFadeOut) || 0.8));
        root.style.setProperty('--fade-in-dur', `${fadeIn}s`);
        root.style.setProperty('--fade-out-dur', `${fadeOut}s`);

        const staggerMs = Math.max(8, Math.min(150, Number(currentConfig.adsWidgetStaggerMs) || 36));
        root.style.setProperty('--stagger-step', `${(staggerMs / 1000).toFixed(3)}s`);

        const opRaw = Number(currentConfig.adsWidgetOpacity);
        const opNorm = Number.isFinite(opRaw) ? (opRaw > 1 ? opRaw / 100 : opRaw) : 0.78;
        root.style.setProperty('--card-opacity', String(Math.max(0, Math.min(0.98, opNorm))));

        const accent = currentConfig.adsWidgetAccent || '#ff0055';
        const accentSec = currentConfig.adsWidgetAccentSec || '#00e5ff';
        root.style.setProperty('--accent-primary', accent);
        root.style.setProperty('--accent-secondary', accentSec);
        root.style.setProperty('--accent-rgb', hexToRgbTuple(accent, '255, 0, 85'));
        root.style.setProperty('--accent-sec-rgb', hexToRgbTuple(accentSec, '0, 229, 255'));

        const showTimer = currentConfig.adsWidgetShowTimerBar !== false && bannerStyle !== 'minimal-floating';
        if (timerBarEl) {
          timerBarEl.hidden = !showTimer;
          timerBarEl.classList.toggle('is-hidden', !showTimer);
        }

        syncDrawerControls();
        renderCurrentAnnouncement(restartAnim);
      }

      // ─── Drawer Controls & 2-Line Announcements List Editor ───
      function renderAdsEditorList() {
        if (!editorEl) return;
        editorEl.innerHTML = '';
        const items = currentConfig.adsWidgetItems || [];
        items.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'ad-item-row';

          const iconInp = document.createElement('input');
          iconInp.type = 'text';
          iconInp.value = item.icon || '🎧';
          iconInp.title = 'Emoticón / Ícono';
          iconInp.style.textAlign = 'center';
          iconInp.addEventListener('input', () => {
            currentConfig.adsWidgetItems[idx].icon = iconInp.value;
            renderCurrentAnnouncement(false);
          });

          const linesWrap = document.createElement('div');
          linesWrap.className = 'ad-item-lines';

          const textInp = document.createElement('input');
          textInp.type = 'text';
          textInp.value = item.text || '';
          textInp.placeholder = 'Línea 1 (Título principal)...';
          textInp.addEventListener('input', () => {
            currentConfig.adsWidgetItems[idx].text = textInp.value;
            if (currentAdIndex === idx) renderCurrentAnnouncement(false);
          });

          const subInp = document.createElement('input');
          subInp.type = 'text';
          subInp.value = item.sub || '';
          subInp.placeholder = 'Línea 2 (Subtítulo / comando !zr)...';
          subInp.addEventListener('input', () => {
            currentConfig.adsWidgetItems[idx].sub = subInp.value;
            if (currentAdIndex === idx) renderCurrentAnnouncement(false);
          });

          linesWrap.appendChild(textInp);
          linesWrap.appendChild(subInp);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn-del-ad';
          delBtn.textContent = '✕';
          delBtn.title = 'Eliminar anuncio';
          delBtn.addEventListener('click', () => {
            if (currentConfig.adsWidgetItems.length <= 1) {
              showToast('⚠️ Debe haber al menos 1 anuncio');
              return;
            }
            currentConfig.adsWidgetItems.splice(idx, 1);
            if (currentAdIndex >= currentConfig.adsWidgetItems.length) currentAdIndex = 0;
            renderAdsEditorList();
            renderCurrentAnnouncement(true);
          });

          row.appendChild(iconInp);
          row.appendChild(linesWrap);
          row.appendChild(delBtn);
          editorEl.appendChild(row);
        });
      }

      function syncDrawerControls() {
        const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = String(v); };
        const setLbl = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };

        setVal('cfg-bannerStyle', currentConfig.adsWidgetBannerStyle || 'kinetic-glass');
        setVal('cfg-letterAnim', currentConfig.adsWidgetLetterAnim || 'wave');
        setVal('cfg-trans', currentConfig.adsWidgetTrans || 'fade-blur');
        setVal('cfg-textEffect', currentConfig.adsWidgetTextEffect || 'neon');
        setVal('cfg-font', currentConfig.adsWidgetFont || 'outfit');

        const fi = Number(currentConfig.adsWidgetFadeIn) || 0.8;
        setVal('cfg-fadeIn', fi);
        setLbl('val-fadeIn', `${fi.toFixed(1)}s`);

        const fo = Number(currentConfig.adsWidgetFadeOut) || 0.8;
        setVal('cfg-fadeOut', fo);
        setLbl('val-fadeOut', `${fo.toFixed(1)}s`);

        const hd = Number(currentConfig.adsWidgetHold) || 6.0;
        setVal('cfg-hold', hd);
        setLbl('val-hold', `${hd.toFixed(1)}s`);

        const ps = Number(currentConfig.adsWidgetPause ?? 1.0);
        setVal('cfg-pause', ps);
        setLbl('val-pause', `${ps.toFixed(1)}s`);

        const fs = Number(currentConfig.adsWidgetFontSize) || 24;
        setVal('cfg-fontSize', fs);
        setLbl('val-fontSize', `${fs}px`);

        const op = Number(currentConfig.adsWidgetOpacity);
        const opPct = Math.round(Number.isFinite(op) ? (op <= 1 && op > 0 ? op * 100 : op) : 78);
        setVal('cfg-opacity', opPct);
        setLbl('val-opacity', `${opPct}%`);

        setVal('cfg-accent', currentConfig.adsWidgetAccent || '#ff0055');
        setVal('cfg-accentSec', currentConfig.adsWidgetAccentSec || '#00e5ff');
      }

      function readConfigFromDrawer() {
        return {
          adsWidgetBannerStyle: document.getElementById('cfg-bannerStyle').value,
          adsWidgetLetterAnim: document.getElementById('cfg-letterAnim').value,
          adsWidgetTrans: document.getElementById('cfg-trans').value,
          adsWidgetTextEffect: document.getElementById('cfg-textEffect').value,
          adsWidgetFont: document.getElementById('cfg-font').value,
          adsWidgetFadeIn: Number(document.getElementById('cfg-fadeIn').value) || 0.8,
          adsWidgetFadeOut: Number(document.getElementById('cfg-fadeOut').value) || 0.8,
          adsWidgetHold: Number(document.getElementById('cfg-hold').value) || 6.0,
          adsWidgetPause: Number(document.getElementById('cfg-pause').value) || 0,
          adsWidgetFontSize: Number(document.getElementById('cfg-fontSize').value) || 24,
          adsWidgetOpacity: Number(document.getElementById('cfg-opacity').value),
          adsWidgetAccent: document.getElementById('cfg-accent').value,
          adsWidgetAccentSec: document.getElementById('cfg-accentSec').value,
          adsWidgetItems: currentConfig.adsWidgetItems
        };
      }

      // ─── UI Event Listeners ───
      document.getElementById('btn-cycle-style').addEventListener('click', () => {
        const idx = BANNER_STYLES.indexOf(currentConfig.adsWidgetBannerStyle || 'kinetic-glass');
        const next = BANNER_STYLES[(idx + 1) % BANNER_STYLES.length];
        applyConfig({ adsWidgetBannerStyle: next }, false);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(BANNER_STYLE_LABELS[next]);
      });

      document.getElementById('btn-cycle-letter').addEventListener('click', () => {
        const idx = LETTER_ANIMS.indexOf(currentConfig.adsWidgetLetterAnim || 'wave');
        const next = LETTER_ANIMS[(idx + 1) % LETTER_ANIMS.length];
        applyConfig({ adsWidgetLetterAnim: next }, true);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(LETTER_LABELS[next]);
      });

      document.getElementById('btn-cycle-trans').addEventListener('click', () => {
        const idx = TRANS_ANIMS.indexOf(currentConfig.adsWidgetTrans || 'fade-blur');
        const next = TRANS_ANIMS[(idx + 1) % TRANS_ANIMS.length];
        applyConfig({ adsWidgetTrans: next }, true);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(TRANS_LABELS[next]);
      });

      document.getElementById('btn-cycle-effect').addEventListener('click', () => {
        const idx = TEXT_EFFECTS.indexOf(currentConfig.adsWidgetTextEffect || 'neon');
        const next = TEXT_EFFECTS[(idx + 1) % TEXT_EFFECTS.length];
        applyConfig({ adsWidgetTextEffect: next }, false);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        showToast(EFFECT_LABELS[next]);
      });

      document.getElementById('btn-next-ad').addEventListener('click', () => {
        nextAnnouncementNow();
      });

      const drawerEl = document.getElementById('settings-drawer');
      document.getElementById('btn-settings').addEventListener('click', () => {
        renderAdsEditorList();
        drawerEl.classList.toggle('open');
        document.body.classList.toggle('config-open', drawerEl.classList.contains('open'));
      });

      document.getElementById('btn-close-settings').addEventListener('click', () => {
        drawerEl.classList.remove('open');
        document.body.classList.remove('config-open');
      });

      document.getElementById('btn-add-ad').addEventListener('click', () => {
        currentConfig.adsWidgetItems.push({
          icon: '🔥',
          text: 'NUEVO ANUNCIO EN DIRECTO 🔥',
          sub: 'PIDE TU CANCIÓN CON !zr artista + canción'
        });
        renderAdsEditorList();
        currentAdIndex = currentConfig.adsWidgetItems.length - 1;
        renderCurrentAnnouncement(true);
      });

      [
        'cfg-bannerStyle', 'cfg-letterAnim', 'cfg-trans', 'cfg-textEffect', 'cfg-font',
        'cfg-fadeIn', 'cfg-fadeOut', 'cfg-hold', 'cfg-pause',
        'cfg-fontSize', 'cfg-opacity', 'cfg-accent', 'cfg-accentSec'
      ].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        const isTimingOrAnim = ['cfg-letterAnim', 'cfg-trans', 'cfg-fadeIn', 'cfg-fadeOut', 'cfg-hold', 'cfg-pause'].includes(id);
        el.addEventListener('input', () => applyConfig(readConfigFromDrawer(), isTimingOrAnim));
        el.addEventListener('change', () => applyConfig(readConfigFromDrawer(), isTimingOrAnim));
      });

      // ─── Firebase Real-Time Sync ───
      let db = null;
      function initFirebase() {
        try {
          if (typeof firebase === 'undefined') return;
          if (!firebase.apps.length) {
            const cfg = window.ZERO_FM_FIREBASE || window.firebaseConfig;
            if (cfg) firebase.initializeApp(cfg);
          }
          db = firebase.firestore();
          try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (_) {}
        } catch (_) {}
        if (!db) return;

        db.collection('systemConfig').doc('overlayAlertsConfig').onSnapshot((doc) => {
          if (!doc.exists) return;
          const data = doc.data() || {};
          const relevant = {};
          Object.keys(defaultConfig).forEach((k) => {
            if (data[k] !== undefined) relevant[k] = data[k];
          });
          if (BANNER_STYLES.includes(uStyle)) relevant.adsWidgetBannerStyle = uStyle;
          if (LETTER_ANIMS.includes(uLetter)) relevant.adsWidgetLetterAnim = uLetter;
          if (TRANS_ANIMS.includes(uTrans)) relevant.adsWidgetTrans = uTrans;
          if (TEXT_EFFECTS.includes(uEffect)) relevant.adsWidgetTextEffect = uEffect;
          if (THEMES.includes(uTheme)) relevant.adsWidgetTheme = uTheme;
          if (Object.keys(relevant).length > 0) {
            applyConfig(relevant, false);
            renderAdsEditorList();
          }
        }, () => {});
      }

      document.getElementById('btn-save-cfg').addEventListener('click', async () => {
        const nextCfg = readConfigFromDrawer();
        applyConfig(nextCfg, true);
        safeStorage.setItem(STORAGE_KEY, JSON.stringify(currentConfig));
        if (db) {
          try {
            await db.collection('systemConfig').doc('overlayAlertsConfig').set(nextCfg, { merge: true });
          } catch (_) {}
        }
        drawerEl.classList.remove('open');
        document.body.classList.remove('config-open');
        showToast('✅ Estilo de cartel y anuncios guardados');
      });

      document.getElementById('btn-reset-cfg').addEventListener('click', () => {
        safeStorage.removeItem(STORAGE_KEY);
        currentConfig = { ...defaultConfig, adsWidgetItems: DEFAULT_ADS.map(x => ({ ...x })) };
        applyConfig(currentConfig, true);
        renderAdsEditorList();
        showToast('↺ Anuncios restablecidos');
      });

      // Live Dashboard postMessage Receiver
      window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.action === 'nextAnnouncement' || event.data.action === 'simulateAnnouncement') {
          nextAnnouncementNow();
        } else if ((event.data.action === 'updateConfig' || event.data.action === 'updateLiveConfig') && (event.data.payload || event.data.config)) {
          const payload = event.data.payload || event.data.config;
          const mapped = {};
          Object.keys(defaultConfig).forEach((k) => {
            if (payload[k] !== undefined) mapped[k] = payload[k];
          });
          if (Object.keys(mapped).length > 0) {
            applyConfig(mapped, true);
            renderAdsEditorList();
          }
        }
      });

      // ─── Bootstrap ───
      renderAdsEditorList();
      applyConfig(currentConfig, true);
      initFirebase();
    })();
  </script>
</body>
</html>
