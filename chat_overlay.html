<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Chat en Vivo – Zero FM</title>

  <!-- Google Fonts: Outfit & Orbitron for Synthwave -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-dark: #070710;
      --card-bg: rgba(14, 13, 26, 0.88);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-radius: 12px;
      --text-color: #ffffff;
      --text-muted: #8b8ba7;
      --font-size: 14px;
      
      /* Colors */
      --color-primary: #ff0050;
      --color-accent: #7c3aed;
      --color-streamer: #ff0050;
      --color-mod: #3b82f6;
      --color-sub: #06b6d4;
      --color-vip: #a855f7;
      --color-superfan: #f59e0b;
      --color-donador: #ec4899;
      --color-fan: #10b981;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font);
      font-size: var(--font-size);
      color: var(--text-color);
      overflow: hidden;
      background: transparent;
    }

    /* ─── Window Mode Styles ─── */
    body.mode-window {
      background: radial-gradient(circle at 10% 20%, #120f24 0%, #06060d 90%);
      display: flex;
      flex-direction: column;
    }

    /* Window Header / Toolbar */
    .window-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(18, 16, 32, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
    }

    body.mode-window .window-header {
      display: flex;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #fff 40%, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 1.5s infinite alternate;
    }

    .status-badge.offline .status-dot {
      background: #f87171;
      box-shadow: none;
      animation: none;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tool-btn {
      appearance: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #c4c4e0;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tool-btn.active {
      background: linear-gradient(135deg, rgba(255, 0, 80, 0.25), rgba(124, 58, 237, 0.25));
      border-color: rgba(255, 0, 80, 0.5);
      color: #fff;
    }

    .tool-select {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    .tool-select option {
      background: #120f24;
      color: #fff;
    }

    /* Search & Filter Bar in Window mode */
    .filter-bar {
      display: none;
      padding: 6px 12px;
      background: rgba(10, 8, 20, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      gap: 8px;
      align-items: center;
    }

    body.mode-window .filter-bar {
      display: flex;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px 10px;
      color: #fff;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
    }
    .search-input:focus {
      border-color: #7c3aed;
    }

    /* ─── Chat Feed Container ─── */
    .chat-container {
      width: 100%;
      height: 100%;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
      position: relative;
    }

    /* Custom Scrollbar */
    .chat-container::-webkit-scrollbar {
      width: 6px;
    }
    .chat-container::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
    }
    .chat-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Transparent in overlay mode */
    body.mode-overlay .chat-container::-webkit-scrollbar {
      display: none;
    }

    /* ─── Message Cards ─── */
    .chat-msg {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      animation: msgSlideIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      word-break: break-word;
      transition: opacity 0.4s ease, transform 0.4s ease;
      flex-shrink: 0;
      position: relative;
    }

    /* Highlight special users */
    .chat-msg.is-streamer {
      border-color: rgba(255, 0, 80, 0.4);
      background: linear-gradient(135deg, rgba(255, 0, 80, 0.15), rgba(124, 58, 237, 0.12));
    }
    .chat-msg.is-vip {
      border-color: rgba(168, 85, 247, 0.35);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.12), var(--card-bg));
    }
    .chat-msg.is-sub {
      border-color: rgba(6, 182, 212, 0.35);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), var(--card-bg));
    }
    .chat-msg.is-mod {
      border-color: rgba(59, 130, 246, 0.35);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), var(--card-bg));
    }
    .chat-msg.is-superfan {
      border-color: rgba(245, 158, 11, 0.35);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), var(--card-bg));
    }
    .chat-msg.is-donador {
      border-color: rgba(236, 72, 153, 0.35);
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.12), var(--card-bg));
    }

    .chat-msg.fade-out {
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      pointer-events: none;
    }

    @keyframes msgSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Avatar */
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      margin-top: 1px;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Content */
    .msg-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1.2;
    }

    .msg-name {
      font-weight: 700;
      font-size: 0.86rem;
      color: #f1f1f9;
      cursor: pointer;
    }

    .msg-name:hover {
      text-decoration: underline;
    }

    .msg-user {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .msg-time {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.3);
      margin-left: auto;
      font-family: monospace;
    }

    /* Badges */
    .msg-badges {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.64rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge-streamer {
      background: linear-gradient(135deg, #ff0050, #e11d48);
      color: #fff;
      box-shadow: 0 0 8px rgba(255, 0, 80, 0.4);
    }
    .badge-mod {
      background: #2563eb;
      color: #fff;
    }
    .badge-sub {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      color: #fff;
    }
    .badge-vip {
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: #fff;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
    }
    .badge-superfan {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
    }
    .badge-donador {
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: #fff;
    }

    .msg-text {
      font-size: 0.92rem;
      color: #e5e5f5;
      line-height: 1.35;
      margin-top: 2px;
    }

    .msg-text .highlight-cmd {
      color: #38bdf8;
      font-weight: 700;
    }

    .msg-text .highlight-mention {
      color: #f472b6;
      font-weight: 600;
    }

    /* ─── Scroll to Bottom Floating Button ─── */
    .scroll-bottom-pill {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: linear-gradient(135deg, #ff0050, #7c3aed);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 12px rgba(255, 0, 80, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }

    .scroll-bottom-pill.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* ─── Empty state ─── */
    .empty-state {
      margin: auto;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-state .icon {
      font-size: 2.2rem;
      opacity: 0.7;
    }

    /* ─── 8 DIVERSE VISUAL THEMES ─── */

    /* 1. Cyberpunk / Zero FM */
    body.theme-cyber .chat-msg {
      background: rgba(14, 13, 26, 0.88);
      border: 1px solid rgba(236, 72, 153, 0.35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(236, 72, 153, 0.15);
    }

    /* 2. Neón Violeta */
    body.theme-neon .chat-msg {
      background: rgba(18, 10, 36, 0.92);
      border: 1.5px solid #8b5cf6;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.35), inset 0 0 10px rgba(139, 92, 246, 0.1);
    }
    body.theme-neon .msg-name {
      color: #c084fc;
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.4);
    }

    /* 3. Glassmorphism */
    body.theme-glass .chat-msg {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* 4. Retro Synthwave / 80s */
    body.theme-synthwave .chat-msg {
      background: linear-gradient(135deg, rgba(255, 42, 109, 0.18), rgba(5, 217, 232, 0.18));
      border: 1.5px solid rgba(255, 42, 109, 0.6);
      box-shadow: 0 0 18px rgba(255, 42, 109, 0.35), 0 0 8px rgba(5, 217, 232, 0.25);
    }
    body.theme-synthwave .msg-name {
      font-family: 'Orbitron', sans-serif;
      color: #05d9e8 !important;
      text-shadow: 0 0 8px rgba(5, 217, 232, 0.6);
    }
    body.theme-synthwave .msg-text .highlight-cmd {
      color: #ff2a6d !important;
      font-weight: bold;
    }

    /* 5. Dark Minimal / OLED */
    body.theme-minimal .chat-msg {
      background: rgba(10, 10, 12, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: none;
      border-radius: 8px;
    }

    /* 6. Kawaii Pastel */
    body.theme-kawaii .chat-msg {
      background: linear-gradient(135deg, rgba(255, 182, 193, 0.22), rgba(221, 160, 221, 0.22));
      border: 1.5px solid rgba(255, 182, 193, 0.6);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(255, 182, 193, 0.25);
    }
    body.theme-kawaii .msg-name {
      color: #fda4af !important;
    }
    body.theme-kawaii .msg-text {
      color: #fff1f2 !important;
    }

    /* 7. Gamer Twitch */
    body.theme-gamer .chat-msg {
      background: rgba(24, 24, 27, 0.95);
      border-left: 4px solid #9146ff;
      border-top: 1px solid rgba(145, 70, 255, 0.25);
      border-right: 1px solid rgba(145, 70, 255, 0.25);
      border-bottom: 1px solid rgba(145, 70, 255, 0.25);
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    body.theme-gamer .msg-name {
      color: #a970ff;
    }

    /* 8. TikTok Live Red */
    body.theme-tiktok .chat-msg {
      background: rgba(18, 18, 18, 0.92);
      border: 1px solid rgba(254, 44, 85, 0.35);
      box-shadow: 0 0 14px rgba(254, 44, 85, 0.25), 0 0 10px rgba(37, 244, 238, 0.15);
    }
    body.theme-tiktok .highlight-cmd {
      color: #25f4ee !important;
    }

    /* ─── Hide elements by config ─── */
    body.hide-avatars .msg-avatar { display: none !important; }
    body.hide-badges .msg-badges { display: none !important; }
  </style>
</head>
<body class="mode-overlay">

  <!-- Window Header (visible only in mode-window) -->
  <header class="window-header">
    <div class="header-left">
      <span class="header-title">💬 Live Chat</span>
      <div id="status-badge" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Conectado</span>
      </div>
      <span id="msg-counter" style="font-size: 0.72rem; color: #8b8ba7; font-family: monospace;">0 msgs</span>
    </div>

    <div class="header-controls">
      <!-- Quick Theme Switcher -->
      <select id="theme-selector" class="tool-select" title="Cambiar tema visual">
        <option value="cyber">⚡ Cyberpunk</option>
        <option value="neon">🔮 Neón Violeta</option>
        <option value="glass">🪟 Cristal Glass</option>
        <option value="synthwave">🌌 Retro 80s</option>
        <option value="minimal">🖤 Minimalista</option>
        <option value="kawaii">🌸 Kawaii</option>
        <option value="gamer">🎮 Gamer Twitch</option>
        <option value="tiktok">🔴 TikTok Live</option>
      </select>

      <button type="button" id="btn-toggle-autoscroll" class="tool-btn active" title="Bloquear / Seguir scroll">
        🔒 Auto
      </button>
      <button type="button" id="btn-toggle-cmd-filter" class="tool-btn" title="Ocultar comandos (!)">
        🚫 Comandos
      </button>
      <button type="button" id="btn-zoom-in" class="tool-btn" title="Aumentar letra">A+</button>
      <button type="button" id="btn-zoom-out" class="tool-btn" title="Reducir letra">A-</button>
      <button type="button" id="btn-pip" class="tool-btn" style="color: #38bdf8; border-color: rgba(56, 189, 248, 0.4);" title="Flotar fuera de la ventana sobre todas las apps">📌 PiP Flotante</button>
      <button type="button" id="btn-test" class="tool-btn" title="Simular mensaje">🧪 Test</button>
      <button type="button" id="btn-clear" class="tool-btn" title="Limpiar historial">🗑️</button>
    </div>
  </header>

  <!-- Filter bar (Window mode) -->
  <div class="filter-bar">
    <input type="text" id="chat-search" class="search-input" placeholder="🔍 Buscar mensajes o @usuario..." />
  </div>

  <!-- Main Chat Feed Container -->
  <main id="chat-container" class="chat-container">
    <div id="empty-state" class="empty-state">
      <div class="icon">💬</div>
      <div style="font-weight: 600; font-size: 0.95rem;">Esperando mensajes del Live...</div>
      <div style="font-size: 0.8rem; opacity: 0.7;">Los comentarios de TikTok aparecerán aquí en tiempo real.</div>
    </div>
  </main>

  <!-- Scroll to Bottom Button -->
  <button id="scroll-bottom-btn" class="scroll-bottom-pill">
    ⬇️ Nuevos mensajes
  </button>

  <script>
    (function () {
      // ── Parse URL Parameters ──
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode') || (window.opener ? 'window' : 'overlay'); // 'overlay' | 'window'
      let theme = params.get('theme') || 'cyber';
      let fontSize = parseInt(params.get('fontSize') || '14', 10);
      let autoHideSec = parseInt(params.get('autoHide') || '0', 10);
      let hideAvatars = params.get('avatars') === 'false';
      let hideBadges = params.get('badges') === 'false';
      let filterCmds = params.get('filterCmds') === 'true';

      // Set body classes
      document.body.classList.remove('mode-overlay', 'mode-window');
      document.body.classList.add(`mode-${mode}`);
      applyTheme(theme);
      if (hideAvatars) document.body.classList.add('hide-avatars');
      if (hideBadges) document.body.classList.add('hide-badges');
      if (fontSize) document.documentElement.style.setProperty('--font-size', `${fontSize}px`);

      // ── Elements ──
      const container = document.getElementById('chat-container');
      const emptyState = document.getElementById('empty-state');
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const msgCounter = document.getElementById('msg-counter');
      const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
      const searchInput = document.getElementById('chat-search');
      const themeSelector = document.getElementById('theme-selector');
      const btnToggleAutoScroll = document.getElementById('btn-toggle-autoscroll');
      const btnToggleCmdFilter = document.getElementById('btn-toggle-cmd-filter');
      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');
      const btnPip = document.getElementById('btn-pip');
      const btnTest = document.getElementById('btn-test');
      const btnClear = document.getElementById('btn-clear');

      // ── State ──
      let autoScroll = true;
      let hideCommands = filterCmds;
      let searchQuery = '';
      let messages = [];
      let totalReceived = 0;
      let eventSource = null;
      let currentFontSize = fontSize || 14;

      if (themeSelector) {
        themeSelector.value = theme;
      }

      if (btnToggleCmdFilter && hideCommands) {
        btnToggleCmdFilter.classList.add('active');
      }

      function applyTheme(t) {
        theme = t || 'cyber';
        document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();
        document.body.classList.add(`theme-${theme}`);
        if (themeSelector) themeSelector.value = theme;
      }

      // ── Helper: Format time ──
      function formatTime(ts) {
        const d = new Date(ts || Date.now());
        return d.toLocaleTimeString('es-MX', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      // ── Helper: Escape HTML ──
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // ── Helper: Format text with highlights ──
      function formatMessageText(text) {
        if (!text) return '';
        let escaped = escapeHtml(text);
        // Highlight commands starting with !
        escaped = escaped.replace(/(^|\s)(!\w+)/g, '$1<span class="highlight-cmd">$2</span>');
        // Highlight mentions starting with @
        escaped = escaped.replace(/(^|\s)(@\w+)/g, '$1<span class="highlight-mention">$2</span>');
        return escaped;
      }

      // ── Helper: Build User Badges ──
      function renderBadges(item) {
        const badges = [];
        if (item.isStreamer) {
          badges.push('<span class="badge-pill badge-streamer">🔴 Streamer</span>');
        }
        if (item.isModerator) {
          badges.push('<span class="badge-pill badge-mod">🛡️ Mod</span>');
        }
        if (item.isSubscriber) {
          badges.push('<span class="badge-pill badge-sub">🌟 Sub</span>');
        }
        if (item.isVip) {
          badges.push('<span class="badge-pill badge-vip">👑 VIP</span>');
        }
        if (item.isSuperFan) {
          badges.push('<span class="badge-pill badge-superfan">⭐ Superfan</span>');
        }
        if (item.isDonador) {
          badges.push('<span class="badge-pill badge-donador">💎 Donador</span>');
        }
        return badges.join('');
      }

      // ── Render Single Message ──
      function createMessageElement(item) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';
        msgDiv.id = `msg-${item.id}`;

        if (item.isStreamer) msgDiv.classList.add('is-streamer');
        else if (item.isVip) msgDiv.classList.add('is-vip');
        else if (item.isSubscriber) msgDiv.classList.add('is-sub');
        else if (item.isModerator) msgDiv.classList.add('is-mod');
        else if (item.isSuperFan) msgDiv.classList.add('is-superfan');
        else if (item.isDonador) msgDiv.classList.add('is-donador');

        const avatarSrc = item.profilePictureUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(item.uniqueId || 'user')}`;
        const badgesHtml = renderBadges(item);
        const formattedMsg = formatMessageText(item.comment);
        const timeStr = formatTime(item.timestamp);

        msgDiv.innerHTML = `
          <div class="msg-avatar">
            <img src="${escapeHtml(avatarSrc)}" alt="" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback';" />
          </div>
          <div class="msg-content">
            <div class="msg-header">
              ${badgesHtml ? `<div class="msg-badges">${badgesHtml}</div>` : ''}
              <span class="msg-name" title="@${escapeHtml(item.uniqueId)}">${escapeHtml(item.nickname || item.uniqueId)}</span>
              <span class="msg-user">@${escapeHtml(item.uniqueId)}</span>
              <span class="msg-time">${timeStr}</span>
            </div>
            <div class="msg-text">${formattedMsg}</div>
          </div>
        `;

        // Auto-hide in overlay mode if configured
        if (autoHideSec > 0 && mode === 'overlay') {
          setTimeout(() => {
            msgDiv.classList.add('fade-out');
            setTimeout(() => {
              if (msgDiv.parentNode) msgDiv.remove();
            }, 500);
          }, autoHideSec * 1000);
        }

        return msgDiv;
      }

      // ── Check Filter ──
      function shouldDisplay(item) {
        if (hideCommands && item.comment && item.comment.startsWith('!')) {
          return false;
        }
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const nick = String(item.nickname || '').toLowerCase();
          const user = String(item.uniqueId || '').toLowerCase();
          const comment = String(item.comment || '').toLowerCase();
          return nick.includes(q) || user.includes(q) || comment.includes(q);
        }
        return true;
      }

      // ── Add Message to DOM ──
      function appendMessage(item) {
        if (!item || !item.comment) return;
        messages.push(item);
        totalReceived++;

        if (msgCounter) {
          msgCounter.textContent = `${totalReceived} msgs`;
        }

        if (emptyState && emptyState.parentNode) {
          emptyState.remove();
        }

        if (!shouldDisplay(item)) return;

        // Check if user is scrolled up
        const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;

        const el = createMessageElement(item);
        container.appendChild(el);

        // Keep DOM clean in overlay mode (max 40 items)
        if (mode === 'overlay' && container.children.length > 40) {
          const firstChild = container.firstElementChild;
          if (firstChild && firstChild !== emptyState) {
            firstChild.remove();
          }
        }

        // Auto-scroll or show pill
        if (autoScroll || isNearBottom) {
          container.scrollTop = container.scrollHeight;
          if (scrollBottomBtn) scrollBottomBtn.classList.remove('visible');
        } else {
          if (scrollBottomBtn) scrollBottomBtn.classList.add('visible');
        }
      }

      // ── Re-render all messages (on filter change) ──
      function rerenderAll() {
        container.innerHTML = '';
        const filtered = messages.filter(shouldDisplay);
        if (filtered.length === 0) {
          container.appendChild(emptyState);
          return;
        }
        filtered.forEach(item => {
          const el = createMessageElement(item);
          container.appendChild(el);
        });
        container.scrollTop = container.scrollHeight;
      }

      // ── Apply Configuration Dynamically ──
      function applyLiveConfig(cfg) {
        if (!cfg) return;
        
        const nextFontSize = cfg.chatOverlayFontSize || cfg.fontSize;
        if (nextFontSize) {
          currentFontSize = parseInt(nextFontSize, 10);
          document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
        }

        const nextOpacity = cfg.chatOverlayOpacity !== undefined ? cfg.chatOverlayOpacity : cfg.opacity;
        if (nextOpacity !== undefined) {
          document.documentElement.style.setProperty('--card-bg', `rgba(14, 13, 26, ${nextOpacity})`);
        }

        const nextTheme = cfg.chatOverlayTheme || cfg.theme;
        if (nextTheme) {
          applyTheme(nextTheme);
        }

        if (cfg.chatOverlayShowAvatars !== undefined) {
          document.body.classList.toggle('hide-avatars', cfg.chatOverlayShowAvatars === false);
        }

        if (cfg.chatOverlayShowBadges !== undefined) {
          document.body.classList.toggle('hide-badges', cfg.chatOverlayShowBadges === false);
        }

        if (cfg.chatOverlayAutoHide !== undefined) {
          autoHideSec = parseInt(cfg.chatOverlayAutoHide, 10) || 0;
        }

        if (cfg.chatOverlayFilterCommands !== undefined) {
          hideCommands = cfg.chatOverlayFilterCommands === true;
          if (btnToggleCmdFilter) btnToggleCmdFilter.classList.toggle('active', hideCommands);
          rerenderAll();
        }
      }

      // ── Connect SSE Stream ──
      function connectStream() {
        if (eventSource) {
          eventSource.close();
        }

        const streamUrl = (window.location.protocol === 'file:' ? 'http://localhost:3000' : '') + '/api/chat/stream';
        eventSource = new EventSource(streamUrl);

        eventSource.onopen = function () {
          if (statusBadge) {
            statusBadge.classList.remove('offline');
            statusText.textContent = 'En Vivo';
          }
        };

        eventSource.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'connected') {
              console.log('[Chat SSE] Conectado al stream de chat en vivo');
            } else if (data.type === 'clear') {
              messages = [];
              rerenderAll();
            } else if (data.comment) {
              appendMessage(data);
            }
          } catch (err) {
            console.warn('[Chat SSE] Error procesando evento:', err);
          }
        };

        eventSource.onerror = function () {
          if (statusBadge) {
            statusBadge.classList.add('offline');
            statusText.textContent = 'Reconectando...';
          }
          // Retry connection after delay
          setTimeout(() => {
            if (eventSource.readyState === EventSource.CLOSED) {
              connectStream();
            }
          }, 3000);
        };
      }

      // ── Load History & Settings ──
      async function loadHistoryAndConfig() {
        const apiBase = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';
        
        // Cargar configuración de overlays si no se pasaron parámetros explícitos
        try {
          const cfgRes = await fetch(`${apiBase}/api/overlays/config`);
          if (cfgRes.ok) {
            const cfg = await cfgRes.json();
            if (!params.has('theme') && cfg.chatOverlayTheme) {
              applyTheme(cfg.chatOverlayTheme);
            }
            if (!params.has('fontSize') && cfg.chatOverlayFontSize) {
              currentFontSize = cfg.chatOverlayFontSize;
              document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
            }
            if (cfg.chatOverlayOpacity !== undefined) {
              document.documentElement.style.setProperty('--card-bg', `rgba(14, 13, 26, ${cfg.chatOverlayOpacity})`);
            }
            if (!params.has('autoHide') && cfg.chatOverlayAutoHide !== undefined) {
              autoHideSec = cfg.chatOverlayAutoHide;
            }
            if (!params.has('avatars') && cfg.chatOverlayShowAvatars === false) {
              document.body.classList.add('hide-avatars');
            }
            if (!params.has('badges') && cfg.chatOverlayShowBadges === false) {
              document.body.classList.add('hide-badges');
            }
            if (!params.has('filterCmds') && cfg.chatOverlayFilterCommands === true) {
              hideCommands = true;
              if (btnToggleCmdFilter) btnToggleCmdFilter.classList.add('active');
            }
          }
        } catch (e) {
          console.warn('[Chat] No se pudo cargar configuración inicial:', e.message);
        }

        // Cargar historial
        try {
          const historyUrl = `${apiBase}/api/chat/history?limit=100`;
          const res = await fetch(historyUrl);
          if (res.ok) {
            const data = await res.json();
            if (data.ok && Array.isArray(data.messages)) {
              data.messages.forEach(appendMessage);
            }
          }
        } catch (e) {
          console.warn('[Chat] No se pudo cargar historial inicial:', e.message);
        }
      }

      // ── Controls Event Listeners ──
      if (themeSelector) {
        themeSelector.addEventListener('change', (e) => {
          applyTheme(e.target.value);
        });
      }

      if (btnToggleAutoScroll) {
        btnToggleAutoScroll.addEventListener('click', () => {
          autoScroll = !autoScroll;
          btnToggleAutoScroll.classList.toggle('active', autoScroll);
          if (autoScroll) {
            container.scrollTop = container.scrollHeight;
            if (scrollBottomBtn) scrollBottomBtn.classList.remove('visible');
          }
        });
      }

      if (btnToggleCmdFilter) {
        btnToggleCmdFilter.addEventListener('click', () => {
          hideCommands = !hideCommands;
          btnToggleCmdFilter.classList.toggle('active', hideCommands);
          rerenderAll();
        });
      }

      if (btnZoomIn) {
        btnZoomIn.addEventListener('click', () => {
          currentFontSize = Math.min(26, currentFontSize + 2);
          document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
        });
      }

      if (btnZoomOut) {
        btnZoomOut.addEventListener('click', () => {
          currentFontSize = Math.max(10, currentFontSize - 2);
          document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
        });
      }

      if (btnTest) {
        btnTest.addEventListener('click', async () => {
          const roles = ['user', 'vip', 'sub', 'mod', 'superfan', 'donador', 'streamer'];
          const randomRole = roles[Math.floor(Math.random() * roles.length)];
          const sampleTexts = [
            '¡Qué temazo! Saludos desde México 🇲🇽',
            '!sr Bad Bunny - Tití Me Preguntó',
            '¡Hola Zero! Increíble el live de hoy 🔥',
            '!puntos',
            'Gracias por la música de hoy 🎶🙌',
            'Dejo mi like y comparto el stream ❤️✨',
            '¡Apoyando con todo el power! 🚀'
          ];
          const randomText = sampleTexts[Math.floor(Math.random() * sampleTexts.length)];
          const randomUser = 'fan_' + Math.floor(Math.random() * 900 + 100);

          try {
            const testUrl = (window.location.protocol === 'file:' ? 'http://localhost:3000' : '') + '/api/chat/test';
            await fetch(testUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                uniqueId: randomUser,
                nickname: `Zero Fan (${randomRole.toUpperCase()})`,
                comment: randomText,
                role: randomRole
              })
            });
          } catch (e) {
            console.error('Error enviando test message:', e);
          }
        });
      }

      if (btnClear) {
        btnClear.addEventListener('click', async () => {
          if (!confirm('¿Deseas limpiar todo el historial de chat?')) return;
          try {
            const clearUrl = (window.location.protocol === 'file:' ? 'http://localhost:3000' : '') + '/api/chat/clear';
            await fetch(clearUrl, { method: 'POST' });
          } catch (e) {
            console.error('Error limpiando chat:', e);
          }
        });
      }

      if (btnPip) {
        btnPip.addEventListener('click', async () => {
          // Si el navegador soporta Document Picture-in-Picture API
          if ('documentPictureInPicture' in window) {
            try {
              const pipWindow = await window.documentPictureInPicture.requestWindow({
                width: 390,
                height: 600
              });
              // Copiar estilos
              [...document.styleSheets].forEach(styleSheet => {
                try {
                  const cssRules = [...styleSheet.cssRules].map(rule => rule.cssText).join('');
                  const style = document.createElement('style');
                  style.textContent = cssRules;
                  pipWindow.document.head.appendChild(style);
                } catch (e) {
                  const link = document.createElement('link');
                  link.rel = 'stylesheet';
                  link.type = styleSheet.type;
                  link.href = styleSheet.href;
                  pipWindow.document.head.appendChild(link);
                }
              });
              
              // Montar iframe autónomo en la ventana PiP flotante
              pipWindow.document.body.style.margin = '0';
              pipWindow.document.body.style.padding = '0';
              pipWindow.document.body.style.overflow = 'hidden';
              const base = window.location.protocol === 'file:' ? 'http://localhost:3000' : '.';
              const iframe = document.createElement('iframe');
              iframe.src = `${base}/chat_overlay.html?mode=window&theme=${theme}&fontSize=${currentFontSize}`;
              iframe.style.width = '100vw';
              iframe.style.height = '100vh';
              iframe.style.border = 'none';
              pipWindow.document.body.appendChild(iframe);
              return;
            } catch (e) {
              console.log('PiP API no disponible o denegada, abriendo ventana clásica:', e);
            }
          }
          // Fallback a ventana emergente normal
          window.open(window.location.href.replace('mode=overlay', 'mode=window'), 'ZeroFMLiveChat', 'width=400,height=650,menubar=no,toolbar=no,location=no,status=no');
        });
      }

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim();
          rerenderAll();
        });
      }

      if (scrollBottomBtn) {
        scrollBottomBtn.addEventListener('click', () => {
          autoScroll = true;
          if (btnToggleAutoScroll) btnToggleAutoScroll.classList.add('active');
          container.scrollTop = container.scrollHeight;
          scrollBottomBtn.classList.remove('visible');
        });
      }

      container.addEventListener('scroll', () => {
        const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
        if (isNearBottom && scrollBottomBtn) {
          scrollBottomBtn.classList.remove('visible');
        }
      });

      // ── Listen for PostMessage from Dashboard ──
      window.addEventListener('message', (event) => {
        if (!event.data) return;
        if (event.data.action === 'chat_message' && event.data.payload) {
          appendMessage(event.data.payload);
        } else if (event.data.action === 'chat_clear') {
          messages = [];
          rerenderAll();
        } else if (event.data.action === 'chat_config_update' || event.data.action === 'updateConfig' || event.data.action === 'updateLiveConfig') {
          const cfg = event.data.config || event.data.payload || {};
          applyLiveConfig(cfg);
        }
      });

      // ── Start ──
      loadHistoryAndConfig().then(() => {
        connectStream();
      });
    })();
  </script>
</body>
</html>
