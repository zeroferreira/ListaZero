<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo a Chat en Vivo...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (!params.has('mode')) {
      params.set('mode', 'window');
    }
    window.location.replace('chat_overlay.html?' + params.toString());
  </script>
</head>
<body style="background: #06060c; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <p>Cargando Chat en Vivo...</p>
</body>
</html>
