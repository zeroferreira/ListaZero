<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 Canción Actual (Cider) – Zero FM</title>

  <!-- Google Fonts: Outfit, Plus Jakarta Sans, Orbitron, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Socket.IO Client (para conectar directo a Cider v1/v2) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>

  <!-- Firebase Compat SDK (para sincronizar diseño e insignias/pedidos de Zero FM) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    @layer reset, base, components, theme, utilities;

    @layer reset {
      html, body, div, span, img, button, input, select, label, strong {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
    }

    @layer base {
      :root {
        --in-oklab: ;
        --in-oklch: ;
        --widget-theme: vinyl;
        --widget-width: 500px;
        --widget-scale: 1;
        --card-radius: 24px;
        --card-opacity: 0.88;
        --accent-color: #ff0055;
        --accent-secondary: #00e5ff;
        --accent-rgb: 255, 0, 85;
        --accent-sec-rgb: 0, 229, 255;
        --bg-rgb: 10, 9, 20;
        --text-color: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.72);
        --font-main: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-cyber: 'Orbitron', 'Outfit', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --title-size: 20px;
        --artist-size: 14px;
        --meta-size: 11.5px;
        --bass-energy: 0;
        --mid-energy: 0;
        --high-energy: 0;
      }

      @supports (background: linear-gradient(in oklab, white, black)) {
        :root {
          --in-oklab: in oklab;
          --in-oklch: in oklch;
        }
      }

      html, body {
        width: 100%;
        height: 100%;
        background: transparent !important;
        font-family: var(--font-main);
        color: var(--text-color);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 18px 24px;
      }
    }

    @layer components {
      /* ─── Stage Wrapper ─── */
      #widget-stage {
        position: relative;
        width: var(--widget-width);
        max-width: calc(100vw - 40px);
        transform: scale(var(--widget-scale));
        transform-origin: left center;
        transition:
          opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #widget-stage.is-hidden-idle {
        opacity: 0;
        transform: scale(calc(var(--widget-scale) * 0.94)) translateY(10px);
        pointer-events: none;
      }

      /* ─── Main Card Surface ─── */
      .cider-card {
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: center;
        gap: 18px;
        width: 100%;
        padding: 16px 20px;
        border-radius: var(--card-radius);
        corner-shape: squircle;
        background: rgba(var(--bg-rgb), var(--card-opacity));
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow:
          0 22px 50px -10px rgba(0, 0, 0, 0.68),
          0 8px 20px -6px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        overflow: hidden;
        contain: layout style;
        transition:
          border-radius 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.4s ease,
          border-color 0.4s ease,
          box-shadow 0.4s ease,
          padding 0.4s ease;
      }

      .cider-card.no-card-bg {
        background: transparent !important;
        border-color: transparent !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      .cider-card.no-card-bg .ambient-bg,
      .cider-card.no-card-bg .ambient-orb,
      .cider-card.no-card-bg .vision-rim,
      .cider-card.no-card-bg .vision-grabber {
        display: none !important;
      }

      /* ─── Ambient Dynamic Artwork Layers ─── */
      .ambient-bg {
        position: absolute;
        inset: -42px;
        background-size: cover;
        background-position: center;
        filter: blur(38px) saturate(230%) brightness(0.72);
        opacity: 0.22;
        z-index: 0;
        pointer-events: none;
        transform: scale(calc(1.06 + var(--bass-energy, 0) * 0.08));
        transition: background-image 0.65s ease, opacity 0.5s ease;
      }

      .ambient-orb {
        position: absolute;
        width: 68%;
        height: 130%;
        right: -14%;
        top: -15%;
        background-size: cover;
        background-position: center;
        filter: blur(50px) saturate(260%) brightness(0.92);
        mix-blend-mode: soft-light;
        opacity: 0;
        z-index: 0;
        pointer-events: none;
        animation: orbFloat 11s ease-in-out infinite alternate;
        @media (prefers-reduced-motion: reduce) {
          animation: none;
        }
      }

      @keyframes orbFloat {
        0% { transform: translate3d(-6%, -4%, 0) scale(1) rotate(0deg); }
        100% { transform: translate3d(6%, 5%, 0) scale(1.12) rotate(8deg); }
      }

      /* Specular rim overlay (used heavily in Apple Vision Glass) */
      .vision-rim {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        z-index: 4;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      .vision-grabber {
        position: absolute;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 3.5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.28);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        pointer-events: none;
        z-index: 4;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      /* ─── Visual Media Block (Cover + 3D Glow + Vinyl) ─── */
      .media-visual {
        position: relative;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        z-index: 2;
      }

      /* Colored 3D ambient shadow behind cover art */
      .cover-glow {
        position: absolute;
        left: 4px;
        top: 6px;
        width: 90px;
        height: 90px;
        border-radius: 18px;
        background-size: cover;
        background-position: center;
        filter: blur(16px) saturate(240%) brightness(1.1);
        opacity: calc(0.45 + var(--bass-energy, 0) * 0.42);
        transform: translateY(4px) scale(calc(0.95 + var(--bass-energy, 0) * 0.14));
        z-index: 1;
        pointer-events: none;
        transition: background-image 0.5s ease;
      }

      .cover-box {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 16px;
        corner-shape: squircle;
        overflow: hidden;
        background: linear-gradient(135deg var(--in-oklab), #1e1936, #0d0b18);
        box-shadow:
          0 12px 28px -4px rgba(0, 0, 0, 0.62),
          0 4px 10px rgba(0, 0, 0, 0.4),
          inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        z-index: 3;
        flex-shrink: 0;
        transform: scale(calc(1 + var(--bass-energy, 0) * 0.028));
        transition:
          border-radius 0.35s ease,
          box-shadow 0.35s ease;
      }

      /* Subtle glass sheen across album cover */
      .cover-box::after {
        content: "" / "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.22) 0%,
          rgba(255, 255, 255, 0.04) 36%,
          transparent 60%
        );
        pointer-events: none;
        z-index: 2;
      }

      .cover-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      }

      .cover-fallback {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        background: linear-gradient(
          135deg var(--in-oklab),
          rgba(var(--accent-rgb), 0.35),
          rgba(var(--accent-sec-rgb), 0.22)
        );
      }

      /* ─── Vinyl Disc (Used in Theme 1: Studio Vinyl) ─── */
      .vinyl-disc {
        position: relative;
        width: 92px;
        height: 92px;
        margin-inline-start: -40px;
        border-radius: 50%;
        background:
          radial-gradient(circle at center, #0e0e14 0%, #0e0e14 15%, transparent 15.5%),
          repeating-radial-gradient(
            circle at center,
            #13131a 0px,
            #13131a 1.8px,
            #232332 2.7px,
            #0f0f15 3.8px
          );
        box-shadow:
          0 10px 26px rgba(0, 0, 0, 0.72),
          0 0 calc(10px + var(--bass-energy, 0) * 18px) rgba(var(--accent-rgb), calc(0.18 + var(--bass-energy, 0) * 0.35)),
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.12);
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        animation: spinVinyl 5.2s linear infinite;
        animation-play-state: running;
        transition: margin-inline-start 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.15s ease;
        @media (prefers-reduced-motion: reduce) {
          animation-duration: 26s;
        }
      }

      /* Anisotropic vinyl groove light reflections */
      .vinyl-disc::before {
        content: "" / "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 28deg,
          transparent 0deg,
          rgba(255, 255, 255, 0.18) 22deg,
          rgba(var(--accent-sec-rgb), 0.14) 36deg,
          transparent 58deg,
          transparent 178deg,
          rgba(255, 255, 255, 0.16) 202deg,
          rgba(var(--accent-rgb), 0.14) 216deg,
          transparent 238deg
        );
        pointer-events: none;
      }

      .vinyl-label {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        background-color: var(--accent-color);
        border: 2px solid rgba(255, 255, 255, 0.32);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .vinyl-label::after {
        content: "" / "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #08080e;
        border: 1px solid rgba(255, 255, 255, 0.35);
      }

      :where(.cider-card[data-playing="false"]) .vinyl-disc {
        animation-play-state: paused;
        margin-inline-start: -56px;
      }

      @keyframes spinVinyl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* ─── Track Details / Content Area ─── */
      .track-info {
        position: relative;
        z-index: 3;
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      /* Top Status + Real Music Equalizer Row */
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3.5px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        background: rgba(var(--accent-rgb), 0.18);
        color: #ffffff;
        border: 1px solid rgba(var(--accent-rgb), 0.42);
        box-shadow: 0 2px 12px rgba(var(--accent-rgb), 0.2);
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .status-dot {
        width: 6.5px;
        height: 6.5px;
        border-radius: 50%;
        background: var(--accent-color);
        box-shadow: 0 0 8px var(--accent-color);
        transform: scale(calc(1 + var(--bass-energy, 0) * 0.35));
      }

      :where(.cider-card[data-playing="false"]) .status-dot {
        background: #fbbf24;
        box-shadow: 0 0 8px #fbbf24;
        transform: scale(1);
      }

      /* ─── Real Music-Reactive 12-Band Spectrum Equalizer ─── */
      .eq-capsule {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .eq-bars {
        display: inline-flex;
        align-items: flex-end;
        gap: 2.2px;
        height: 16px;
        padding-block: 1px;
      }

      #eq-bars > .eq-bar {
        --stagger-time: 0.04s;
        position: relative;
        width: 3px;
        height: 14px;
        border-radius: 999px;
        background: linear-gradient(
          to top var(--in-oklch),
          var(--accent-color) 0%,
          var(--accent-secondary) 100%
        );
        transform-origin: bottom center;
        transform: scaleY(var(--eq-level, 0.16));
        will-change: transform;
        box-shadow: 0 0 6px rgba(var(--accent-rgb), calc(var(--eq-level, 0.16) * 0.6));
        animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
        animation-delay: calc(sibling-index() * var(--stagger-time));
        @media (prefers-reduced-motion: reduce) {
          transition: transform 0.25s ease;
        }
      }

      /* Floating Peak-Hold Cap (visible in Cyber & Studio modes) */
      .eq-bar::after {
        content: "" / "";
        position: absolute;
        top: -2.5px;
        left: 0;
        right: 0;
        height: 2px;
        border-radius: 999px;
        background: #ffffff;
        opacity: calc(var(--eq-level, 0.16) * 0.85);
      }

      :where(.cider-card[data-playing="false"]) #eq-bars > .eq-bar {
        transform: scaleY(0.15) !important;
        opacity: 0.4;
        box-shadow: none;
      }

      /* ─── Song Title with Smooth Compositor Marquee ─── */
      .title-viewport {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        mask-image: linear-gradient(to right, #000 0%, #000 90%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, #000 0%, #000 90%, transparent 100%);
      }

      .song-title {
        display: inline-block;
        font-family: var(--font-display);
        font-size: var(--title-size);
        font-weight: 800;
        line-height: 1.18;
        color: var(--text-color);
        letter-spacing: -0.015em;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.38);
      }

      .song-title.is-marquee {
        padding-inline-end: 48px;
        animation: marqueeScroll 11s linear infinite;
        @media (prefers-reduced-motion: reduce) {
          animation: none;
        }
      }

      @keyframes marqueeScroll {
        0%, 18% { transform: translateX(0); }
        82%, 100% { transform: translateX(var(--marquee-offset, -45%)); }
      }

      .song-artist {
        font-size: var(--artist-size);
        font-weight: 600;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.22;
        letter-spacing: -0.005em;
      }

      /* ─── Meta Row: Requester + VIP Badge + Album ─── */
      .meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
        min-height: 20px;
      }

      .album-label {
        font-size: var(--meta-size);
        font-weight: 500;
        color: rgba(255, 255, 255, 0.52);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      .requester-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: rgba(255, 255, 255, 0.92);
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        backdrop-filter: blur(8px);
      }

      .requester-name {
        font-weight: 700;
        color: #ffffff;
      }

      /* Official Zero FM VIP Badges */
      .user-insignia {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 9.5px;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.3;
      }
      .user-insignia.superfan {
        background: linear-gradient(135deg, #ff0055, #ff7a00);
        color: #fff;
        box-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
      }
      .user-insignia.z0-platino {
        background: linear-gradient(135deg, #e2e8f0, #38bdf8, #818cf8);
        color: #090d16;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
      }
      .user-insignia.z0-vip {
        background: linear-gradient(135deg, #a855f7, #ec4899);
        color: #fff;
      }
      .user-insignia.vip {
        background: linear-gradient(135deg, #f59e0b, #eab308);
        color: #111;
      }
      .user-insignia.donador {
        background: rgba(236, 72, 153, 0.25);
        border: 1px solid rgba(236, 72, 153, 0.6);
        color: #fbcfe8;
      }
      .user-insignia.z0-fan {
        background: rgba(16, 185, 129, 0.25);
        border: 1px solid rgba(16, 185, 129, 0.6);
        color: #a7f3d0;
      }

      /* ─── Modern Scrubber Progress Bar & Inline Timestamps ─── */
      .progress-wrap {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 5px;
        width: 100%;
      }

      .time-pill {
        font-size: 10.5px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.68);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
        min-width: 31px;
        flex-shrink: 0;
        line-height: 1;
      }

      .time-pill.time-rem {
        text-align: right;
        min-width: 35px;
        color: rgba(255, 255, 255, 0.52);
      }

      .progress-track {
        position: relative;
        flex: 1;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 1px 2px rgba(0, 0, 0, 0.5),
          0 1px 0 rgba(255, 255, 255, 0.08);
        overflow: visible;
      }

      /* Subtle unplayed rail micro-groove pattern */
      .progress-track::before {
        content: "" / "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.06) 0 2px,
          transparent 0 6px
        );
        opacity: 0.65;
        pointer-events: none;
      }

      .progress-fill {
        position: relative;
        height: 100%;
        width: 0%;
        min-width: 7px;
        border-radius: inherit;
        background: linear-gradient(
          90deg var(--in-oklch),
          var(--accent-color) 0%,
          var(--accent-secondary) 100%
        );
        box-shadow:
          0 0 calc(10px + var(--bass-energy, 0) * 10px) rgba(var(--accent-rgb), 0.55),
          0 0 18px rgba(var(--accent-sec-rgb), 0.28);
        transition: width 0.12s linear;
      }

      /* Animated light shimmer inside the played progress bar */
      .progress-shimmer {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        pointer-events: none;
      }

      .progress-shimmer::after {
        content: "" / "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.45) 50%,
          transparent 100%
        );
        transform: translateX(-120%);
        animation: shimmerGlide 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        @media (prefers-reduced-motion: reduce) {
          animation: none;
        }
      }

      :where(.cider-card[data-playing="false"]) .progress-shimmer::after {
        animation-play-state: paused;
        opacity: 0;
      }

      @keyframes shimmerGlide {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(320%); }
      }

      /* Glowing Scrubber Playhead Thumb */
      .progress-thumb {
        position: absolute;
        right: -5px;
        top: 50%;
        transform: translateY(-50%) scale(calc(1 + var(--bass-energy, 0) * 0.18));
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid var(--accent-secondary);
        box-shadow:
          0 0 10px #ffffff,
          0 0 16px var(--accent-color);
        transition: transform 0.1s ease, width 0.25s ease, height 0.25s ease, border-radius 0.25s ease;
      }
    }

    /* =========================================================================
       3 TEMAS / ESTILOS VISUALES MODERNOS
    ========================================================================= */
    @layer theme {
      /* ─── TEMA 1: STUDIO VINYL LUXE (Vinilo Giratorio Moderno) ─── */
      :where([data-theme="vinyl"]) .cider-card {
        border-radius: 24px;
        padding: 16px 20px;
        background:

      :where([data-theme="cyber"]) .cider-card {

        color: var(--accent-secondary);

    @layer utilities {
      /* ─── Song Change Transition ─── */
      .cider-card.track-changing .cover-box,
      .cider-card.track-changing .track-info {
        animation: trackPulse 0.48s cubic-bezier(0.22, 1, 0.36, 1);

      @keyframes trackPulse {
        0% { opacity: 0.35; transform: translateY(6px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* ─── Floating Controls (Visible only on Hover for OBS cleanliness) ─── */
      #floating-controls {

        right: 10px;
        display: flex;
        gap: 6px;
        z-index: 9999;
        opacity: 0;

      }

      body:hover #floating-controls,

        opacity: 1;
      }

      .ctrl-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.2);

      /* ─── Settings Drawer ─── */
      #settings-drawer {

        max-height: calc(100vh - 60px);

        border: 1px solid rgba(255, 255, 255, 0.16);

      }

      #settings-drawer.open {

      }

      .cfg-row {

      }

      .cfg-row label {

        color: rgba(255, 255, 255, 0.85);

        justify-content: space-between;
      }

      .cfg-row select,
      .cfg-row input[type="text"],
      .cfg-row input[type="number"] {

      .cfg-checks {

      .cfg-check {

      .audio-status-badge {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 7px 10px;
        border-radius: 10px;

        border: 1px solid rgba(16, 185, 129, 0.35);

        font-weight: 600;
      }

      /* Toast Indicator */
      #theme-toast {
        position: fixed;
        bottom: 12px;
        left: 24px;
        background: rgba(12, 10, 24, 0.92);
        border: 1px solid var(--accent-color);
        color: #fff;
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
        z-index: 10001;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      #theme-toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Escenario Principal del Widget -->

              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>

  <script>
    (function() {
      // Fallback para sibling-index() en navegadores anteriores
      if (!CSS.supports('animation-delay: calc(sibling-index() * 0.1s)')) {
        const eqList = document.getElementById('eq-bars');
        if (eqList) {
          [...eqList.children].forEach((el, index) => el.style.setProperty('--sibling-index', index + 1));
        }
      }

      // ─── Safe LocalStorage Wrapper ───
      const safeStorage = (() => {
        const mem = {};
        try {
          const k = '__cider_w_test__';
          window.localStorage.setItem(k, k);
          window.localStorage.removeItem(k);
          return window.localStorage;
        } catch (_) {
          return {
            getItem: (k) => mem[k] || null,
            setItem: (k, v) => { mem[k] = String(v); },
            removeItem: (k) => { delete mem[k]; }
          };
        }
      })();

      const urlParams = new URLSearchParams(window.location.search);

      const THEME_LABELS = {
        vinyl: '💿 Estilo 1: Vinilo Giratorio (Studio Luxe)',
        glass: '🪟 Estilo 2: Apple Vision Pro (Spatial Glass)',
        cyber: '⚡ Estilo 3: Cyberpunk Zero FM (Neon HUD)'
      };
      const THEME_ORDER = ['vinyl', 'glass', 'cyber'];

      const defaultConfig = {
        ciderWidgetTheme: 'vinyl',
        ciderUrl: '',
        ciderWidgetWidth: 500,
        ciderWidgetScale: 1,
        ciderWidgetOpacity: 0.88,
        ciderWidgetAccent: '#ff0055',
        ciderWidgetAccentSec: '#00e5ff',
        ciderWidgetTitleSize: 20,
        ciderWidgetShowProgress: true,
        ciderWidgetShowTime: true,
        ciderWidgetShowRequester: true,
        ciderWidgetShowAlbum: true,
        ciderWidgetShowEq: true,
        ciderWidgetHideWhenPaused: false,
        ciderWidgetShowCardBg: true,
        ciderAudioDeviceId: 'auto'
      };

      let currentConfig = { ...defaultConfig };
      try {
        const saved = safeStorage.getItem('zero_cider_widget_config');
        if (saved) currentConfig = { ...currentConfig, ...JSON.parse(saved) };
      } catch (_) {}

      const urlTheme = String(urlParams.get('theme') || urlParams.get('style') || '').trim().toLowerCase();
      if (THEME_ORDER.includes(urlTheme)) {
        currentConfig.ciderWidgetTheme = urlTheme;
      }
      const urlCider = String(urlParams.get('ciderUrl') || '').trim();
      if (urlCider) {
        currentConfig.ciderUrl = urlCider;
      }

      // ─── DOM Elements ───
      const stageEl = document.getElementById('widget-stage');
      const cardEl = document.getElementById('cider-card');
      const ambientBgEl = document.getElementById('ambient-bg');
      const ambientOrbEl = document.getElementById('ambient-orb');
      const coverGlowEl = document.getElementById('cover-glow');
      const coverImgEl = document.getElementById('cover-img');
      const coverFallbackEl = document.getElementById('cover-fallback');
      const vinylLabelEl = document.getElementById('vinyl-label');
      const statusTextEl = document.getElementById('status-text');
      const eqCapsuleEl = document.getElementById('eq-capsule');
      const eqBarsEl = document.getElementById('eq-bars');
      const eqBarNodes = eqBarsEl ? Array.from(eqBarsEl.querySelectorAll('.eq-bar')) : [];
      const titleViewportEl = document.getElementById('title-viewport');
      const songTitleEl = document.getElementById('song-title');
      const songArtistEl = document.getElementById('song-artist');
      const requesterPillEl = document.getElementById('requester-pill');
      const requesterNameEl = document.getElementById('requester-name');
      const requesterBadgeEl = document.getElementById('requester-badge');
      const albumLabelEl = document.getElementById('album-label');
      const progressWrapEl = document.getElementById('progress-wrap');
      const progressFillEl = document.getElementById('progress-fill');
      const timeElapsedEl = document.getElementById('time-elapsed');
      const timeRemainingEl = document.getElementById('time-remaining');
      const toastEl = document.getElementById('theme-toast');
      const audioStatusLabelEl = document.getElementById('audio-status-label');
      const btnAudioInputEl = document.getElementById('btn-audio-input');
      const audioDeviceSelectEl = document.getElementById('cfg-audioDevice');

      function hexToRgbTuple(hex, fallback = '255, 0, 85') {
        const clean = String(hex || '').replace('#', '').trim();
        if (clean.length !== 6) return fallback;
        const r = parseInt(clean.slice(0, 2), 16);
        const g = parseInt(clean.slice(2, 4), 16);
        const b = parseInt(clean.slice(4, 6), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return fallback;
        return `${r}, ${g}, ${b}`;
      }

      let toastTimer = null;
      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2300);
      }

      // ─── Apply Visual Config ───
      function applyConfig(cfg) {
        currentConfig = { ...currentConfig, ...cfg };
        if (THEME_ORDER.includes(urlTheme) && !cfg._forceThemeOverride) {
          currentConfig.ciderWidgetTheme = urlTheme;
        }
        const theme = THEME_ORDER.includes(currentConfig.ciderWidgetTheme)
          ? currentConfig.ciderWidgetTheme
          : 'vinyl';

        const root = document.documentElement;
        stageEl.setAttribute('data-theme', theme);
        root.style.setProperty('--widget-theme', theme);
        root.style.setProperty('--widget-width', `${Number(currentConfig.ciderWidgetWidth) || 500}px`);
        root.style.setProperty('--widget-scale', String(Number(currentConfig.ciderWidgetScale) || 1));

        const op = currentConfig.ciderWidgetOpacity !== undefined
          ? (Number(currentConfig.ciderWidgetOpacity) > 1 ? Number(currentConfig.ciderWidgetOpacity) / 100 : Number(currentConfig.ciderWidgetOpacity))
          : 0.88;
        root.style.setProperty('--card-opacity', String(Math.max(0.12, Math.min(1, op))));

        const accent = currentConfig.ciderWidgetAccent || '#ff0055';
        const accentSec = currentConfig.ciderWidgetAccentSec || '#00e5ff';
        root.style.setProperty('--accent-color', accent);
        root.style.setProperty('--accent-secondary', accentSec);
        root.style.setProperty('--accent-rgb', hexToRgbTuple(accent, '255, 0, 85'));
        root.style.setProperty('--accent-sec-rgb', hexToRgbTuple(accentSec, '0, 229, 255'));

        const titlePx = Number(currentConfig.ciderWidgetTitleSize) || 20;
        root.style.setProperty('--title-size', `${titlePx}px`);
        root.style.setProperty('--artist-size', `${Math.max(12, Math.round(titlePx * 0.72))}px`);

        cardEl.classList.toggle('no-card-bg', currentConfig.ciderWidgetShowCardBg === false);
        progressWrapEl.style.display = currentConfig.ciderWidgetShowProgress === false ? 'none' : 'flex';
        const showTime = currentConfig.ciderWidgetShowTime !== false;
        timeElapsedEl.style.display = showTime ? 'inline-block' : 'none';
        timeRemainingEl.style.display = showTime ? 'inline-block' : 'none';
        if (eqCapsuleEl) {
          eqCapsuleEl.style.display = currentConfig.ciderWidgetShowEq === false ? 'none' : 'inline-flex';
        }

        syncInputsFromConfig();
        renderTrackMetadata();
        updateIdleVisibility();
        requestAnimationFrame(updateTitleMarquee);
      }

      function syncInputsFromConfig() {
        const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
        const setChk = (id, val) => { const el = document.getElementById(id); if (el) el.checked = !!val; };
        setVal('cfg-theme', currentConfig.ciderWidgetTheme || 'vinyl');
        setVal('cfg-ciderUrl', currentConfig.ciderUrl || '');
        setVal('cfg-accent', currentConfig.ciderWidgetAccent || '#ff0055');
        setVal('cfg-accentSec', currentConfig.ciderWidgetAccentSec || '#00e5ff');
        if (audioDeviceSelectEl && currentConfig.ciderAudioDeviceId) {
          audioDeviceSelectEl.value = currentConfig.ciderAudioDeviceId;
        }
        const w = Number(currentConfig.ciderWidgetWidth) || 500;
        setVal('cfg-width', w);
        const wLbl = document.getElementById('val-width');
        if (wLbl) wLbl.textContent = `${w}px`;

        const opPct = Math.round((Number(currentConfig.ciderWidgetOpacity) <= 1 ? Number(currentConfig.ciderWidgetOpacity) * 100 : Number(currentConfig.ciderWidgetOpacity)) || 88);
        setVal('cfg-opacity', opPct);
        const opLbl = document.getElementById('val-opacity');
        if (opLbl) opLbl.textContent = `${opPct}%`;

        const ts = Number(currentConfig.ciderWidgetTitleSize) || 20;
        setVal('cfg-titleSize', ts);
        const tsLbl = document.getElementById('val-titleSize');
        if (tsLbl) tsLbl.textContent = `${ts}px`;

        setChk('cfg-showProgress', currentConfig.ciderWidgetShowProgress !== false);
        setChk('cfg-showTime', currentConfig.ciderWidgetShowTime !== false);
        setChk('cfg-showRequester', currentConfig.ciderWidgetShowRequester !== false);
        setChk('cfg-showAlbum', currentConfig.ciderWidgetShowAlbum !== false);
        setChk('cfg-showEq', currentConfig.ciderWidgetShowEq !== false);
        setChk('cfg-hideWhenPaused', currentConfig.ciderWidgetHideWhenPaused === true);
      }

      // ─── Playback State & Track Metadata Cache ───
      let playbackState = {
        song: '',
        artist: '',
        album: '',
        artworkUrl: '',
        previewUrl: '',
        appleMusicId: '',
        requester: '',
        badge: '',
        durationMs: 0,
        positionMs: 0,
        updatedAt: 0,
        isPlaying: false,
        hasTrack: false
      };

      let lastTrackKey = '';
      const trackMetaCache = {};

      function normalizeArtworkUrl(rawUrl) {
        if (!rawUrl) return '';
        let u = String(rawUrl).trim();
        if (!u) return '';
        u = u
          .replace(/\{w\}x\{h\}/gi, '600x600')
          .replace(/\{w\}/gi, '600')
          .replace(/\{h\}/gi, '600')
          .replace(/100x100bb/gi, '600x600bb')
          .replace(/100x100/gi, '600x600');
        return u;
      }

      // Obtiene tanto la portada HQ como el stream de audio real (previewUrl CORS-enabled) de Apple Music / iTunes
      async function fetchItunesTrackMedia(artist, song) {
        const key = `${artist}|${song}`.toLowerCase().trim();
        if (!key || key === '|') return { artworkUrl: '', previewUrl: '' };
        if (trackMetaCache[key] !== undefined) return trackMetaCache[key];
        try {
          const cleanQ = `${artist} ${song}`
            .replace(/\([\s\S]*?\)|\[[\s\S]*?\]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanQ)}&entity=song&limit=5`);
          const data = await res.json();
          if (data && data.results && data.results.length > 0) {
            const best = data.results[0];
            const art = best.artworkUrl100
              ? best.artworkUrl100.replace('100x100', '600x600')
              : '';
            const previewUrl = best.previewUrl || '';
            const result = { artworkUrl: art, previewUrl };
            trackMetaCache[key] = result;
            return result;
          }
        } catch (_) {}
        const empty = { artworkUrl: '', previewUrl: '' };
        trackMetaCache[key] = empty;
        return empty;
      }

      // =========================================================================
      // MOTOR DE AUDIO REAL (WEB AUDIO API FFT ANALYSER + MULTI-SOURCE)
      // =========================================================================
      let audioCtx = null;
      let trackAnalyser = null;
      let micAnalyser = null;
      let silentAudioEl = null;
      let trackSourceNode = null;
      let micSourceNode = null;
      let micStream = null;
      let freqBuffer = new Uint8Array(128);
      const smoothedBands = new Float32Array(12);
      let smoothedBass = 0;
      let currentPreviewLoaded = '';
      let activeAudioMode = 'track'; // 'mic' | 'track' | 'acoustic'

      function ensureAudioEngine() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          audioCtx = new Ctx();
        }
        if (!trackAnalyser && audioCtx) {
          trackAnalyser = audioCtx.createAnalyser();
          trackAnalyser.fftSize = 256;
          trackAnalyser.smoothingTimeConstant = 0.74;
          freqBuffer = new Uint8Array(trackAnalyser.frequencyBinCount);

          // Silencioso: GainNode en 0 para analizar el espectro real sin duplicar audio en el stream
          const zeroGain = audioCtx.createGain();
          zeroGain.gain.value = 0.00001;
          trackAnalyser.connect(zeroGain);
          zeroGain.connect(audioCtx.destination);
        }
        if (!silentAudioEl && audioCtx && trackAnalyser) {
          silentAudioEl = new Audio();
          silentAudioEl.crossOrigin = 'anonymous';
          silentAudioEl.loop = true;
          silentAudioEl.preload = 'auto';
          silentAudioEl.playsInline = true;
          try {
            trackSourceNode = audioCtx.createMediaElementSource(silentAudioEl);
            trackSourceNode.connect(trackAnalyser);
          } catch (e) {
            console.warn('[CiderWidget] MediaElementSource init warning:', e);
          }
        }
        return audioCtx;
      }

      function syncTrackAudioStream(previewUrl, isPlaying) {
        ensureAudioEngine();
        if (!silentAudioEl) return;

        if (!previewUrl || !isPlaying) {
          if (!silentAudioEl.paused) {
            try { silentAudioEl.pause(); } catch (_) {}
          }
          return;
        }

        if (currentPreviewLoaded !== previewUrl) {
          currentPreviewLoaded = previewUrl;
          silentAudioEl.src = previewUrl;
          try {
            // Sincronizar fase con la posición actual de la canción
            const offsetSec = ((Number(playbackState.positionMs) || 0) / 1000) % 28;
            silentAudioEl.currentTime = Number.isFinite(offsetSec) ? offsetSec : 0;
          } catch (_) {}
        }

        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        if (silentAudioEl.paused && isPlaying) {
          silentAudioEl.play().catch(() => {});
        }
      }

      async function refreshAudioDeviceList() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices || !audioDeviceSelectEl) return;
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(d => d.kind === 'audioinput');
          const currentVal = currentConfig.ciderAudioDeviceId || 'auto';
          audioDeviceSelectEl.innerHTML = '<option value="auto">🎵 Automático (Stream de Pista Apple Music)</option>';
          audioInputs.forEach((dev, idx) => {
            const opt = document.createElement('option');
            opt.value = dev.deviceId || `dev-${idx}`;
            opt.textContent = `🎙️ ${dev.label || `Entrada de Audio #${idx + 1}`}`;
            audioDeviceSelectEl.appendChild(opt);
          });
          if ([...audioDeviceSelectEl.options].some(o => o.value === currentVal)) {
            audioDeviceSelectEl.value = currentVal;
          }
        } catch (_) {}
      }

      async function connectLiveAudioInput(deviceId = '') {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('⚠️ Captura de audio no disponible en este navegador');
          return false;
        }
        try {
          ensureAudioEngine();
          if (audioCtx && audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }
          if (micStream) {
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
          }
          const constraints = {
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              ...(deviceId && deviceId !== 'auto' ? { deviceId: { exact: deviceId } } : {})
            }
          };
          micStream = await navigator.mediaDevices.getUserMedia(constraints);
          if (!micAnalyser) {
            micAnalyser = audioCtx.createAnalyser();
            micAnalyser.fftSize = 256;
            micAnalyser.smoothingTimeConstant = 0.72;
          }
          if (micSourceNode) {
            try { micSourceNode.disconnect(); } catch (_) {}
          }
          micSourceNode = audioCtx.createMediaStreamSource(micStream);
          micSourceNode.connect(micAnalyser);

          activeAudioMode = 'mic';
          if (btnAudioInputEl) btnAudioInputEl.classList.add('active-audio');
          if (audioStatusLabelEl) {
            audioStatusLabelEl.textContent = '🟢 Ecualizador FFT: Audio del Sistema / Loopback';
          }
          await refreshAudioDeviceList();
          showToast('🎙️ Ecualizador conectado al audio en directo');
          return true;
        } catch (err) {
          console.warn('[CiderWidget] No se pudo abrir entrada de audio:', err);
          activeAudioMode = 'track';
          if (btnAudioInputEl) btnAudioInputEl.classList.remove('active-audio');
          showToast('🎵 Usando analizador FFT de pista Apple Music');
          return false;
        }
      }

      function disconnectLiveAudioInput() {
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (micSourceNode) {
          try { micSourceNode.disconnect(); } catch (_) {}
          micSourceNode = null;
        }
        activeAudioMode = 'track';
        if (btnAudioInputEl) btnAudioInputEl.classList.remove('active-audio');
        if (audioStatusLabelEl) {
          audioStatusLabelEl.textContent = '🟢 Ecualizador FFT: Pista Musical Real';
        }
      }

      // Desbloquea el AudioContext ante cualquier interacción o mensaje
      function unlockAudioOnGesture() {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        if (playbackState.isPlaying && playbackState.previewUrl && silentAudioEl && silentAudioEl.paused) {
          silentAudioEl.play().catch(() => {});
        }
      }
      window.addEventListener('pointerdown', unlockAudioOnGesture, { passive: true });
      window.addEventListener('keydown', unlockAudioOnGesture, { passive: true });

      // Calcula un BPM determinista por canción (102 - 134 BPM) para el sintetizador acústico de respaldo
      function getTrackSeedBpm() {
        const s = `${playbackState.song}|${playbackState.artist}`;
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return 104 + (Math.abs(h) % 30);
      }

      // Mapeo logarítmico de bins FFT (128 bins @ 44.1kHz/48kHz) para las 12 barras del ecualizador
      const BAND_BIN_RANGES = [
        [1, 2],   // Sub-bass (35-90 Hz)
        [2, 3],   // Kick punch (90-150 Hz)
        [3, 5],   // Bass groove (150-260 Hz)
        [5, 8],   // Upper bass (260-420 Hz)
        [8, 12],  // Low mids (420-650 Hz)
        [12, 17], // Mids (650-950 Hz)
        [17, 24], // Vocal fundamental (950-1.4 kHz)
        [24, 33], // Upper vocals / snare body (1.4-2.1 kHz)
        [33, 44], // Presence (2.1-3.2 kHz)
        [44, 58], // Brilliance (3.2-4.8 kHz)
        [58, 76], // Hi-hats / sibilance (4.8-7.5 kHz)
        [76, 102] // Air / cymbals (7.5-12 kHz)
      ];

      // ─── 60fps Audio Spectrum & Smooth Progress Loop ───
      function runRealtimeFrame(nowMs) {
        const isPlaying = !!playbackState.isPlaying && playbackState.hasTrack;

        // 1. Actualizar barra de progreso a 60fps con interpolación sub-milisegundo
        const dur = Number(playbackState.durationMs) || 0;
        let pos = Number(playbackState.positionMs) || 0;
        if (isPlaying && playbackState.updatedAt > 0 && dur > 0) {
          pos = Math.min(dur, pos + Math.max(0, Date.now() - playbackState.updatedAt));
        }
        const pct = dur > 0 ? Math.max(0, Math.min(100, (pos / dur) * 100)) : 0;
        progressFillEl.style.width = `${pct.toFixed(3)}%`;
        timeElapsedEl.textContent = formatTimeMs(pos);
        const rem = Math.max(0, dur - pos);
        timeRemainingEl.textContent = dur > 0 ? `-${formatTimeMs(rem)}` : '-0:00';

        // 2. Actualizar Ecualizador de 12 Bandas y Pulso de Graves (--bass-energy)
        if (!isPlaying) {
          smoothedBass *= 0.84;
          cardEl.style.setProperty('--bass-energy', smoothedBass.toFixed(3));
          for (let i = 0; i < eqBarNodes.length; i++) {
            smoothedBands[i] = smoothedBands[i] * 0.82 + 0.14 * 0.18;
            eqBarNodes[i].style.setProperty('--eq-level', smoothedBands[i].toFixed(3));
          }
          requestAnimationFrame(runRealtimeFrame);
          return;
        }

        let usedRealFft = false;
        const activeAnalyser = (activeAudioMode === 'mic' && micAnalyser) ? micAnalyser : trackAnalyser;

        if (activeAnalyser && audioCtx && audioCtx.state === 'running') {
          activeAnalyser.getByteFrequencyData(freqBuffer);
          let totalEnergy = 0;
          for (let k = 1; k < 64; k++) totalEnergy += freqBuffer[k];

          if (totalEnergy > 40) {
            usedRealFft = true;
            for (let i = 0; i < 12; i++) {
              const [startBin, endBin] = BAND_BIN_RANGES[i];
              let sum = 0;
              let count = 0;
              for (let b = startBin; b <= endBin && b < freqBuffer.length; b++) {
                sum += freqBuffer[b];
                count++;
              }
              const avg = count > 0 ? sum / (count * 255) : 0;
              // Compensación psicoacústica (realza agudos naturales del espectro musical)
              const tilt = 1 + (i / 11) * 0.55;
              const target = Math.max(0.14, Math.min(1.0, Math.pow(avg * tilt, 0.85)));
              const attack = target > smoothedBands[i] ? 0.45 : 0.22;
              smoothedBands[i] += (target - smoothedBands[i]) * attack;
              if (eqBarNodes[i]) {
                eqBarNodes[i].style.setProperty('--eq-level', smoothedBands[i].toFixed(3));
              }
            }

            const rawBass = (smoothedBands[0] * 0.45 + smoothedBands[1] * 0.4 + smoothedBands[2] * 0.15);
            const bassPulse = Math.max(0, Math.min(1, (rawBass - 0.25) * 1.45));
            smoothedBass += (bassPulse - smoothedBass) * 0.38;
            cardEl.style.setProperty('--bass-energy', smoothedBass.toFixed(3));
          }
        }

        // Si el navegador aún no ha desbloqueado Web Audio o la canción no tiene preview en iTunes,
        // el motor acústico multicapa genera transitorios reales de bombo (kick), bajo, caja (snare) y hi-hat
        if (!usedRealFft) {
          const bpm = getTrackSeedBpm();
          const songTimeSec = (pos > 0 ? pos : nowMs) / 1000;
          const beatFloat = songTimeSec * (bpm / 60);
          const beatPhase = beatFloat % 1;
          const barBeat = Math.floor(beatFloat) % 4;

          // Transitorio de Kick (golpe rápido con decaimiento exponencial)
          const kickEnv = Math.pow(Math.max(0, 1 - beatPhase * 2.6), 2.4);
          // Sub-bass sincopado
          const subEnv = 0.5 + 0.5 * Math.sin(beatFloat * Math.PI);
          // Snare / Clap en tiempos 2 y 4 (barBeat 1 y 3)
          const isSnareBeat = (barBeat === 1 || barBeat === 3);
          const snareEnv = isSnareBeat ? Math.pow(Math.max(0, 1 - beatPhase * 3.1), 2.1) : 0.12;
          // Hi-hats en semicorcheas (16th notes)
          const sixteenthPhase = (beatFloat * 4) % 1;
          const hatEnv = Math.pow(Math.max(0, 1 - sixteenthPhase * 2.8), 1.8) * (0.55 + 0.45 * Math.sin(beatFloat * 2));

          for (let i = 0; i < 12; i++) {
            let bandVal = 0.18;
            if (i <= 2) {
              // Sub & Kick bands
              bandVal = 0.22 + kickEnv * (0.76 - i * 0.08) + subEnv * 0.18;
            } else if (i <= 5) {
              // Bass & Low-Mid groove
              const groove = 0.5 + 0.5 * Math.sin(songTimeSec * (4.2 + i * 0.7) + i);
              bandVal = 0.2 + groove * 0.48 + kickEnv * 0.22 + snareEnv * 0.18;
            } else if (i <= 8) {
              // Vocal & Snare body
              const vocalWave = Math.abs(Math.sin(songTimeSec * (5.5 + i * 0.9) + i * 1.4));
              bandVal = 0.18 + snareEnv * 0.52 + vocalWave * 0.36;
            } else {
              // Presence & Hi-hat air
              const shimmer = Math.abs(Math.cos(songTimeSec * (11 + i * 1.3)));
              bandVal = 0.16 + hatEnv * 0.55 + shimmer * 0.25;
            }

            const target = Math.max(0.14, Math.min(1.0, bandVal));
            const coeff = target > smoothedBands[i] ? 0.42 : 0.2;
            smoothedBands[i] += (target - smoothedBands[i]) * coeff;
            if (eqBarNodes[i]) {
              eqBarNodes[i].style.setProperty('--eq-level', smoothedBands[i].toFixed(3));
            }
          }

          const synthBass = Math.max(0, Math.min(1, kickEnv * 0.85 + subEnv * 0.15));
          smoothedBass += (synthBass - smoothedBass) * 0.35;
          cardEl.style.setProperty('--bass-energy', smoothedBass.toFixed(3));
        }

        requestAnimationFrame(runRealtimeFrame);
      }

      requestAnimationFrame(runRealtimeFrame);

      function normalizeToMs(val) {
        const n = Number(val);
        if (!Number.isFinite(n) || n < 0) return 0;
        if (n > 0 && n < 3600) return Math.round(n * 1000);
        return Math.round(n);
      }

      function formatTimeMs(ms) {
        const totalSec = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
      }

      function updateTitleMarquee() {
        if (!songTitleEl || !titleViewportEl) return;
        songTitleEl.classList.remove('is-marquee');
        songTitleEl.style.removeProperty('--marquee-offset');
        const viewportW = titleViewportEl.clientWidth;
        const textW = songTitleEl.scrollWidth;
        if (textW > viewportW + 8 && viewportW > 0) {
          const offsetPx = -(textW - viewportW + 24);
          songTitleEl.style.setProperty('--marquee-offset', `${offsetPx}px`);
          songTitleEl.classList.add('is-marquee');
        }
      }

      function formatBadgeLabel(badge) {
        if (!badge) return '';
        if (badge === 'superfan') return 'SF';
        if (badge === 'z0-platino') return 'PLAT';
        if (badge === 'z0-vip') return 'z0VIP';
        if (badge === 'vip') return 'VIP';
        if (badge === 'donador') return '🪙 DON';
        if (badge === 'z0-fan') return 'z0';
        return badge.toUpperCase();
      }

      function updateIdleVisibility() {
        if (!stageEl) return;

      function renderTrackMetadata() {
        const isPlaying = !!playbackState.isPlaying && playbackState.hasTrack;
        cardEl.setAttribute('data-playing', isPlaying ? 'true' : 'false');

            coverImgEl.onerror = () => {

          coverFallbackEl.style.opacity = '1';
          ambientBgEl.style.backgroundImage = 'none';
          ambientOrbEl.style.backgroundImage = 'none';

          vinylLabelEl.style.backgroundImage = 'none';

        // Requester / Album Meta Row

        const showAlb = currentConfig.ciderWidgetShowAlbum !== false && !!playbackState.album;

          requesterPillEl.hidden = false;
          const cleanReq = String(playbackState.requester).replace(/^@/, '');
          requesterNameEl.textContent = `@${cleanReq}`;

          if (badge) {
            requesterBadgeEl.hidden = false;

          requesterPillEl.hidden = true;

        } else if (!showReq && !playbackState.hasTrack) {
          albumLabelEl.hidden = false;
          albumLabelEl.textContent = 'Reproduce una canción en Cider';
        } else {
          albumLabelEl.hidden = true;
        }

        updateIdleVisibility();
        requestAnimationFrame(updateTitleMarquee);

      // ─── Update Track State from Any Source (Cider Socket, REST, Bot API, Firestore) ───
      async function ingestCiderData(raw, eventType = '') {
        if (!raw) return;

        const info = raw.info || raw.attributes || raw;

        const name = String(info.name || info.title || info.songName || raw.name || raw.song || '').trim();
        const artist = String(info.artistName || info.artist || raw.artistName || raw.artist || '').trim();
        const album = String(info.albumName || info.album || raw.albumName || raw.album || '').trim();

        const rawArt =
          (info.artwork && info.artwork.url) ||
          (raw.artwork && raw.artwork.url) ||
          info.artworkUrl ||
          raw.artworkUrl ||
          '';

        const amId = String(
          (info.playParams && info.playParams.id) ||
          (raw.playParams && raw.playParams.id) ||
          info.appleMusicId ||
          raw.appleMusicId ||
          info.id ||
          ''
        ).trim();

        const durCandidate =
          info.durationInMillis ??
          info.currentPlaybackDuration ??
          info.playbackDuration ??
          info.durationMs ??
          info.duration ??
          raw.durationInMillis ??
          raw.currentPlaybackDuration ??
          raw.durationMs ??
          0;

        const posCandidate =
          info.currentPlaybackTime ??
          info.playbackTime ??
          info.positionMs ??
          info.position ??
          info.elapsedTime ??
          raw.currentPlaybackTime ??
          raw.playbackTime ??
          raw.positionMs ??
          undefined;

        const remCandidate =
          info.currentPlaybackTimeRemaining ??
          info.remainingTime ??
          info.timeRemaining ??
          info.remainingMs ??
          raw.currentPlaybackTimeRemaining ??
          raw.remainingTime ??
          raw.remainingMs ??
          undefined;

        const durMs = normalizeToMs(durCandidate);
        let posMs = posCandidate !== undefined ? normalizeToMs(posCandidate) : undefined;
        const remMs = remCandidate !== undefined ? normalizeToMs(remCandidate) : undefined;

        if (posMs === undefined && durMs > 0 && remMs !== undefined) {
          posMs = Math.max(0, durMs - remMs);
        }

        let isPlaying = playbackState.isPlaying;
        if (typeof raw.isPlaying === 'boolean') isPlaying = raw.isPlaying;
        else if (typeof info.isPlaying === 'boolean') isPlaying = info.isPlaying;
        else if (raw.state || info.state || raw.status) {
          const st = String(raw.state || info.state || raw.status).toLowerCase();
          if (st === 'playing') isPlaying = true;
          else if (st === 'paused' || st === 'stopped') isPlaying = false;
        } else if (
          eventType === 'playbackStatus.playbackTimeDidChange' ||
          eventType === 'playbackStatus.nowPlayingItemDidChange' ||
          eventType === 'playbackStatus.nowPlayingItemDidChangeV2'
        ) {
          isPlaying = true;
        }

        let trackChanged = false;
        if (name && artist) {
          const newKey = `${name}|${artist}`.toLowerCase();
          trackChanged = (newKey !== lastTrackKey);
          lastTrackKey = newKey;

          playbackState.song = name;
          playbackState.artist = artist;
          if (album) playbackState.album = album;
          else if (trackChanged) playbackState.album = '';
          if (amId) playbackState.appleMusicId = amId;
          playbackState.hasTrack = true;

          if (rawArt) {
            playbackState.artworkUrl = normalizeArtworkUrl(rawArt);
          } else if (trackChanged) {
            playbackState.artworkUrl = '';
          }

          if (trackChanged) {
            playbackState.previewUrl = '';
            fetchItunesTrackMedia(artist, name).then((media) => {
              if (`${playbackState.song}|${playbackState.artist}`.toLowerCase() !== newKey) return;
              if (!playbackState.artworkUrl && media.artworkUrl) {
                playbackState.artworkUrl = media.artworkUrl;
                renderTrackMetadata();
              }
              if (media.previewUrl) {
                playbackState.previewUrl = media.previewUrl;
                syncTrackAudioStream(media.previewUrl, playbackState.isPlaying);
              }
            });
          }

          if (raw.requester !== undefined) {
            playbackState.requester = String(raw.requester || '');
          }
          if (raw.badge !== undefined) {
            playbackState.badge = String(raw.badge || '');
          }
          if (trackChanged && !raw.requester) {
            matchRequesterFromQueue(artist, name, amId);
          }
        }

        if (durMs > 0) playbackState.durationMs = durMs;
        if (posMs !== undefined && Number.isFinite(posMs)) {
          playbackState.positionMs = posMs;
          playbackState.updatedAt = Date.now();
        } else if (trackChanged) {
          playbackState.positionMs = 0;
          playbackState.updatedAt = Date.now();
        }

        playbackState.isPlaying = isPlaying;
        syncTrackAudioStream(playbackState.previewUrl, isPlaying);

        if (trackChanged) {
          cardEl.classList.remove('track-changing');
          void cardEl.offsetWidth;
          cardEl.classList.add('track-changing');
        }

        renderTrackMetadata();
      }

      // ─── Zero FM Queue & VIP Badge Matching (Firestore) ───
      let db = null;
      const todayRequests = [];
      const badgeSets = {
        superfan: new Set(),
        'z0-platino': new Set(),
        'z0-vip': new Set(),
        vip: new Set(),
        donador: new Set(),
        'z0-fan': new Set()
      };
      let selectedBadgesMap = {};
      let userAliasesMap = {};

      function normUser(u) {
        return String(u || '').trim().replace(/^@/, '').toLowerCase();
      }

      function cleanMatch(s) {
        return String(s || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/\([\s\S]*?\)|\[[\s\S]*?\]/g, ' ')
          .replace(/\b(feat|ft|featuring|with|con|y|and|x)\b\.?/gi, ' ')
          .replace(/[^a-z0-9\s]/g, ' ')
          .replace(/\s+/g, '')
          .trim();
      }

      function resolveBadgeForUsername(username) {
        const u = normUser(username);
        if (!u) return '';
        const linked = userAliasesMap[u];
        const candidates = [u];
        if (linked) candidates.push(linked);
        for (const [tk, web] of Object.entries(userAliasesMap)) {
          if (web === u) candidates.push(tk);
        }
        for (const c of candidates) {
          if (selectedBadgesMap[c]) return selectedBadgesMap[c];
        }
        const order = ['superfan', 'z0-platino', 'z0-vip', 'vip', 'donador', 'z0-fan'];
        for (const b of order) {
          for (const c of candidates) {
            if (badgeSets[b] && badgeSets[b].has(c)) return b;
          }
        }
        return '';
      }

      function matchRequesterFromQueue(artist, song, amId) {
        if (!todayRequests.length) {
          playbackState.requester = '';
          playbackState.badge = '';
          return;
        }
        const cArt = cleanMatch(artist);
        const cSng = cleanMatch(song);
        let found = null;

        if (amId) {
          found = todayRequests.find(r => String(r.appleMusicId || '').trim() === amId);
        }
        if (!found && cArt && cSng) {
          found = todayRequests.find(r => {
            const rArt = cleanMatch(r.artista);
            const rSng = cleanMatch(r.cancion);
            if (!rArt || !rSng) return false;
            const direct = (rArt.includes(cArt) || cArt.includes(rArt)) && (rSng.includes(cSng) || cSng.includes(rSng));
            const swapped = (rArt.includes(cSng) || cSng.includes(rArt)) && (rSng.includes(cArt) || cArt.includes(rSng));
            return direct || swapped;
          });
        }

        if (found) {
          const uname = found.displayName || found.usuario || '';
          playbackState.requester = uname;
          playbackState.badge = found.badge || resolveBadgeForUsername(found.usuario || uname);
        } else {
          playbackState.requester = '';
          playbackState.badge = '';
        }
        renderTrackMetadata();
      }

      function getTodayKey() {
        try {
          const fmt = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/Mexico_City',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          });
          const parts = {};
          fmt.formatToParts(new Date()).forEach(p => { parts[p.type] = p.value; });
          return `${parts.year}-${parts.month}-${parts.day}`;
        } catch (_) {
          const d = new Date();
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
      }

      function initFirebaseSync() {
        try {
          if (typeof firebase === 'undefined') return;
          if (!firebase.apps.length) {
            const cfg = window.ZERO_FM_FIREBASE || window.firebaseConfig;
            if (cfg) firebase.initializeApp(cfg);
          }
          db = firebase.firestore();
        } catch (e) {
          console.warn('[CiderWidget] Firebase init warning:', e);
        }
        if (!db) return;

        // 1. Escuchar configuración visual desde Dashboard (systemConfig/overlayAlertsConfig)
        db.collection('systemConfig').doc('overlayAlertsConfig').onSnapshot((doc) => {
          if (!doc.exists) return;
          const data = doc.data() || {};
          const relevant = {};
          Object.keys(defaultConfig).forEach((k) => {
            if (data[k] !== undefined) relevant[k] = data[k];
          });
          if (Object.keys(relevant).length > 0) {
            applyConfig(relevant);
          }
        }, () => {});

        // 2. Escuchar estado en vivo de Cider sincronizado por el Bot (systemConfig/ciderNowPlaying)
        db.collection('systemConfig').doc('ciderNowPlaying').onSnapshot((doc) => {
          if (!doc.exists) return;
          const data = doc.data() || {};
          if (data.song || data.name) {
            ingestCiderData(data, 'firestoreSync');
          }
        }, () => {});

        // 3. Escuchar solicitudes de hoy para mostrar "Pedida por @usuario"
        const today = getTodayKey();
        db.collection('solicitudes').where('day', '==', today).onSnapshot((snap) => {
          todayRequests.length = 0;
          snap.forEach(d => todayRequests.push({ ...d.data(), docId: d.id }));
          if (playbackState.hasTrack && !playbackState.requester) {
            matchRequesterFromQueue(playbackState.artist, playbackState.song, playbackState.appleMusicId);
          }
        }, () => {});

        // 4. Escuchar colecciones de insignias VIP
        const badgeCollections = [
          ['superfanUsers', 'superfan'],
          ['z0PlatinumUsers', 'z0-platino'],
          ['z0VipUsers', 'z0-vip'],
          ['vipUsers', 'vip'],
          ['donadorUsers', 'donador'],
          ['z0FanUsers', 'z0-fan']
        ];
        badgeCollections.forEach(([col, badgeKey]) => {
          db.collection(col).onSnapshot((snap) => {
            badgeSets[badgeKey].clear();
            snap.forEach(d => {
              const name = normUser((d.data() && d.data().name) || d.id);
              if (name) badgeSets[badgeKey].add(name);
            });
            if (playbackState.requester) renderTrackMetadata();
          }, () => {});
        });

        db.collection('selectedBadges').onSnapshot((snap) => {
          const m = {};
          snap.forEach(d => {
            const data = d.data() || {};
            const k = normUser(data.name || d.id);
            if (k && data.badge) m[k] = data.badge;
          });
          selectedBadgesMap = m;
          if (playbackState.requester) renderTrackMetadata();
        }, () => {});

        db.collection('userAliases').onSnapshot((snap) => {
          const m = {};
          snap.forEach(d => {
            const data = d.data() || {};
            if (data.aliasedTo) m[normUser(d.id)] = normUser(data.aliasedTo);
          });
          userAliasesMap = m;
          if (playbackState.requester) renderTrackMetadata();
        }, () => {});
      }

      // ─── Multi-Channel Cider Connection (Socket.IO + REST + Bot Relay) ───
      const ciderSockets = new Map();

      function getCandidateCiderUrls() {
        const urls = new Set();
        if (currentConfig.ciderUrl) urls.add(String(currentConfig.ciderUrl).replace(/\/+$/, ''));
        urls.add('http://localhost:10767');
        return Array.from(urls).filter(Boolean);
      }

      function connectDirectCiderSockets() {
        if (!window.io) return;
        const candidates = getCandidateCiderUrls();
        candidates.forEach((baseUrl) => {
          if (ciderSockets.has(baseUrl)) return;
          try {
            const sock = window.io(baseUrl, {
              transports: ['websocket', 'polling'],
              reconnection: true,
              reconnectionAttempts: Infinity,
              reconnectionDelay: 1500,
              timeout: 5000
            });
            ciderSockets.set(baseUrl, sock);

            sock.on('connect', () => {
              console.log('[CiderWidget] Conectado directo a Cider Socket.IO:', baseUrl);
              try { sock.emit('get-playback'); } catch (_) {}
              pollDirectCiderRest(baseUrl);
            });

            sock.on('API:Playback', (event) => {
              if (!event) return;
              const { type, data } = event;
              if (data) ingestCiderData(data, type || '');
            });
          } catch (e) {
            console.warn('[CiderWidget] Socket init error:', e);
          }
        });
      }

      async function pollDirectCiderRest(baseUrl) {
        const cleanBase = String(baseUrl || 'http://localhost:10767').replace(/\/+$/, '');
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 1800);
          const res = await fetch(`${cleanBase}/api/v1/playback/now-playing`, { signal: ctrl.signal });
          clearTimeout(t);
          if (res.ok) {
            const json = await res.json();
            if (json && (json.info || json.name || json.data)) {
              ingestCiderData(json.info || json.data || json, 'restV2');
              return true;
            }
          }
        } catch (_) {}

        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 1800);
          const res = await fetch(`${cleanBase}/currentPlayingSong`, { signal: ctrl.signal });
          clearTimeout(t);
          if (res.ok) {
            const json = await res.json();
            if (json && (json.name || json.info || json.data)) {
              ingestCiderData(json.info || json.data || json, 'restV1');
              return true;
            }
          }
        } catch (_) {}
        return false;
      }

      async function pollBotCiderRelay() {
        const origins = [];
        if (window.location.protocol.startsWith('http')) {
          origins.push(window.location.origin);
        }
        if (!origins.includes('http://localhost:3000')) {
          origins.push('http://localhost:3000');
        }

        for (const origin of origins) {
          try {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 1800);
            const res = await fetch(`${origin}/api/cider/now-playing`, { signal: ctrl.signal });
            clearTimeout(t);
            if (res.ok) {
              const json = await res.json();
              if (json && json.ciderUrl && !currentConfig.ciderUrl) {
                currentConfig.ciderUrl = json.ciderUrl;
                connectDirectCiderSockets();
              }
              if (json && json.nowPlaying && (json.nowPlaying.song || json.nowPlaying.name)) {
                ingestCiderData(json.nowPlaying, 'botRelay');
                return true;
              }
            }
          } catch (_) {}
        }
        return false;
      }

      async function runPeriodicSync() {
        await pollBotCiderRelay();
        for (const u of getCandidateCiderUrls()) {
          await pollDirectCiderRest(u);
        }

      // ─── Simulation / Demo Track Generator ───

      });

      document.getElementById('btn-reset-cfg').addEventListener('click', () => {
        safeStorage.removeItem('zero_cider_widget_config');
        applyConfig({ ...defaultConfig, _forceThemeOverride: true });
        showToast('↺ Valores restablecidos');
      });

      // Listen for live preview messages from Bot Dashboard iframe
      window.addEventListener('message', (event) => {
        if (!event.data) return;
        unlockAudioOnGesture();
        if (event.data.action === 'simulateCider' || event.data.action === 'simulateRequest') {
          simulateTrack();
        } else if (event.data.action === 'updateConfig' && event.data.payload) {
          const payload = event.data.payload;
          const mapped = {};
          Object.keys(defaultConfig).forEach((k) => {
            if (payload[k] !== undefined) mapped[k] = payload[k];
          });
          if (Object.keys(mapped).length > 0) {
            applyConfig({ ...mapped, _forceThemeOverride: true });
          }
        }
      });

      window.addEventListener('resize', () => requestAnimationFrame(updateTitleMarquee));

      // ─── Bootstrap ───
      ensureAudioEngine();
      applyConfig(currentConfig);
      initFirebaseSync();
      connectDirectCiderSockets();
      runPeriodicSync();
      setInterval(runPeriodicSync, 3500);

      // Si el usuario ya tenía seleccionado un dispositivo de captura o ya otorgó permiso de micrófono/loopback, reconectar automáticamente
      if (currentConfig.ciderAudioDeviceId && currentConfig.ciderAudioDeviceId !== 'auto') {
        connectLiveAudioInput(currentConfig.ciderAudioDeviceId);
      } else if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'microphone' }).then((status) => {
          if (status && status.state === 'granted') {
            refreshAudioDeviceList();
          }
        }).catch(() => {});
      }

      if (urlParams.get('preview') === 'true') {
        setTimeout(() => {
          if (!playbackState.hasTrack) simulateTrack();
        }, 700);
      }
    })();
  </script>
</body>
</html>
