            if (data.topgifter_layout !== undefined) settings.topgifter_layout = data.topgifter_layout;
            if (data.topgifter_crown_style !== undefined) settings.topgifter_crown_style = data.topgifter_crown_style;
            if (data.topgifter_icon_style !== undefined) settings.topgifter_icon_style = data.topgifter_icon_style;
            if (data.topgifter_avatar_frame !== undefined) settings.topgifter_avatar_frame = data.topgifter_avatar_frame;
            if (data.topgifter_show_progress !== undefined) settings.topgifter_show_progress = data.topgifter_show_progress;
            if (data.topgifter_show_particles !== undefined) settings.topgifter_show_particles = data.topgifter_show_particles;
            if (data.topgifter_show_shimmer !== undefined) settings.topgifter_show_shimmer = data.topgifter_show_shimmer;

            rankingContainer.attr("data-style", settings.topgifter_style || "tikfinity");
            rankingContainer.attr("data-layout", settings.topgifter_layout || "list");
            rankingContainer.attr("data-frame", settings.topgifter_avatar_frame || "classic");
            rankingContainer.attr("data-progress", settings.topgifter_show_progress ? "true" : "false");
            rankingContainer.attr("data-particles", settings.topgifter_show_particles !== false ? "true" : "false");
            rankingContainer.attr("data-shimmer", settings.topgifter_show_shimmer ? "true" : "false");

            // Bordes
            const borderWidth = data.topgifterBorderWidth !== undefined ? data.topgifterBorderWidth : 1;
            const borderStyle = data.topgifterBorderStyle || 'solid';
            const borderColor = data.topgifterBorderColor || '#ffffff';
            const borderOpacity = data.topgifterBorderOpacity !== undefined ? data.topgifterBorderOpacity : 8;

            const rgbaBorderColor = hexToRgba(borderColor, borderOpacity);
            root.style.setProperty('--topgifter-border-width', borderWidth + 'px');
            root.style.setProperty('--topgifter-border-style', borderStyle);
            root.style.setProperty('--topgifter-border-color', rgbaBorderColor);

            if (data.topgifterBorderWidth !== undefined || data.topgifterBorderColor !== undefined) {
                root.style.setProperty('--topgifter-first-border-color', rgbaBorderColor);
                root.style.setProperty('--topgifter-second-border-color', rgbaBorderColor);
                root.style.setProperty('--topgifter-third-border-color', rgbaBorderColor);
            } else {
                root.style.removeProperty('--topgifter-first-border-color');
                root.style.removeProperty('--topgifter-second-border-color');
                root.style.removeProperty('--topgifter-third-border-color');
            }

            // Sombras
            const showShadow = data.topgifterShowShadow !== undefined ? data.topgifterShowShadow : true;
            if (showShadow) {
                const shadowColor = data.topgifterShadowColor || '#000000';
                const shadowBlur = data.topgifterShadowBlur !== undefined ? data.topgifterShadowBlur : 20;
                const shadowOpacity = data.topgifterShadowOpacity !== undefined ? data.topgifterShadowOpacity : 35;
                const rgbaShadowColor = hexToRgba(shadowColor, shadowOpacity);
                root.style.setProperty('--topgifter-box-shadow', `0 4px ${shadowBlur}px ${rgbaShadowColor}, inset 0 1px 0 rgba(255,255,255,0.06)`);
                root.style.removeProperty('--topgifter-first-box-shadow');
            } else {
                root.style.setProperty('--topgifter-box-shadow', 'none');
                root.style.setProperty('--topgifter-first-box-shadow', 'none');
            }

            // Mostrar Fondo
            const showBg = data.topgifterShowCardBg !== undefined ? data.topgifterShowCardBg : true;
            settings.topgifterShowCardBg = showBg;

            if (!showBg) {
                $('.rankUser').addClass('no-card-bg');
            } else {
                $('.rankUser').removeClass('no-card-bg');
            }
        }

        function mapIncomingConfig(data) {
            if (!data) return;
            applyGifterStyles(data);
            if (data.topgifter_show_crown !== undefined) settings.topgifter_showCrown = data.topgifter_show_crown;
            if (data.topgifter_show_coin_symbol !== undefined) settings.topgifter_showCoinSymbol = data.topgifter_show_coin_symbol;
            if (data.topgifter_max !== undefined) maxItems = Number(data.topgifter_max);
            if (data.topgifter_rainbow_username !== undefined) settings.topgifter_rainbow_username = data.topgifter_rainbow_username;
            if (data.topgifter_gradient_theme !== undefined) settings.topgifter_gradient_theme = data.topgifter_gradient_theme;
            if (data.topgifter_gradient_scope !== undefined) settings.topgifter_gradient_scope = data.topgifter_gradient_scope;
            if (data.topgifter_bounce_username !== undefined) settings.topgifter_bounce_username = data.topgifter_bounce_username;
            if (data.topgifter_bounce_scope !== undefined) settings.topgifter_bounce_scope = data.topgifter_bounce_scope;
            if (data.topgifter_bounce_coins !== undefined) settings.topgifter_bounce_coins = data.topgifter_bounce_coins;
            if (data.topgifter_rainbow_rank !== undefined) settings.topgifter_rainbow_rank = data.topgifter_rainbow_rank;
            if (data.topgifter_bounce_rank !== undefined) settings.topgifter_bounce_rank = data.topgifter_bounce_rank;
            if (data.topgifter_count_label !== undefined) settings.topgifter_count_label = data.topgifter_count_label;
            if (data.topgifter_first_place_color !== undefined) settings.topgifter_first_place_color = data.topgifter_first_place_color;
            if (data.topgifter_second_place_color !== undefined) settings.topgifter_second_place_color = data.topgifter_second_place_color;
            if (data.topgifter_third_place_color !== undefined) settings.topgifter_third_place_color = data.topgifter_third_place_color;
        }

        // =============================================
        //  FIREBASE FIRESTORE (Conexión al Bot)
        // =============================================
        const localFirebaseConfig = window.ZERO_FM_FIREBASE || {
            apiKey:            "AIzaSyA6c3EaIvuPEfM6sTV0YHqCBHuz35ZmNIU",
            authDomain:        "zero-strom-web.firebaseapp.com",
            projectId:         "zero-strom-web",
            storageBucket:     "zero-strom-web.firebasestorage.app",
            messagingSenderId: "758369466349",
            appId:             "1:758369466349:web:f2ced362a5a049c70b59e4"
        };

        let db = null;
        let hasFirebaseData = false;
        let unsubGifters = null;
        let unsubConfig = null;
        let initialPreviewTimeout = null;

        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    firebase.initializeApp(localFirebaseConfig);
                }
                db = firebase.firestore();
                try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (_) {}
                console.log("[Firebase] Conectado exitosamente en TopGifter ✓");

                if (unsubGifters) unsubGifters();
                unsubGifters = db.collection('globalStats').doc('topGifters').onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data && Array.isArray(data.list)) {
                            const hasRealItems = data.list.length > 0;
                            hasFirebaseData = hasRealItems;
                            if (hasRealItems && initialPreviewTimeout) {
                                clearTimeout(initialPreviewTimeout);
                                initialPreviewTimeout = null;
                            }
                            if (hasRealItems && previewInterval) {
                                clearInterval(previewInterval);
                                previewInterval = null;
                            }
                            window.lastRealRanking = data.list;
                            if (!window.isTestActive) {
                                updateRanking(data.list);
                            }
                        }
                    }
                }, err => {
                    console.warn("[Firebase] Error en onSnapshot de topGifters:", err);
                });

                if (unsubConfig) unsubConfig();
                unsubConfig = db.collection('systemConfig').doc('overlayAlertsConfig').onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        settings = Object.assign(settings, data);
                        mapIncomingConfig(data);
                        updateSettings(true);
                    }
                }, err => {
                    console.warn("[Firebase] Error en onSnapshot de overlayAlertsConfig:", err);
                });
            }
        } catch(e) {
            console.error("[Firebase] Error al iniciar Firebase:", e);
        }

        // =============================================
        //  SOCKET.IO  (Fallback de TikFinity)
        // =============================================
        var io = null;
        try {
            io = window.io ? window.io("http://localhost:21213") : null;
            if (io) {
                io.on("connect", function() {
                    io.emit("joinWidget", { cid: CID, widget: "topgifter" });
                });
                io.on("updateTopGifter", function(userList) {
                    window.lastRealRanking = userList;
                    if (!hasFirebaseData && !window.isTestActive) {
                        updateRanking(userList);
                    }
                });
                io.on("settingsUpdate", function(newSettings) {
                    settings = Object.assign(settings, newSettings);
                    mapIncomingConfig(newSettings);
                    updateSettings(true);
                });
            }
        } catch(e) {
            console.warn("[TopGifter] Socket.IO no disponible:", e);
        }

        // =============================================
        //  RENDER RANKING
        // =============================================
        function updateRanking(userList) {
            if (!template) {
                template = $("#rankTemplate").clone();
                template.removeAttr("id");
                $("#rankTemplate").remove();
            }
            if (!userList) userList = lastUserList;
            lastUserList = userList;

            var list = userList.slice(0, maxItems);

            // Actualizar atributos del contenedor
            rankingContainer.attr("data-style", settings.topgifter_style || "tikfinity");
            rankingContainer.attr("data-layout", settings.topgifter_layout || "list");
            rankingContainer.attr("data-frame", settings.topgifter_avatar_frame || "classic");
            rankingContainer.attr("data-progress", settings.topgifter_show_progress ? "true" : "false");
            rankingContainer.attr("data-particles", settings.topgifter_show_particles !== false ? "true" : "false");
            rankingContainer.attr("data-shimmer", settings.topgifter_show_shimmer ? "true" : "false");

            // 1. Eliminar usuarios que ya no están en el top
            const newUsernames = new Set(list.map(u => u.username));
            $(".rankUser:not(#rankTemplate)").each(function() {
                const username = $(this).attr("data-username");
                if (username && !newUsernames.has(username)) {
                    $(this).fadeOut(150, function() { $(this).remove(); });
                }
            });

            if (list.length === 0) {
                const urlParams = new URLSearchParams(window.location.search);
                const isPreviewRequested = urlParams.get('preview') === '1' || urlParams.get('preview') === 'true' || urlParams.get('test') === '1';
                if (isPreviewRequested || !hasFirebaseData) {
                    if (!previewInterval && !window.isTestActive) {
                        window.preview();
                    }
                } else {
                    $('#emptyState').fadeIn(200);
                }
                return;
            } else {
                $('#emptyState').hide();
            }

            const maxAmount = Math.max(1, parseFloat(list[0]?.totalAmount) || 1);
            const crownSvgUrl = CROWN_SVGS[settings.topgifter_crown_style] || CROWN_SVGS["tikfinity"];
            const coinSvgHtml = ICON_SVGS[settings.topgifter_icon_style] || ICON_SVGS["tiktok-coin"];

            // 2. Procesar cada usuario de la lista en orden
            list.forEach(function(user, idx) {
                const rank = idx + 1;
                let card = $(`.rankUser[data-username="${user.username}"]`);
                let isNew = false;

                if (card.length === 0) {
                    card = template.clone();
                    card.removeAttr("id");
                    card.attr("data-username", user.username);
                    card.find(".avatar-laurel").html(LAUREL_SVG);
                    isNew = true;
                } else {
                    card.stop(true, true);
                }

                card.attr("data-rank", rank);

                // Clases de posición
                card.removeClass("first-place second-place third-place");
                if (rank === 1) card.addClass("first-place");
                if (rank === 2) card.addClass("second-place");
                if (rank === 3) card.addClass("third-place");

                // Pedestal text (para modo Podio)
                const pedestalLabel = rank === 1 ? "🥇 1°" : rank === 2 ? "🥈 2°" : rank === 3 ? "🥉 3°" : (rank + "°");
                card.find(".pedestal-rank").text(pedestalLabel);

                // Rank number / trophy
                const $rankId = card.find(".rankId");
                if (settings.topgifter_showTrophy && rank <= 3) {
                    const trophyEmoji = rank === 1 ? "🥇" : rank === 2 ? "🥈" : "🥉";
                    $rankId.html('<span style="font-size:1.05em">' + trophyEmoji + '</span>');
                } else {
                    $rankId.text(rank);
                }
                $rankId.toggle(settings.topgifter_showRank !== false);

                $rankId.removeClass("rainbow-bg bounce-rank");
                $rankId.css("background", "");

                if (settings.topgifter_rainbow_rank) {
                    $rankId.addClass("rainbow-bg");
                }
                if (settings.topgifter_bounce_rank) {
                    $rankId.addClass("bounce-rank");
                }

                if (!settings.topgifter_rainbow_rank) {
                    if (rank === 1 && settings.topgifter_first_place_color) {
                        $rankId.css("background", makeGradient(settings.topgifter_first_place_color));
                    } else if (rank === 2 && settings.topgifter_second_place_color) {
                        $rankId.css("background", makeGradient(settings.topgifter_second_place_color));
                    } else if (rank === 3 && settings.topgifter_third_place_color) {
                        $rankId.css("background", makeGradient(settings.topgifter_third_place_color));
                    }
                }

                // Avatar
                const picUrl = user.profilePictureUrl || NOTHUMB;
                const $pic = card.find(".profilePicture");
                if (isNew || $pic.attr("src") !== picUrl) {
                    $pic.off("error").on("error", function() {
                        $(this).attr("src", NOTHUMB);
                    }).attr("src", picUrl);
                }

                // Crown (only rank 1)
                const $crown = card.find(".crown1");
                if ($crown.attr("src") !== crownSvgUrl) {
                    $crown.attr("src", crownSvgUrl);
                }
                if (rank === 1 && settings.topgifter_showCrown !== false) {
                    $crown.css("display", "block");
                } else {
                    $crown.css("display", "none");
                }

                // Sparkle for 1st
                let $sparkle = card.find(".sparkle");
                if (rank === 1) {
                    if ($sparkle.length === 0) {
                        card.append('<span class="sparkle">✨</span>');
                    }
                } else {
                    $sparkle.remove();
                }

                // Username
                const displayName = settings.showUserNicknames === false
                    ? ("@" + user.username)
                    : (user.nickname || ("@" + user.username));
                const $usernameEl = card.find(".username");

                const GRADIENT_CLASSES = ['rainbow-text','silver-text','rose-text','pearl-text','sky-text','gold-text','cyber-text','fire-text'];
                $usernameEl.removeClass(GRADIENT_CLASSES.join(' '));
                const gradTheme = (settings.topgifter_gradient_theme && settings.topgifter_gradient_theme !== 'none')
                    ? settings.topgifter_gradient_theme
                    : (settings.topgifter_rainbow_username ? 'rainbow' : 'none');
                const gradScope = settings.topgifter_gradient_scope || 'all';
                const applyGrad = gradTheme !== 'none' && (gradScope === 'all' || rank <= 3);
                if (applyGrad) {
                    $usernameEl.addClass(gradTheme + '-text');
                }

                const bounceScope = settings.topgifter_bounce_scope || 'all';
                const applyBounce = settings.topgifter_bounce_username && (bounceScope === 'all' || rank <= 3);
                if (applyBounce) {
                    $usernameEl.addClass("has-bounce-letters");
                    $usernameEl.empty();
                    const chars = displayName.split("");
                    chars.forEach((char, charIdx) => {
                        const $span = $("<span>").text(char === " " ? "\u00A0" : char);
                        $span.addClass("bounce-letter");
                        $span.css("--bounce-delay", (charIdx * 0.08) + "s");
                        $usernameEl.append($span);
                    });
                } else {
                    $usernameEl.removeClass("has-bounce-letters");
                    $usernameEl.text(displayName);
                }

                // Points / Coins
                const amount = parseFloat(user.totalAmount) || 0;
                const $amountSpan = card.find(".coin-amount");
                const oldAmount = parseFloat($amountSpan.attr("data-prev-amount")) || 0;

                $amountSpan.text(amount.toLocaleString("es-MX"));
                $amountSpan.attr("data-prev-amount", amount);

                // Progress bar width
                const pct = Math.max(8, Math.min(100, Math.round((amount / maxAmount) * 100)));
                card.find(".rank-progress-bar").css("width", pct + "%");

                if (!isNew && amount > oldAmount && settings.topgifter_bounce_coins !== false) {
                    const $pointsDiv = card.find(".points");
                    $pointsDiv.addClass("heartbeat-active");
                    setTimeout(() => {
                        $pointsDiv.removeClass("heartbeat-active");
                    }, 350);
                }

                const $coinIcon = card.find(".coin-icon");
                if ($coinIcon.attr("data-icon") !== (settings.topgifter_icon_style || "tiktok-coin")) {
                    $coinIcon.html(coinSvgHtml);
                    $coinIcon.attr("data-icon", settings.topgifter_icon_style || "tiktok-coin");
                }

                const $currLabel = card.find(".currency-label");
                const customLabel = settings.topgifter_count_label !== undefined && settings.topgifter_count_label !== ""
                    ? settings.topgifter_count_label
                    : currency;

                if (settings.topgifter_showCoinSymbol === false) {
                    $coinIcon.hide();
                    $currLabel.text(" " + (customLabel || "Coins"));
                } else {
                    $coinIcon.show();
                    $currLabel.text(customLabel ? (" " + customLabel) : "");
                }

                card.find(".points").toggle(settings.topgifter_showCoins !== false);

                if (settings.topgifterShowCardBg === false) {
                    card.addClass("no-card-bg");
                } else {
                    card.removeClass("no-card-bg");
                }

                if (settings.topgifter_rankColor) card.find(".rankId").css("color", settings.topgifter_rankColor);
                if (settings.topgifter_pointsColor) card.find(".points").css("color", settings.topgifter_pointsColor);
                if (settings.topgifter_usernameColor) card.find(".username").css("color", settings.topgifter_usernameColor);

                rankingContainer.append(card);

                if (isNew) {
                    card.addClass("animate-in");
                    card.removeAttr('style');
                    card.css({ display: "flex", opacity: 0 }).animate({ opacity: 1 }, 180);
                } else {
                    card.removeClass("animate-in");
                    card.css({ display: "flex", opacity: 1 });
                }
            });

            setupSpotlightRotation();
        }

        function updateSettings(hasChanges) {
            if (settings.topgifter_rankColor)   $(".rankId").css("color", settings.topgifter_rankColor);
            if (settings.topgifter_pointsColor) $(".points").css("color", settings.topgifter_pointsColor);
            if (settings.topgifter_usernameColor) $(".username").css("color", settings.topgifter_usernameColor);

            if (hasChanges) {
                lastRankingJson = null;
                updateRanking();
            }
        }

        // =============================================
        //  INIT & PREVIEW
        // =============================================
        $(function() {
            if (!template) {
                template = $("#rankTemplate").clone();
                template.removeAttr("id");
                $("#rankTemplate").remove();
            }

            applyGifterStyles(settings);
            updateSettings(false);

            const urlParams = new URLSearchParams(window.location.search);
            const isPreviewParam = urlParams.get('preview') === '1' || urlParams.get('preview') === 'true' || urlParams.get('test') === '1';

            if (initialPreviewTimeout) clearTimeout(initialPreviewTimeout);
            if (isPreviewParam) {
                window.preview && window.preview();
            } else {
                initialPreviewTimeout = setTimeout(function() {
                    initialPreviewTimeout = null;
                    if (!hasFirebaseData && (!window.lastRealRanking || window.lastRealRanking.length === 0)) {
                        window.preview && window.preview();
                    }
                }, 1500);
            }
        });

        window.isTestActive = false;
        let testTimeout = null;

        function runTemporaryTest() {
            window.isTestActive = true;
            if (testTimeout) clearTimeout(testTimeout);
            window.preview();
            testTimeout = setTimeout(() => {
                window.isTestActive = false;
                if (previewInterval) {
                    clearInterval(previewInterval);
                    previewInterval = null;
                }
                if (window.lastRealRanking) {
                    updateRanking(window.lastRealRanking);
                } else {
                    updateRanking([]);
                }
            }, 10000);
        }

        let previewInterval = null;
        window.preview = function() {
            if (previewInterval) clearInterval(previewInterval);

            const firstNames = ["Zero", "Donador", "Música", "TikTok", "Gifter", "Super", "Night", "Fan", "Sponsor", "VIP"];
            const lastNames = ["FM", "Lover", "Pro", "Star", "King", "Owl", "Vida", "Activo", "Zero", "Collector"];

            const count = 7;
            const list = [];
            for (let i = 0; i < count; i++) {
                const fn = firstNames[i % firstNames.length];
                const ln = lastNames[i % lastNames.length];
                const username = (fn + "_" + ln + (i + 10)).toLowerCase();
                const nickname = fn + " " + ln;
                const randomPicId = 10 + i;

                list.push({
                    username: username,
                    nickname: nickname,
                    profilePictureUrl: `https://i.pravatar.cc/100?img=${randomPicId}`,
                    totalAmount: 5000 - i * 550
                });
            }

            list.sort((a, b) => b.totalAmount - a.totalAmount);
            updateRanking(list);

            previewInterval = setInterval(() => {
                if (hasFirebaseData) {
                    clearInterval(previewInterval);
                    return;
                }
                const randomUserIndex = Math.floor(Math.random() * list.length);
                const extraAmount = Math.floor(Math.random() * 300) + 50;
                list[randomUserIndex].totalAmount += extraAmount;

                if (Math.random() > 0.8) {
                    const fn = firstNames[Math.floor(Math.random() * firstNames.length)];
                    const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
                    const username = (fn + "_" + ln + Math.floor(Math.random() * 90 + 10)).toLowerCase();
                    const nickname = fn + " " + ln;
                    const randomPicId = Math.floor(Math.random() * 70) + 1;

                    list[list.length - 1] = {
                        username: username,
                        nickname: nickname,
                        profilePictureUrl: `https://i.pravatar.cc/100?img=${randomPicId}`,
                        totalAmount: list[list.length - 2].totalAmount - 20
                    };
                }

                list.sort((a, b) => b.totalAmount - a.totalAmount);
                updateRanking(list);
            }, 3000);
        };

        // Receptor de eventos postMessage para vista previa en tiempo real
        window.addEventListener('message', function(event) {
            if (!event.data) return;

            if (event.data.action === 'triggerTestTopGifters' || event.data.action === 'triggerTestAlert') {
                runTemporaryTest();
            } else if (event.data.action === 'updateLiveConfig' || event.data.action === 'updateConfig') {
                const data = event.data.config || event.data.payload || {};
                mapIncomingConfig(data);
                updateSettings(true);
            }
        });
    </script>
